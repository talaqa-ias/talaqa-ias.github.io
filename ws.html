<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>طلاقة · ورشة الكتابة</title>
<link rel="icon" href="img/icon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap');
:root{--bg:#EAF6FF;--card:#FFFFFF;--ink:#1D2B4F;--muted:#5B6B8C;--line:#D3E4F5;--soft:#FFF4D1;--sky:#2F9BF0;--grass:#22B866;--sun:#FFC83D;--coral:#FF6B6B;--grape:#8E5CF7;--ok-soft:#DDF7E8;--bad-soft:#FFE3E3;
 --l1:#22B866;--l2:#2F9BF0;--l3:#8E5CF7;
 --ui:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;--read:"Noto Naskh Arabic","Traditional Arabic",serif;color-scheme:light}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--ui);font-size:17px;line-height:1.55;direction:rtl;padding-inline:16px;padding-block:0 120px}
*{box-sizing:border-box}#app{max-width:880px;margin-inline:auto}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
h1{font-size:1.8rem;margin:6px 0 2px;font-weight:800}h2{font-size:1.3rem;margin:0 0 8px;font-weight:800}h3{margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 12px}.note{color:var(--muted);font-size:.95rem}
.top{display:flex;align-items:center;gap:8px;padding-block:14px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;text-decoration:none;color:var(--ink)}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 5px 0 var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:18px;padding:12px 22px;font-weight:800;font-size:1.1rem;background:var(--grass);color:#fff;min-height:52px;box-shadow:0 5px 0 #168A4B}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.sm{min-height:40px;padding:6px 14px;font-size:.95rem;border-radius:12px;box-shadow:0 3px 0 #168A4B}.btn.alt.sm{box-shadow:0 3px 0 var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.steps{display:flex;gap:4px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:thin}
.st{flex:1 0 auto;min-width:84px;border:2px solid var(--line);background:#fff;border-radius:14px;padding:4px 6px;text-align:center;font-weight:700;font-size:.85rem;line-height:1.3}
.st b{display:block;font-size:1.3rem}
.st.cur{border-color:var(--sky);background:#EAF4FF;box-shadow:0 0 0 3px #BFE0FF}.st.done{border-color:var(--grass);background:#F2FBF5}.st[disabled]{opacity:.5;cursor:not-allowed}
.pic{width:100%;max-height:360px;object-fit:cover;border-radius:18px;border:2px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.gen{border:3px solid var(--line);border-radius:20px;background:#fff;padding:14px;text-align:right;box-shadow:0 5px 0 var(--line)}
.gen .i{font-size:2.2rem;line-height:1}.gen h3{font-family:var(--read);margin:6px 0 2px}
.task{border:3px solid var(--line);border-radius:20px;background:#fff;overflow:hidden;box-shadow:0 5px 0 var(--line)}
.task img{width:100%;height:150px;object-fit:cover;display:block}.task .b{padding:10px 12px}
.lvs{display:flex;gap:6px;margin-top:8px}
.lvb{flex:1;border:2px solid var(--c);background:#fff;color:var(--ink);border-radius:12px;padding:4px 2px;font-weight:800;font-size:.9rem;line-height:1.25}
.lvb small{display:block;font-weight:600;color:var(--muted);font-size:.75rem}
.lvb.done{background:var(--c);color:#fff}.lvb.done small{color:#fff}
.lvtag{display:inline-block;border-radius:999px;padding:2px 12px;font-weight:800;color:#fff;background:var(--c)}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.levels div{border:2px solid var(--c);border-radius:16px;padding:10px;background:#fff}
.q{font-weight:800;font-size:1.15rem;margin:10px 0 6px;font-family:var(--read)}
.cards{display:flex;flex-wrap:wrap;gap:8px}
.ic{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-family:var(--read);font-weight:700;font-size:1.05rem}
.ic.on{background:var(--sky);border-color:var(--sky);color:#fff}
.in{width:100%;border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff;font-family:var(--read);font-size:1.1rem}
textarea.in{min-height:110px;line-height:1.9;resize:vertical}
.para{border-inline-start:8px solid var(--c);background:#fff;border-radius:16px;padding:12px 14px;margin:12px 0;border-top:2px solid var(--line);border-bottom:2px solid var(--line);border-inline-end:2px solid var(--line)}
.para .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.tag{background:var(--c);color:#fff;border-radius:999px;padding:2px 12px;font-weight:800}
.tip{color:var(--muted);font-family:var(--read)}
.src{font-family:var(--read);font-size:1.2rem;line-height:2.1}.src p{margin:0 0 8px;text-indent:1.2em}
.model p{font-family:var(--read);font-size:1.25rem;line-height:2.1;margin:0}
.model .role{font-family:var(--ui);font-size:.75rem;background:var(--soft);border-radius:8px;padding:0 6px;margin-inline-start:4px;color:#8A5A00;white-space:nowrap}
.lk{font-weight:800;color:#B03A9E;text-decoration:underline;text-decoration-thickness:2px}
.planbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.pb{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px}
.pb h3{font-size:1.05rem}
.mini{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.mc{border:1.5px solid var(--line);background:#F7FBFF;border-radius:999px;padding:2px 10px;font-family:var(--read);font-size:.95rem}
.mc.k{background:#FFF0FA;border-color:#F3C6E8}.mc.f{background:#FFF4D1;border-color:#F5DB8E}
.frame{display:block;width:100%;text-align:right;border:2px dashed var(--line);background:#FBFDFF;border-radius:12px;padding:6px 10px;margin:4px 0;font-family:var(--read);font-size:1.05rem}
.fr2{border:2px dashed var(--l1);background:#F5FCF8;border-radius:12px;padding:8px 10px;margin:6px 0;font-family:var(--read);font-size:1.1rem;line-height:2.2;display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.fr2 select{border:2px solid var(--l1);border-radius:10px;background:#fff;padding:0 6px;font-family:var(--read);font-size:1.05rem;max-width:100%}
.fr2 .btn{margin-inline-start:auto}
.chal{border:3px solid var(--l3);background:#F6F1FF;border-radius:16px;padding:10px 14px;margin:10px 0}
.cnt{font-size:.85rem;color:var(--muted)}
.fb{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.fb li{border-radius:12px;padding:6px 10px;background:var(--ok-soft)}.fb li.w{background:#FFF1CC}
.ck{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;width:100%;text-align:right;font-family:var(--read);font-size:1.05rem;margin:5px 0}
.ck .bx{width:26px;height:26px;border-radius:8px;border:3px solid var(--line);flex:0 0 26px;display:grid;place-items:center;font-family:var(--ui)}
.ck.on{border-color:var(--grass);background:#F2FBF5}.ck.on .bx{background:var(--grass);border-color:var(--grass);color:#fff}.ck.on .bx::after{content:"✓"}
.nb{border:3px solid var(--sun);background:#FFFBEA;border-radius:16px;padding:10px;margin-top:12px}
.final{background:#fff;border-radius:20px;border:2px solid var(--line);padding:20px}
.final h2{text-align:center;font-family:var(--read);font-size:1.6rem}
.final p{font-family:var(--read);font-size:1.25rem;line-height:2.1;text-indent:1.5em;margin:0 0 10px}
.final p.ln{text-indent:0}.al-l{text-align:left}.al-c{text-align:center}
.bad{background:#FFE3E3;border-bottom:2px solid var(--coral);border-radius:4px}
.qz{display:flex;flex-direction:column;gap:10px}
.qz .it{border:2px solid var(--line);border-radius:14px;padding:8px 10px;background:#fff}
.qz .it.ok{border-color:var(--grass);background:#F2FBF5}.qz .it.no{border-color:var(--coral);background:#FFF5F5}
.navb{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:14px}
details summary{cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app"></div>
<script src="nav.js"></script>
<script src="back.js"></script>
<script>
(function(){'use strict';
function get(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function put(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fnv(s){var h=0x811c9dc5;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h.toString(16)}
function ymd(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
var DIA=/[ً-ْٰـ]/g;function bare(s){return String(s||'').replace(DIA,'').replace(/\s+/g,' ').trim()}
var $app=document.getElementById('app'),player=new Audio();
function play(a){if(!a)return;try{player.pause();player.src=a;player.currentTime=0;var p=player.play();if(p&&p.catch)p.catch(function(){})}catch(e){}}

/* ---------- الطالب ---------- */
var ME=get('pt_me',null);
var qs=new URLSearchParams(location.search),PREV=qs.get('g');
function gradeOf(sec){var m=/^G(\d)/i.exec(String(sec||''));return m?'g'+m[1]:null}
var G=PREV||(ME&&!ME.pv?gradeOf(ME.sec):null);
var WHO=PREV?'preview|'+PREV:(ME?ME.sec+'|'+ME.name:'');

/* ---------- الإرسال ---------- */
var URL_=null;
function cfg(){if(URL_!==null)return Promise.resolve(URL_);return fetch('send-config.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(c){URL_=String(c.progress||'');return URL_}).catch(function(){URL_='';return ''})}
var Q=get('ws_q',[]);
function send(ev){if(PREV||!ME||!ME.c||!ME.p)return;ev.d=ymd();Q.push(ev);put('ws_q',Q);flush()}
var busy=false;
function flush(){if(busy||!Q.length||!ME||!ME.c)return;busy=true;var batch=Q.slice(0,20);
 cfg().then(function(url){if(!url){busy=false;return}
  return fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},keepalive:true,body:JSON.stringify({sec:ME.sec,sid:fnv('sid|'+ME.sec+'|'+ME.name+'|'+ME.c),pf:fnv('ap|'+ME.sec+'|'+ME.name+'|'+ME.c+'|'+ME.p),g:(G||'').toUpperCase(),ev:batch})})
   .then(function(r){return r.json()}).then(function(j){if(j&&j.ok){Q=Q.slice(batch.length);put('ws_q',Q)}}).catch(function(){}).then(function(){busy=false})})}
setInterval(flush,30000);document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')flush()});

/* ---------- الحالة ---------- */
var D=null,DICT=null,GEN=null,T=null,LV=2,S=null,last=null;
var LVN={1:['🌱','مبتدئ','مساعدة كثيرة','var(--l1)'],2:['🌿','متوسط','مساعدة أقل','var(--l2)'],3:['🌳','متقدم','أكتب وحدي','var(--l3)']};
var LVD={1:'نموذج قصير، وأفكار جاهزة أختار منها، وجمل ناقصة أكملها باختيار الكلمات.',2:'نموذج أطول، وأفكار أختار منها وأضيف إليها، وبدايات جمل أكملها بنفسي.',3:'نموذج غني، وأسئلة توجّهني فقط، وأكتب وحدي، ومعي تحدٍّ إضافي.'};
var STEPS=[['ex','🔍','أستكشف'],['mo','📖','أتعلّم من نموذج'],['pl','🗺️','أخطّط'],['dr','✏️','أكتب المسودة'],['rv','🔁','أراجع وأنقّح'],['ed','🔤','أدقّق'],['pub','🌟','أنشر']];
function skey(t,l){return 'ws2|'+WHO+'|'+t.id+'|'+l}
function load(){S=get(skey(T,LV),null);if(!S){S={st:0,max:0,ideas:{},own:{},plan:{},dr:{},v1:null,ck:{},nb:{},qz:{},sent:0,rev:{}};}PARTS().forEach(function(p){if(S.dr[p.id]==null)S.dr[p.id]=''})}
function save(){if(T)put(skey(T,LV),S)}
function PARTS(){return GEN.parts}
function paraParts(){return GEN.parts.filter(function(p){return p.kind!=='line'})}
function minW(p){var m=p.min||[0,0,0];return m[LV-1]||0}
function gstat(t){var r={};[1,2,3].forEach(function(l){r[l]=get(skey(t,l),null)});return r}

/* ---------- أدوات النص ---------- */
function words(s){return bare(s).replace(/[^ء-ي\s]/g,' ').split(/\s+/).filter(Boolean)}
function sents(s){return String(s||'').split(/[.!؟\n]+/).map(function(x){return x.trim()}).filter(function(x){return words(x).length>1})}
var BASEL=['ثم','بعد ذلك','عندما','لأن','لذلك','لكن','وفجأة','فجأة','أخيرا','في النهاية','عندئذ','بينما','حين','حتى','أيضا','كما','أولا','ثانيا','ثالثا','منذ ذلك اليوم','إضافة إلى ذلك','مثل','بسبب','لهذا','إذن','أما','على سبيل المثال'];
function linkSet(){return (GEN.link||[]).map(bare).concat(BASEL)}
function linksUsed(t){var b=' '+bare(t).replace(/[.,،!؟:«»]/g,' ')+' ',u=[];linkSet().forEach(function(l){var x=l.replace(/^و/,'');if(x.length>1&&(b.indexOf(' '+x+' ')>=0||b.indexOf(' و'+x+' ')>=0||b.indexOf(' ف'+x+' ')>=0)&&u.indexOf(x)<0)u.push(x)});return u}
var STOP=' في من إلى على عن مع و ثم هو هي كان كانت أن أنه لا ما قد هذا هذه ذلك التي الذي يا قال كل بعد عند لم لن أنا نحن '.split(' ');
function repeats(t){var c={};words(t).forEach(function(w){w=w.replace(/^(و|ف|ب|ل|ال|وال|بال|فال)/,'');if(w.length<3||STOP.indexOf(w)>=0)return;c[w]=(c[w]||0)+1});return Object.keys(c).filter(function(w){return c[w]>=4})}
function stem(w){var c=[w];[/^(و|ف)/,/^(ب|ل|ك)/,/^(ال)/].forEach(function(re){c.slice().forEach(function(x){var y=x.replace(re,'');if(y!==x&&y.length>1)c.push(y)})});c.slice().forEach(function(x){['ها','هم','هما','ه','ي','ك','نا','كم','ات','ون','ين','ان','ة'].forEach(function(s){if(x.length>s.length+1&&x.slice(-s.length)===s)c.push(x.slice(0,-s.length))})});return c}
function known(w){if(!DICT)return true;var c=stem(w);for(var i=0;i<c.length;i++){if(DICT[c[i]]||DICT['ال'+c[i]])return true}return false}
function spell(t){var out=[];words(t).forEach(function(w){if(w.length<3||known(w)||out.some(function(o){return o.w===w}))return;var hint='';
 if(/ه$/.test(w)&&known(w.slice(0,-1)+'ة'))hint='هل تقصد التاء المربوطة (ـة)؟';else if(/ة$/.test(w)&&known(w.slice(0,-1)+'ه'))hint='هل تقصد الهاء (ـه)؟';
 else if(/ي$/.test(w)&&known(w.slice(0,-1)+'ى'))hint='هل تقصد الألف اللينة (ى)؟';else if((function(){var m=/^(و|ف|ب|ل)?ا(.*)$/.exec(w);return m&&(known((m[1]||'')+'أ'+m[2])||known((m[1]||'')+'إ'+m[2])||known('أ'+m[2])||known('إ'+m[2]))})())hint='انتبه إلى همزة القطع (أ / إ).';
 else if(/[أإآ]/.test(w)&&known(w.replace(/[أإآ]/g,'ا')))hint='هل هي همزة وصل بلا علامة؟';out.push({w:w,hint:hint})});return out}
function allText(){return PARTS().map(function(p){return S.dr[p.id]||''}).join('\n')}

/* ---------- واجهات ---------- */
function lvTag(l){return '<span class="lvtag" style="--c:'+LVN[l][3]+'">'+LVN[l][0]+' '+LVN[l][1]+'</span>'}
function top(){return '<div class="top">'+(window.TQB?TQB.btn('chip'):'')+'<a class="chip" href="index.html">→ أدواتي</a>'+(GEN?'<button class="chip" data-a="home">🧩 أنواع النصوص</button>':'')+(T?'<button class="chip" data-a="gen" data-g="'+GEN.id+'">'+esc(GEN.icon||'')+' مهام '+esc(GEN.short||'النوع')+'</button>':'')+'<span class="chip" style="margin-inline-start:auto">'+(PREV?'معاينة · '+esc(PREV.toUpperCase()):esc(ME&&ME.name||''))+'</span></div>'}
function stepsBar(){return '<div class="steps">'+STEPS.map(function(s,i){return '<button class="st'+(i===S.st?' cur':i<=S.max?' done':'')+'" data-a="go" data-i="'+i+'"'+(i>S.max?' disabled':'')+'><b>'+s[1]+'</b>'+s[2]+'</button>'}).join('')+'</div>'}
function nav(ok,label,why){return '<div class="navb">'+(S.st>0?'<button class="btn alt" data-a="go" data-i="'+(S.st-1)+'">→ السابق</button>':'<span></span>')+'<button class="btn" data-a="next"'+(ok?'':' disabled')+'>'+(label||'التالي ←')+'</button></div>'+(!ok&&why?'<p class="note" id="why" style="text-align:left">'+esc(why)+'</p>':'')}
function nbBox(k,t){var on=S.nb[k];return '<div class="nb"><button class="ck'+(on?' on':'')+'" data-a="nb" data-k="'+k+'"><span class="bx"></span><span>📓 '+esc(t)+'</span></button></div>'}

function vHome(){var h=top()+'<h1>🧩 ورشة الكتابة</h1><p class="lead">اختر نوع النص الذي ستكتبه. في كل نوع: أستكشف، وأتعلّم من نموذج، وأخطّط، وأكتب المسودة، وأراجعها، وأدقّقها، ثم أنشر نصّي وأكتبه في دفتري.</p><div class="grid">';
 D.genres.forEach(function(g){var n=0,tot=g.tasks.length;g.tasks.forEach(function(t){var s=gstat(t);if(s[1]&&s[1].sent||s[2]&&s[2].sent||s[3]&&s[3].sent)n++});
  h+='<button class="gen" data-a="gen" data-g="'+g.id+'"><div class="i">'+esc(g.icon||'📝')+'</div><h3>'+esc(g.name)+'</h3><span class="note">'+esc(g.about||'')+'</span><p class="note" style="margin:6px 0 0"><b>'+n+'</b> من '+tot+' مهام منشورة</p></button>'});
 return h+'</div>'}

function vGen(){var h=top()+'<h1 style="font-family:var(--read)">'+esc(GEN.icon||'')+' '+esc(GEN.name)+'</h1><p class="lead">'+esc(GEN.about||'')+'</p>';
 h+='<div class="card"><h2>اختر مستواك في كل مهمة</h2><div class="levels">'+[1,2,3].map(function(l){return '<div style="--c:'+LVN[l][3]+'">'+lvTag(l)+'<p class="note" style="margin:6px 0 0">'+LVD[l]+'</p></div>'}).join('')+'</div><p class="note" style="margin-bottom:0">ابدأ بالمستوى الذي يقترحه معلمك. حين تتقن مستوى، جرّب الأعلى منه.</p></div>';
 h+='<details class="card"><summary><b>ماذا سأتعلّم؟ (نواتج الوثيقة الوطنية)</b></summary><ul>'+GEN.outcomes.map(function(o){return '<li>'+esc(o)+'</li>'}).join('')+'</ul></details>';
 h+='<div class="grid">'+GEN.tasks.map(function(t){var s=gstat(t);return '<div class="task">'+(t.img?'<img src="'+esc(t.img)+'" alt="">':'')+'<div class="b"><h3 style="font-family:var(--read)">'+esc(t.title)+'</h3><div class="lvs">'+[1,2,3].map(function(l){var x=s[l];return '<button class="lvb'+(x&&x.sent?' done':'')+'" style="--c:'+LVN[l][3]+'" data-a="open" data-t="'+t.id+'" data-l="'+l+'">'+LVN[l][0]+' '+LVN[l][1]+'<small>'+(x&&x.sent?'🌟 نُشر':x?STEPS[Math.min(x.max,6)][2]:'ابدأ')+'</small></button>'}).join('')+'</div></div></div>'}).join('')+'</div>';

 if(a==='home'){GEN=null;T=null;S=null;render();window.scrollTo(0,0);return}
 if(a==='gen'){GEN=findGen(b.dataset.g);T=null;S=null;render();window.scrollTo(0,0);return}
 if(a==='open'){T=GEN.tasks.filter(function(t){return t.id===b.dataset.t})[0];LV=+b.dataset.l||2;load();render();window.scrollTo(0,0);return}
 if(!S)return;
 if(a==='go'){go(+b.dataset.i);return}
 if(a==='next'){if(S.st<6)go(S.st+1);return}
 if(a==='idea'){var q=b.dataset.q,c=b.dataset.c,l=S.ideas[q]=S.ideas[q]||[],i=l.indexOf(c);if(i>=0)l.splice(i,1);else l.push(c);save();keep();return}
 if(a==='reveal'){S.rev[b.dataset.q]=1;save();keep();return}
 if(a==='addidea'){var q2=b.dataset.q,inp=document.getElementById('own-'+q2),v=inp&&inp.value.trim();if(!v)return;(S.own[q2]=S.own[q2]||[]).push(v);(S.ideas[q2]=S.ideas[q2]||[]).push(v);save();keep();return}
 if(a==='qz'){S.qz[b.dataset.i]=b.dataset.v;save();keep();return}
 if(a==='nb'){S.nb[b.dataset.k]=!S.nb[b.dataset.k];save();keep();return}
 if(a==='ck'){S.ck[b.dataset.i]=!S.ck[b.dataset.i];save();keep();return}
 if(a==='setpart'){S.dr[b.dataset.p]=b.dataset.v;save();keep();return}
 if(a==='addfr'){var box=b.closest('.fr2'),f=T.frames[b.dataset.p][+b.dataset.i],sels=box.querySelectorAll('select'),bits=f.s.split('____'),out='';bits.forEach(function(x,j){out+=x;if(j<bits.length-1)out+=(sels[j]&&sels[j].value)||'____'});
  var el=document.getElementById('dr-'+b.dataset.p);if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length)}catch(x){}insert(el,out.trim())}return}
 if(a==='plc'){var pf=b.dataset.pf,ins=[].slice.call(document.querySelectorAll('[data-pl="'+pf+'"]'));if(!ins.length)return;
  var el3=(last&&last.dataset&&last.dataset.pl===pf&&document.body.contains(last))?last:null;
  if(!el3)el3=ins.filter(function(x){return !x.value.trim()})[0]||ins[ins.length-1];
  if(ins.length>1&&el3.value.trim()&&el3!==last){var em=ins.filter(function(x){return !x.value.trim()})[0];if(em)el3=em}
  el3.value=el3.value.trim()?el3.value.trim()+'، '+b.dataset.v:b.dataset.v;el3.dispatchEvent(new Event('input',{bubbles:true}));
  var k=ins.indexOf(el3);last=(ins.length>1&&k<ins.length-1)?ins[k+1]:el3;ins.forEach(function(x){x.style.borderColor=''});if(ins.length>1)last.style.borderColor='var(--sky)';return}
 if(a==='ins'){var el2=b.dataset.t?document.getElementById(b.dataset.t):last;if(el2&&el2.id&&el2.id.indexOf('pl-')===0&&el2.value.trim()){el2.value=el2.value.trim()+'، '+b.dataset.v;el2.dispatchEvent(new Event('input',{bubbles:true}));return}insert(el2,b.dataset.v);return}
 if(a==='recheck'){keep();return}
 if(a==='publish'){var text=PARTS().map(function(p){return (S.dr[p.id]||'').trim()}).filter(Boolean).join('\n\n');
  send({t:'code',k:'WRT',c:JSON.stringify({title:S.dr.title||T.title,text:text,r:'ورشة الكتابة · '+GEN.name,genre:GEN.id,task:T.id,lvl:LV,v1:S.v1?PARTS().map(function(p){return S.v1[p.id]||''}).join('\n\n'):'',ck:checks().map(function(c){return S.ck[GEN.check.indexOf(c)]?1:0}),nb:S.nb,plan:S.plan})});
  send({t:'ws',k:T.id+'-L'+LV,v:words(text).length});S.sent=(S.sent||0)+1;save();keep();return}
});
function keep(){var y=window.pageYOffset||0;render();window.scrollTo(0,y)}

if(window.TQB)TQB.init({home:'index.html',up:function(){if(T){T=null;S=null}else if(GEN){GEN=null}else return false;render();window.scrollTo(0,0)}});
render();
if(G)Promise.all([fetch('write-data/ws-'+G+'.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}),fetch('write-data/dict.json').then(function(r){return r.json()}).catch(function(){return []})]).then(function(x){D=x[0];DICT={};x[1].forEach(function(w){DICT[w]=1});var gq=qs.get('w');if(gq)GEN=findGen(gq)||null;render()}).catch(function(){$app.innerHTML=top()+'<h1>🧩 ورشة الكتابة</h1><div class="card"><p>ورشة الكتابة لصفك قيد الإعداد.</p></div>'});
})();
</script>
