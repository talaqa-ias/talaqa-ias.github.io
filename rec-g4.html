<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>طلاقة · استوديو التسجيل · الصف الرابع</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;700&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--ink:#1D2B4F;--blue:#3B6D95;--teal:#29BFCF;--gold:#E0A82E;--cream:#FFF7DD;--bg:#EEF6FB;--ok:#22B866;--bad:#E5484D;--card:#fff;--mut:#5B6B85}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:10px;justify-content:center;margin:6px 0 14px}header img{width:52px;height:52px;border-radius:50%;background:#fff}
h1{font-size:1.5rem;margin:.2em 0;text-align:center}.lead{color:var(--mut);text-align:center;margin:0 0 14px}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:0 4px 0 rgba(29,43,79,.08);margin-bottom:14px}
.who{display:grid;gap:12px}.who button{display:flex;justify-content:space-between;align-items:center;font:inherit;font-size:1.25rem;font-weight:800;border:0;border-radius:18px;padding:18px;background:#fff;color:var(--ink);box-shadow:0 4px 0 rgba(29,43,79,.12);cursor:pointer;text-align:right}
.who small{font-weight:500;color:var(--mut);font-size:.95rem}
.tips li{margin:6px 0}.bar{height:10px;background:#dde8f1;border-radius:9px;overflow:hidden}.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--ok))}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.95rem;margin:8px 0}
.txt{font-family:"Noto Naskh Arabic",serif;font-size:clamp(1.9rem,6vw,2.8rem);line-height:2.1;text-align:center;padding:12px 4px;font-weight:700}
.note{background:var(--cream);border-radius:12px;padding:10px 12px;color:#5A3A00;font-size:1rem}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.btn{font:inherit;font-weight:800;font-size:1.1rem;border:0;border-radius:16px;padding:14px 18px;min-height:56px;cursor:pointer;background:var(--blue);color:#fff;box-shadow:0 4px 0 #24496a}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 rgba(29,43,79,.15)}
.btn.rec{background:var(--bad);box-shadow:0 4px 0 #a52a2e;min-width:180px;font-size:1.25rem}.btn.rec.on{animation:pulse 1s infinite}
.btn:disabled{opacity:.45;cursor:default}
@keyframes pulse{50%{transform:scale(1.04)}}
.meter{height:14px;border-radius:8px;background:#e9eef4;overflow:hidden;margin-top:12px}.meter b{display:block;height:100%;width:0;background:var(--ok);transition:width .08s}
.st{text-align:center;margin-top:10px;font-weight:700;min-height:1.4em}.st.ok{color:var(--ok)}.st.bad{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;margin-top:10px}.grid button{font:inherit;border:0;border-radius:10px;padding:8px 0;background:#e9eef4;cursor:pointer;font-weight:700}.grid button.done{background:#c9f0d8}.grid button.cur{outline:3px solid var(--blue)}
footer{color:var(--mut);font-size:.85rem;text-align:center;margin:18px 0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1726;--card:#18233a;--ink:#EAF1FA;--mut:#a9b6c9;--cream:#3a3220}.who button,.btn.ghost{background:#22304d;color:var(--ink)}.grid button{background:#22304d;color:var(--ink)}.note{color:#ffe7b0}}
</style></head><body><div class="wrap">

 app.querySelectorAll('[data-sp]').forEach(function(b){b.onclick=function(){SP=b.dataset.sp;var L=list();I=Math.max(0,L.findIndex(function(c){return !have[K(c)]}));vClip()}});
}
function vClip(){
 var L=list(),c=L[I],done=L.filter(function(x){return have[K(x)]}).length,pct=Math.round(done/L.length*100);
 app.innerHTML='<div class="row" style="justify-content:space-between;margin:0 0 10px"><button class="btn ghost" id="back">← الأصوات</button><button class="btn ghost" id="exp">📦 تصدير التسجيلات</button></div>'+
 '<div class="card"><div class="bar"><b style="width:'+pct+'%"></b></div><div class="meta"><span>'+esc(D.speakers[SP])+'</span><span>'+(I+1)+' من '+L.length+' · سُجّل '+done+'</span></div>'+
 '<div class="meta"><span>'+esc(c.use)+'</span><span dir="ltr">'+esc(c.id)+'</span></div>'+
 '<div class="txt" lang="ar">'+esc(c.text)+'</div>'+(c.note?'<div class="note">'+esc(c.note)+'</div>':'')+
 '<div class="meter"><b id="lv"></b></div><div class="st" id="st">'+(have[K(c)]?'✓ مسجّل. استمع للتأكد أو أعد التسجيل.':'')+'</div>'+
 '<div class="row"><button class="btn rec" id="rec">⏺ سجّل</button><button class="btn ghost" id="play"'+(have[K(c)]?'':' disabled')+'>▶ استمع</button></div>'+
 '<div class="row"><button class="btn ghost" id="prev"'+(I===0?' disabled':'')+'>السابق</button><button class="btn" id="next"'+(I>=L.length-1?' disabled':'')+'>التالي</button></div></div>'+
 '<div class="card"><strong>كل المقاطع</strong><div class="grid">'+L.map(function(x,k){return '<button data-i="'+k+'" class="'+(have[K(x)]?'done ':'')+(k===I?'cur':'')+'">'+(k+1)+'</button>'}).join('')+'</div></div>';
 $('back').onclick=function(){stopAll();vStart()};$('exp').onclick=exportZip;
 $('prev').onclick=function(){stopAll();I--;vClip()};$('next').onclick=function(){stopAll();I++;vClip()};
 $('play').onclick=function(){get(K(c)).then(function(v){if(!v)return;player.src=URL.createObjectURL(v.blob);player.play()})};
 $('rec').onclick=function(){REC&&REC.state==='recording'?stopRec():startRec(c)};
 app.querySelectorAll('[data-i]').forEach(function(b){b.onclick=function(){stopAll();I=+b.dataset.i;vClip()}});
}
function $(id){return document.getElementById(id)}
function setSt(t,cls){var s=$('st');if(s){s.textContent=t;s.className='st '+(cls||'')}}
function pickMime(){var m=['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg;codecs=opus'];for(var i=0;i<m.length;i++)if(window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m[i]))return m[i];return ''}
function startRec(c){
 player.pause();
 var go=function(){chunks=[];var mt=pickMime();try{REC=new MediaRecorder(stream,mt?{mimeType:mt,audioBitsPerSecond:96000}:undefined)}catch(e){setSt('المتصفح لا يدعم التسجيل. جرّب Chrome أو Safari حديثًا.','bad');return}
  var peak=0,t0=Date.now();
  REC.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
  REC.onstop=function(){cancelAnimationFrame(raf);var lv=$('lv');if(lv)lv.style.width='0';var dur=(Date.now()-t0)/1000,blob=new Blob(chunks,{type:REC.mimeType||mt||'audio/webm'});
   var warn=dur<0.6?'التسجيل قصير جدًا، أعده.':peak<0.08?'الصوت منخفض جدًا: اقترب قليلًا وأعد.':peak>0.98?'الصوت مرتفع جدًا (تشويش): ابتعد قليلًا وأعد.':'';
   put(K(c),{blob:blob,mime:blob.type,dur:Math.round(dur*10)/10,peak:Math.round(peak*100)/100,at:new Date().toISOString(),id:c.id,speaker:c.speaker,text:c.text}).then(function(){have[K(c)]=1;
    var b=$('rec');if(b){b.classList.remove('on');b.textContent='⏺ أعد التسجيل'}var p=$('play');if(p)p.disabled=false;
    setSt(warn?('⚠️ '+warn):'✓ حُفظ. استمع، ثم اضغط «التالي».',warn?'bad':'ok');
    if(!warn){player.src=URL.createObjectURL(blob);player.play()}
   })};
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();var src=actx.createMediaStreamSource(stream);anal=actx.createAnalyser();anal.fftSize=1024;src.connect(anal);var buf=new Float32Array(anal.fftSize);
   (function loop(){anal.getFloatTimeDomainData(buf);var m=0;for(var i=0;i<buf.length;i++){var a=Math.abs(buf[i]);if(a>m)m=a}if(m>peak)peak=m;var lv=$('lv');if(lv)lv.style.width=Math.min(100,m*130)+'%';raf=requestAnimationFrame(loop)})()}catch(e){peak=0.5}
  REC.start();var b=$('rec');b.classList.add('on');b.textContent='⏹ أوقف';setSt('🔴 يسجّل الآن… اقرأ، ثم اضغط «أوقف».','');
 };
 if(stream)return go();
 navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}}).then(function(s){stream=s;go()}).catch(function(){setSt('لم يُسمح بالميكروفون. اسمح للمتصفح باستخدامه ثم أعد المحاولة.','bad')});
}
function stopRec(){if(REC&&REC.state==='recording')REC.stop()}
function stopAll(){try{player.pause()}catch(e){}stopRec()}
function exportZip(){
 if(!window.JSZip){alert('تعذّر تحميل أداة الضغط. تأكد من الاتصال بالإنترنت.');return}
 setSt('… يجهّز الملفات (قد يستغرق دقيقة على الهاتف)','');
 var L=D.clips.filter(function(c){return have[K(c)]}),PART=40,parts=[];
 for(var i=0;i<L.length;i+=PART)parts.push(L.slice(i,i+PART));
 var d=new Date(),p=function(n){return (n<10?'0':'')+n},stamp=d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes()),out=[];
 var box=document.getElementById('expbox');if(!box){box=document.createElement('div');box.id='expbox';box.style.cssText='margin:12px 0;display:grid;gap:8px';var st=$('st');(st?st.parentNode:app).insertBefore(box,st?st.nextSibling:null)}
 box.innerHTML='';
 (function one(k){
  if(k>=parts.length){setSt('✓ جاهز: '+parts.length+' ملفات ('+L.length+' مقطعًا). نزّل أو شارك كل ملف على حدة وأرسلها إلى رئيس القسم.','ok');return}
  var zip=new JSZip(),man=[];
  Promise.all(parts[k].map(function(c){return get(K(c)).then(function(v){if(!v)return;var ext=(v.mime||'').indexOf('mp4')>=0?'m4a':(v.mime||'').indexOf('ogg')>=0?'ogg':'webm';var fn=c.id+'_'+c.speaker+'.'+ext;zip.file(fn,v.blob);man.push({file:fn,id:c.id,speaker:c.speaker,text:c.text,dur:v.dur,peak:v.peak,at:v.at,mime:v.mime})})})).then(function(){
   zip.file('manifest.json',JSON.stringify({tool:'talaqa-spk-g4',part:k+1,parts:parts.length,exported:new Date().toISOString(),ua:navigator.userAgent,clips:man},null,1));
   return zip.generateAsync({type:'blob',compression:'STORE'})}).then(function(b){
   var fn='talaqa_spk_g4_'+(SP||'all')+'_'+stamp+'_part'+(k+1)+'of'+parts.length+'.zip',mb=(b.size/1048576).toFixed(1);
   var row=document.createElement('div');row.className='row';row.style.justifyContent='flex-start';
   var a=document.createElement('a');a.className='btn';a.href=URL.createObjectURL(b);a.download=fn;a.textContent='⬇️ الجزء '+(k+1)+' من '+parts.length+' · '+man.length+' مقطعًا · '+mb+' MB';row.appendChild(a);
   var f;try{f=new File([b],fn,{type:'application/zip'})}catch(e){}
   if(f&&navigator.canShare&&navigator.canShare({files:[f]})){var sb=document.createElement('button');sb.className='btn ghost';sb.textContent='📤 مشاركة';sb.onclick=function(){navigator.share({files:[f],title:fn}).catch(function(){})};row.appendChild(sb)}
   box.appendChild(row);setSt('… جُهِّز '+(k+1)+' من '+parts.length,'');setTimeout(function(){one(k+1)},50)
  }).catch(function(e){setSt('تعذّر تجهيز الجزء '+(k+1)+'. أعد المحاولة.','bad')})
 })(0);
}
refreshHave().then(vStart,vStart);
})();
