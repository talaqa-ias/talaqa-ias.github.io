.wrap{max-width:860px;margin:0 auto;padding:12px 16px 40px}

.sub{color:var(--mut);text-align:center;margin:0 0 14px}

.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;direction:rtl}
.lcard{border:0;font:inherit;background:#fff;border-radius:24px;padding:14px;box-shadow:0 5px 0 rgba(29,43,79,.12);cursor:pointer;text-align:center;color:var(--ink)}
.lcard .pic{width:120px;height:120px;margin:0 auto 6px}
.lcard strong{font-size:1.6rem;display:block}.lcard small{color:var(--mut)}
.pic{display:flex;align-items:center;justify-content:center;border-radius:50%;background:#fff;overflow:hidden;box-shadow:0 0 0 6px #fff3c4}
.pic img{width:100%;height:100%;object-fit:contain}.pic .em{font-size:3.6rem;line-height:1}
.stars{letter-spacing:2px;font-size:1.1rem}
.path{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:8px;direction:rtl}@media(min-width:620px){.path{grid-template-columns:repeat(4,1fr)}}
.st{border:0;font:inherit;background:#fff;border-radius:22px;padding:14px 8px;box-shadow:0 5px 0 rgba(29,43,79,.12);cursor:pointer;color:var(--ink);position:relative}
.st .ic{font-size:2.6rem;display:block}.st b{display:block;font-size:1.15rem;margin-top:4px}
.st .badge{position:absolute;top:8px;left:10px;font-size:1.3rem}

.bar{height:12px;background:#d8e6f0;border-radius:9px;overflow:hidden;margin:8px 0 12px}.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--ok));transition:width .3s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.card{border:0;font:inherit;background:#fff;border-radius:22px;padding:12px 8px 8px;box-shadow:0 5px 0 rgba(29,43,79,.12);cursor:pointer;text-align:center;color:var(--ink)}
.card .pic{width:100px;height:100px;margin:0 auto}
.card .w{font-size:1.5rem;font-weight:700;margin-top:6px;display:block}

.big.ok{background:var(--ok);box-shadow:0 5px 0 #168a4b}.big.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 rgba(29,43,79,.15)}
.big.rec{background:var(--bad);box-shadow:0 5px 0 #a52a2e}.big.rec.on{animation:pulse 1s infinite}
.big:disabled{opacity:.45}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
.spk{font-size:2.2rem;border:0;background:#fff;border-radius:50%;width:84px;height:84px;box-shadow:0 5px 0 rgba(29,43,79,.15);cursor:pointer}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin:14px 0}
.opt{border:0;font:inherit;background:#fff;border-radius:24px;padding:12px;box-shadow:0 5px 0 rgba(29,43,79,.12);cursor:pointer;color:var(--ink)}
