}, "g5l02t7": {"t": "أَحَرُّ مِمّا تَتَخَيَّلُ! جَدَّتي طَبَخَتْ سَمَكًا بِالتَّوابِلِ، وَأَنا شَرِبْتُ لِتْرًا مِنَ الْماءِ بَعْدَهُ. لكِنْ أَتَعْرِفُ يا خَليفَة؟ أَنا وُلِدْتُ في دُبَيّ، وَهذِهِ ثالِثُ زِيارَةٍ لي فَقَطْ، وَكُلَّ مَرَّةٍ أَشْعُرُ أَنَّ لي بَيْتَيْنِ.", "sp": "A", "who": null}, "g5l02t8": {"t": "وَلَدَيْكَ صَديقٌ يَنْتَظِرُكَ في الْبَيْتِ الأَوَّلِ. أَحْضِرْ لي تَوابِلَ… وَلا تُحْضِرِ الْفيلَ!", "sp": "K", "who": null}, "g5l02q1": {"t": "أَيْنَ يَقْضِي أَرْجُون الإِجَازَةَ؟ عِنْدَ جَدِّهِ عَلَى…", "sp": "T", "who": null}, "g5l02q2": {"t": "مَاذَا رَأَى مِنَ النَّافِذَةِ؟", "sp": "T", "who": null}, "g5l02q3": {"t": "أَيُّ حَيَوَانٍ مَشَى عَلَى الطَّرِيقِ؟", "sp": "T", "who": null}, "g5l02q4": {"t": "كَيْفَ كَانَ الطَّعَامُ؟", "sp": "T", "who": null}, "g5l02q5": {"t": "مَاذَا طَلَبَ خَلِيفَةُ مِنْ أَرْجُون؟", "sp": "T", "who": null}, "g5l02m1": {"t": "أَرْجُون! أَخِيرًا رَدَدْتَ. أَيْنَ أَنْتَ الآنَ؟", "sp": "K", "who": null}, "g5l02m2": {"t": "أَنَا فِي بَيْتِ جَدِّي عَلَى ضِفَّةِ النَّهْرِ.", "sp": "A", "who": null}, "g5l02m3": {"t": "وَمَاذَا رَأَيْتَ مِنَ النَّافِذَةِ؟", "sp": "K", "who": null}, "g5l02m4": {"t": "حُقُولَ أَرُزٍّ خَضْرَاءَ، وَفِيلًا يَمْشِي عَلَى الطَّرِيقِ!", "sp": "A", "who": null}, "g5l02m5": {"t": "أَحْضِرْ لِي تَوَابِلَ… وَلَا تُحْضِرِ الْفِيلَ!", "sp": "K", "who": null}, "g5l03w01": {"t": "نَشْرَةُ الطَّقْسِ", "sp": "T", "who": null}, "g5l03w02": {"t": "الضَّبَاب", "sp": "T", "who": null}, "g5l03w03": {"t": "كَثِيف", "sp": "T", "who": null}, "g5l03w04": {"t": "الْمِظَلَّة", "sp": "T", "who": null}, "g5l03w05": {"t": "الْمَتْرُو", "sp": "T", "who": null}, "g5l03w06": {"t": "مُتْحَفُ الْعُلُومِ", "sp": "T", "who": null}, "g5l03w07": {"t": "حَجَر مِنَ الْقَمَرِ", "sp": "T", "who": null}, "g5l03w08": {"t": "الصَّفّ", "sp": "T", "who": null}, "g5l03t1": {"t": "نَشْرَةُ الطَّقْسِ وَالسَّفَرِ مِنْ إِذاعَةِ الصَّفِّ الْخامِسِ، يُقَدِّمُها خَليفَة مِنْ لَنْدَن!", "sp": "R", "who": "الرّاوِي"}, "g5l03t2": {"t": "صَباحَ الْخَيْرِ مِنْ لَنْدَن، حَيْثُ كانَ الضَّبابُ صَباحَ الْيَوْمِ كَثيفًا لِدَرَجَةِ أَنَّنا لَمْ نَرَ بُرْجَ السّاعَةِ الشَّهيرَ «بيغ بِن» وَنَحْنُ أَمامَهُ! لكِنَّ الْجَوَّ أَصْبَحَ صافِيًا عِنْدَ الظُّهْرِ، ثُمَّ صارَ ماطِرًا بَعْدَ الْعَصْرِ. أُمّي تَقولُ إِنَّ لَنْدَن مَدينَةٌ تَرى فيها الْفُصولَ الأَرْبَعَةَ في يَوْمٍ واحِدٍ.", "sp": "K", "who": null}, "g5l03t3": {"t": "وَهَلْ ما زِلْتَ تَحْمِلُ الْمِظَلَّةَ يا خَليفَة؟", "sp": "S", "who": null}, "g5l03t4": {"t": "ما زِلْتُ أَحْمِلُها، وَلَنْ أَتْرُكَها ما دُمْتُ هُنا! الْيَوْمَ رَكِبْنا الْمَتْرو الَّذي عُمْرُهُ أَكْثَرُ مِنْ مِئَةٍ وَخَمْسينَ سَنَةً، وَهُوَ أَقْدَمُ مَتْرو في الْعالَمِ. في الْبِدايَةِ كانَتِ الْخَريطَةُ مُعَقَّدَةً، لكِنَّها صارَتْ سَهْلَةً بَعْدَ مَحَطَّتَيْنِ.", "sp": "K", "who": null}, "g5l03t5": {"t": "وَماذا أَعْجَبَكَ أَكْثَرَ؟", "sp": "S", "who": null}, "g5l03t6": {"t": "مُتْحَفُ الْعُلومِ: لَمَسْتُ حَجَرًا مِنَ الْقَمَرِ! وَتَعَلَّمْتُ شَيْئًا آخَرَ: النّاسُ هُنا يَقِفونَ في الصَّفِّ لِكُلِّ شَيْءٍ، حَتّى لِلْحافِلَةِ، وَلا أَحَدَ يَتَجاوَزُ. لَيْسَ الأَمْرُ قانونًا، بَلْ عادَةً.", "sp": "K", "who": null}, "g5l03t7": {"t": "إِذَنْ خُلاصَةُ النَّشْرَةِ: الطَّقْسُ مُتَقَلِّبٌ، وَالنّاسُ مُنَظَّمونَ. شُكْرًا خَليفَة، وَلا تَنْسَ الْمِعْطَفَ!", "sp": "S", "who": null}, "g5l03q1": {"t": "مِنْ أَيْنَ يُقَدِّمُ خَلِيفَةُ النَّشْرَةَ؟ مِنْ لَنْدَن، وَكَانَ…", "sp": "T", "who": null}, "g5l03q2": {"t": "مَاذَا يَحْمِلُ خَلِيفَةُ دَائِمًا؟", "sp": "T", "who": null}, "g5l03q3": {"t": "مَاذَا رَكِبُوا الْيَوْمَ؟", "sp": "T", "who": null}, "g5l03q4": {"t": "مَاذَا أَعْجَبَ خَلِيفَةَ أَكْثَرَ؟", "sp": "T", "who": null}, "g5l03q5": {"t": "مَاذَا لَمَسَ فِي الْمُتْحَفِ؟", "sp": "T", "who": null}, "g5l03m1": {"t": "صَبَاحَ الْخَيْرِ مِنْ لَنْدَن، حَيْثُ كَانَ الضَّبَابُ كَثِيفًا.", "sp": "K", "who": null}, "g5l03m2": {"t": "وَهَلْ مَا زِلْتَ تَحْمِلُ الْمِظَلَّةَ يَا خَلِيفَة؟", "sp": "S", "who": null}, "g5l03m3": {"t": "مَا زِلْتُ أَحْمِلُهَا، وَلَنْ أَتْرُكَهَا مَا دُمْتُ هُنَا!", "sp": "K", "who": null}, "g5l03m4": ةَ تَتَكَلَّمُ؟", "sp": "K", "who": null}, "g5l04t7": {"t": "لَيْسَ حَرْفِيًّا يا خَليفَة. تَقْصِدُ أَنَّكَ تَفْهَمُ شُعورَ الرَّسّامِ حَتّى لَوْ لَمْ تَعْرِفْ لُغَتَهُ. هذا تَعْبيرٌ مَجازِيٌّ.", "sp": "S", "who": null}, "g5l04q1": {"t": "مِمَّنْ وَصَلَتِ الرِّسَالَةُ؟ مِنْ خَالَةِ شَمَّا، وَهِيَ…", "sp": "T", "who": null}, "g5l04q2": {"t": "كَيْفَ بَارِيس؟ مَدِينَةٌ تَمْشِي فِيهَا بَيْنَ…", "sp": "T", "who": null}, "g5l04q3": {"t": "مَاذَا رَكِبَتِ الْخَالَةُ إِلَى الْجَنُوبِ؟", "sp": "T", "who": null}, "g5l04q4": {"t": "مَاذَا يَرْسُمُ مُونِيه؟", "sp": "T", "who": null}, "g5l04q5": {"t": "مَاذَا تَتَعَلَّمُ الْخَالَةُ؟ أَنَّ لِكُلِّ فَنَّانٍ…", "sp": "T", "who": null}, "g5l04m1": {"t": "إِنَّ بَارِيس مَدِينَةٌ تَمْشِي فِيهَا بَيْنَ اللَّوْحَاتِ.", "sp": "S", "who": null}, "g5l04m2": {"t": "رَكِبْتُ الْقِطَارَ السَّرِيعَ إِلَى الْجَنُوبِ، وَكَأَنَّ الْحُقُولَ تَطِيرُ مِنَ النَّافِذَةِ.", "sp": "S", "who": null}, "g5l04m3": {"t": "لَكِنْ مَا الَّذِي تَتَعَلَّمُهُ خَالَتُكِ هُنَاكَ بِالضَّبْطِ؟", "sp": "A", "who": null}, "g5l04m4": {"t": "هَلْ تَقْصِدُ أَنَّ اللَّوْحَةَ تَتَكَلَّمُ؟", "sp": "K", "who": null}, "g5l04m5": {"t": "تَقْصِدُ أَنَّكَ تَفْهَمُ شُعُورَ الرَّسَّامِ حَتَّى لَوْ لَمْ تَعْرِفْ لُغَتَهُ.", "sp": "S", "who": null}, "g5l05w01": {"t": "صَالَةُ الْمُغَادَرَةِ", "sp": "T", "who": null}, "g5l05w02": {"t": "تَأَخَّرَتِ الرِّحْلَةُ", "sp": "T", "who": null}, "g5l05w03": {"t": "مُكَبِّرُ الصَّوْتِ", "sp": "T", "who": null}, "g5l05w04": {"t": "الْمُحَقِّقَة", "sp": "T", "who": null}, "g5l05w05": {"t": "جِنْسِيَّة", "sp": "T", "who": null}, "g5l05w06": {"t": "الْمُضِيف", "sp": "T", "who": null}, "g5l05w07": {"t": "لُغَات", "sp": "T", "who": null}, "g5l05w08": {"t": "الْبَوَّابَة", "sp": "T", "who": null}, "g5l05t1": {"t": "في صالَةِ الْمُغادَرَةِ بِمَطارِ دُبَيّ، تَنْتَظِرُ عائِلَةُ خَليفَة رِحْلَةً تَأَخَّرَتْ ساعَةً.", "sp": "R", "who": "الرّاوِي"}, "g5l05t2": {"t": "يا أَيُّها الْمُسافِرونَ عَلى الرِّحْلَةِ 203 إِلى إِسْطَنْبول، نَعْتَذِرُ عَنِ التَّأَخُّرِ؛ الإِقْلاعُ الآنَ في السّاعَةِ الْعاشِرَةِ مِنَ الْبَوّابَةِ 14.", "sp": "O", "who": "مكبر الصوت"}, "g5l05t3": {"t": "ساعَةٌ كامِلَةٌ! ماذا نَفْعَلُ يا أَبي؟", "sp": "S", "who": null}, "g5l05t4": {"t": "نَلْعَبُ لُعْبَةً: أَيَّتُها الْمُحَقِّقَةُ شَمّا، اِكْتَشِفي كَمْ جِنْسِيَّةً حَوْلَنا في عَشْرِ دَقائِقَ، مِنَ الْمَلابِسِ وَاللُّغاتِ وَلَوْحَةِ الرَّحَلاتِ.", "sp": "FA", "who": "الأَب"}, "g5l05t5": {"t": "عائِلَةٌ يابانِيَّةٌ تَنْتَظِرُ رِحْلَةَ طوكْيو، وَرَجُلٌ نيجيرِيٌّ بِثَوْبٍ مُطَرَّزٍ، وَفَتاتانِ تَتَكَلَّمانِ الإِسْبانِيَّةَ، وَمُضيفٌ لُبْنانِيٌّ… أَحْصَيْتُ ثَماني عَشْرَةَ جِنْسِيَّةً في عَشْرِ دَقائِقَ!", "sp": "S", "who": null}, "g5l05t6": {"t": "وَأَنا سَأَلْتُ الْمُضيفَ: كَمْ لُغَةً تَتَكَلَّمُ؟ فَقالَ: أَرْبَعًا، وَإِنَّ الْمَطارَ أَفْضَلُ مَدْرَسَةٍ لِلُّغاتِ.", "sp": "K", "who": null}, "g5l05t7": {"t": "أَتَرَيْنَ يا شَمّا؟ التَّأَخُّرُ لَيْسَ خَسارَةً دائِمًا. الْعالَمُ كُلُّهُ مَرَّ مِنْ هُنا وَنَحْنُ جالِسونَ.", "sp": "FA", "who": "الأَب"}, "g5l05t8": {"t": "يا أَيُّها الْمُسافِرُ خَليفَة مُحَمَّد، الرَّجاءُ التَّوَجُّهُ إِلى الْبَوّابَةِ 14؛ نَسيتَ حَقيبَتَكَ عِنْدَ الْمَقْهى!", "sp": "O", "who": "مكبر الصوت"}, "g5l05q1": {"t": "أَيْنَ تَنْتَظِرُ الْعَائِلَةُ؟", "sp": "T", "who": null}, "g5l05q2": {"t": "مَاذَا حَدَثَ لِلرِّحْلَةِ؟", "sp": "T", "who": null}, "g5l05q3": {"t": "مَاذَا طَلَبَ الأَبُ مِنْ شَمَّا؟ أَنْ تَكْتَشِفَ كَمْ…", "sp": "T", "who": null}, "g5l05q4": {"t": "مَنْ سَأَلَ خَلِيفَةُ؟", "sp": "T", "who": null}, "g5l05q5": {"t": "مَاذَا نَسِيَ خَلِيفَةُ؟", "sp": "T", "who": null}, "g5l05m1": {"t": "يَا أَيُّهَا الْمُسَافِرُونَ، نَعْتَذِرُ عَنِ التَّأَخُّرِ.", "sp": "O", "who": null}, "g5l05m2": {"t": "سَاعَةٌ كَامِلَةٌ! مَاذَا نَفْعَلُ يَا أَبِي؟", "sp": "S", "who": null}, "g5l05m3": {"t": "أَيَّتُهَا الْمُحَقِّقَةُ شَمَّا، اكْتَشِفِي كَمْ جِنْسِيَّةً حَوْلَنَا.", "sp": "FA", "who": null}, "g5l05m4": {"t": "سَأَلْتُ الْمُضِيفَ: كَمْ لُغَةً تَتَكَلَّمُ؟", "sp": "K", "who": null}, "g5l05m5": {"t": "التَّأَخُّرُ لَيْسَ خَسَارَةً دَ َنْ سَجَّلَ هَدَفَ الْفَوْزِ؟", "sp": "T", "who": null}, "g5l06q4": {"t": "مَنْ أَطْلَقَ صَافِرَةَ النِّهَايَةِ؟", "sp": "T", "who": null}, "g5l06q5": {"t": "مَنْ صَدَّ سَبْعَ كُرَاتٍ؟", "sp": "T", "who": null}, "g5l06m1": {"t": "الدَّقِيقَةُ الأَخِيرَةُ وَالنَّتِيجَةُ تَعَادُلٌ وَاحِدٌ لِوَاحِدٍ!", "sp": "A", "who": null}, "g5l06m2": {"t": "شَمَّا تُسَدِّدُ بِقَدَمِهَا الْيُسْرَى… هَدَف!", "sp": "A", "who": null}, "g5l06m3": {"t": "أَطْلَقَ الْحَكَمُ صَافِرَةَ النِّهَايَةِ.", "sp": "R", "who": null}, "g5l06m4": {"t": "حَزِينٌ قَلِيلًا، لَكِنِّي فَخُورٌ. صَدَدْتُ سَبْعَ كُرَاتٍ الْيَوْمَ.", "sp": "O", "who": null}, "g5l06m5": {"t": "الْحَكَمُ صَفَّرَ، لَكِنَّ الرِّيَاضَةَ لَا تَنْتَهِي بِالصَّافِرَةِ.", "sp": "A", "who": null}, "g5l07w01": {"t": "الْفُرُوسِيَّة", "sp": "T", "who": null}, "g5l07w02": {"t": "الْمُدَرِّبَة", "sp": "T", "who": null}, "g5l07w03": {"t": "حِصَان", "sp": "T", "who": null}, "g5l07w04": {"t": "الْخُوذَة", "sp": "T", "who": null}, "g5l07w05": {"t": "التَّوَازُن", "sp": "T", "who": null}, "g5l07w06": {"t": "اللِّجَام", "sp": "T", "who": null}, "g5l07w07": {"t": "يَجْرِي", "sp": "T", "who": null}, "g5l07w08": {"t": "الْهُدُوء", "sp": "T", "who": null}, "g5l07t1": {"t": "في نادي الْفُروسِيَّةِ، تُقَدِّمُ الْمُدَرِّبَةُ مُوزَة دَرْسَها الأَوَّلَ لِشَمّا وَأَرْجون.", "sp": "R", "who": "الرّاوِي"}, "g5l07t2": {"t": "أَهْلًا يا فارِسَيَّ الصَّغيرَيْنِ. قَبْلَ أَنْ تَرْكَبا، تَعَرَّفا إِلى الْحِصانِ: هذا «سُلْطان»، عَدا في عَشَراتِ السِّباقاتِ، وَالْيَوْمَ يُعَلِّمُ الأَطْفالَ. اِقْتَرِبا مِنْ جانِبِهِ لا مِنْ خَلْفِهِ، وَدَعاهُ بِاسْمِهِ بِهُدوءٍ.", "sp": "O", "who": "موزة"}, "g5l07t3": {"t": "هَلْ يَخافُ مِنّا؟", "sp": "A", "who": null}, "g5l07t4": {"t": "الْحِصانُ يَشْعُرُ بِخَوْفِكَ قَبْلَ أَنْ تَشْعُرَ بِهِ أَنْتَ. تَنَفَّسْ بِهُدوءٍ. الآنَ الْخُوذَةُ أَوَّلًا، ثُمَّ الْقَدَمُ الْيُسْرى في الرِّكابِ، وَاجْلِسْ في مُنْتَصَفِ السَّرْجِ. الظَّهْرُ مُسْتَقيمٌ، وَالْعَيْنانِ إِلى الأَمامِ لا إِلى الأَرْضِ.", "sp": "O", "who": "موزة"}, "g5l07t5": {"t": "أَنا عالِيَةٌ جِدًّا! كَأَنّي أَرى الْمَدينَةَ كُلَّها.", "sp": "S", "who": null}, "g5l07t6": {"t": "التَّوازُنُ يا شَمّا، لا الْقُوَّةُ. اللِّجامُ لِلتَّوْجيهِ لا لِلشَّدِّ. مَشى الْحِصانُ… جَيِّدٌ… الآنَ اضْغَطي بِرِفْقٍ بِساقَيْكِ… جَرى سُلْطان! أَحْسَنْتِ!", "sp": "O", "who": "موزة"}, "g5l07t7": {"t": "وَأَنا؟ جَرى حِصاني خَطْوَتَيْنِ ثُمَّ وَقَفَ!", "sp": "A", "who": null}, "g5l07t8": {"t": "لِأَنَّكَ شَدَدْتَ اللِّجامَ وَأَنْتَ تَطْلُبُ مِنْهُ أَنْ يَجْرِيَ؛ كَلامُكَ يَقولُ: اِنْطَلِقْ، وَيَداكَ تَقولانِ: قِفْ. الْحِصانُ يُصَدِّقُ الْيَدَيْنِ. في الْفُروسِيَّةِ نَتَعَلَّمُ أَوَّلًا أَنْ نَكونَ واضِحينَ مَعَ أَنْفُسِنا.", "sp": "O", "who": "موزة"}, "g5l07q1": {"t": "أَيْنَ الدَّرْسُ؟ فِي نَادِي…", "sp": "T", "who": null}, "g5l07q2": {"t": "مَنْ تُقَدِّمُ الدَّرْسَ؟", "sp": "T", "who": null}, "g5l07q3": {"t": "مَاذَا يَلْبَسُ الْفَارِسُ أَوَّلًا؟", "sp": "T", "who": null}, "g5l07q4": {"t": "مَا الْمُهِمُّ فِي الرُّكُوبِ: الْقُوَّةُ أَمْ…", "sp": "T", "who": null}, "g5l07q5": {"t": "لِمَاذَا وَقَفَ حِصَانُ أَرْجُون؟ لِأَنَّهُ شَدَّ…", "sp": "T", "who": null}, "g5l07m1": {"t": "أَهْلًا يَا فَارِسَيَّ الصَّغِيرَيْنِ. قَبْلَ أَنْ تَرْكَبَا، تَعَرَّفَا إِلَى الْحِصَانِ.", "sp": "O", "who": null}, "g5l07m2": {"t": "هَلْ يَخَافُ مِنَّا؟", "sp": "A", "who": null}, "g5l07m3": {"t": "الْحِصَانُ يَشْعُرُ بِخَوْفِكَ. تَنَفَّسْ بِهُدُوءٍ. الْخُوذَةُ أَوَّلًا.", "sp": "O", "who": null}, "g5l07m4": {"t": "أَنَا عَالِيَةٌ جِدًّا! كَأَنِّي أَرَى الْمَدِينَةَ كُلَّهَا.", "sp": "S", "who": null}, "g5l07m5": {"t": "التَّوَازُنُ يَا شَمَّا، لَا الْقُوَّةُ. اللِّجَامُ لِلتَّوْجِيهِ لَا لِلشَّدِّ.", "sp": "O", "who": null}, "g5l08w01": {"t": "بُودْكَاسْت", "sp": "T", "who": null}, "g5l08w02": {"t": "الْعَدَّاءَة", "sp": "T", "who": null}, "g5l08w03": {"t": "كِيلُومِتْر", "sp": "T", "who": null}, "g5l08w04": {"t": "أَلْهَثُ", "sp": "T", "who": null}, "g5l08w05": {"t": "تَحَدَّيْتُ نَفْسِي", "sp": "T", "who": null}, "g5l08w06": {"t": "الْحَائِط", "sp": "T", "who": null}, "g5l08w07": {"t": "خَطُّ النِّهَايَةِ", "sp": "T", "who": null}, "g5l08w08": {"t": "الرَّأْس", "sp": "T", "who": null}, "g5l08t1": {"t": "بودكاست «خُطْوَة» – الْحَلْقَةُ الْخامِسَةُ. الضَّيْفَةُ: الْعَدّاءَةُ الإِماراتِيَّةُ مَريَم، الَّتي أَنْهَتْ أَوَّلَ ماراثونٍ لَها.", "sp": "R", "who": "الرّاوِي"}, "g5l08t2": {"t": "مَريَم، اثْنانِ وَأَرْبَعونَ كيلومِتْرًا! كَيْفَ بَدَأَتِ الْحِكايَةُ؟", "sp": "O", "who": "المذيع خليفة"}, "g5l08t3": {"t": "بَدَأَتْ بِكيلومِتْرٍ واحِدٍ، وَتَوَقَّفْتُ بَعْدَهُ وَأَنا أَلْهَثُ. لكِنّي تَحَدَّيْتُ نَفْسي: كُلَّ أُسْبوعٍ أَزيدُ كيلومِتْرًا. بَعْدَ سَنَةٍ اسْتَدْعاني الْمُدَرِّبُ وَقالَ: أَنْتِ جاهِزَةٌ.", "sp": "O", "who": "مريم"}, "g5l08t4": {"t": "ما أَصْعَبُ لَحْظَةٍ في السِّباقِ؟", "sp": "O", "who": "المذيع خليفة"}, "g5l08t5": {"t": "الْكيلومِتْرُ الثَّلاثونَ. يُسَمّونَهُ «الْحائِطَ»؛ تَشْعُرُ أَنَّ ساقَيْكَ مِنْ حَجَرٍ، وَقَلْبَكَ يَدُقُّ كَطَبْلٍ. تَمَنَّيْتُ أَنْ أَتَوَقَّفَ. لكِنّي تَذَكَّرْتُ الإِحْماءَ الأَوَّلَ، وَالْكيلومِتْرَ الأَوَّلَ، فَقُلْتُ: خُطْوَةٌ واحِدَةٌ فَقَطْ… ثُمَّ خُطْوَةٌ أُخْرى.", "sp": "O", "who": "مريم"}, "g5l08t6": {"t": "وَعِنْدَ خَطِّ النِّهايَةِ؟", "sp": "O", "who": "المذيع خليفة"}, "g5l08t7": {"t": "بَكَيْتُ. لا مِنَ التَّعَبِ، بَلْ لِأَنّي فَهِمْتُ أَنَّ الْحائِطَ لَمْ يَكُنْ في ساقَيَّ، بَلْ في رَأْسي. نَصيحَتي لِلْمُسْتَمِعينَ: لا تَسْأَلْ كَمْ بَقِيَ، اِسْأَلْ كَيْفَ تَتَنَفَّسُ الآنَ.", "sp": "O", "who": "مريم"}, "g5l08t8": {"t": "«الْحائِطُ في الرَّأْسِ لا في السّاقَيْنِ». شُكْرًا يا مَريَم، وَإِلى الْحَلْقَةِ الْقادِمَةِ.", "sp": "O", "who": "المذيع خليفة"}, "g5l08q1": {"t": "مَنْ ضَيْفَةُ الْحَلْقَةِ؟", "sp": "T", "who": null}, "g5l08q2": {"t": "بِمَاذَا بَدَأَتْ مَرْيَم؟", "sp": "T", "who": null}, "g5l08q3": {"t": "مَاذَا يُسَمُّونَ الْكِيلُومِتْرَ الثَّلَاثِينَ؟", "sp": "T", "who": null}, "g5l08q4": {"t": "أَيْنَ بَكَتْ مَرْيَم؟ عِنْدَ…", "sp": "T", "who": null}, "g5l08q5": {"t": "أَيْنَ كَانَ الْحَائِطُ حَقًّا؟ فِي…", "sp": "T", "who": null}, "g5l08m1": {"t": "مَرْيَم، اثْنَانِ وَأَرْبَعُونَ كِيلُومِتْرًا! كَيْفَ بَدَأَتِ الْحِكَايَةُ؟", "sp": "K", "who": null}, "g5l08m2": {"t": "بَدَأَتْ بِكِيلُومِتْرٍ وَاحِدٍ، وَتَوَقَّفْتُ بَعْدَهُ وَأَنَا أَلْهَثُ.", "sp": "O", "who": null}, "g5l08m3": {"t": "لَكِنِّي تَحَدَّيْتُ نَفْسِي: كُلَّ أُسْبُوعٍ أَزِيدُ قَلِيلًا.", "sp": "O", "who": null}, "g5l08m4": {"t": "مَا أَصْعَبُ لَحْظَةٍ فِي السِّبَاقِ؟", "sp": "K", "who": null}, "g5l08m5": {"t": "الْحَائِطُ لَمْ يَكُنْ فِي سَاقَيَّ، بَلْ فِي رَأْسِي.", "sp": "O", "who": null}, "g5l09w01": {"t": "الْخَطُّ الْعَرَبِيُّ", "sp": "T", "who": null}, "g5l09w02": {"t": "خَطُّ الثُّلُثِ", "sp": "T", "who": null}, "g5l09w03": {"t": "تَعْبِير مَجَازِيّ", "sp": "T", "who": null}, "g5l09w04": {"t": "أَبْيَات", "sp": "T", "who": null}, "g5l09w05": {"t": "الْقَافِيَة", "sp": "T", "who": null}, "g5l09w06": {"t": "الإِيقَاع", "sp": "T", "who": null}, "g5l09w07": {"t": "التَّمْثِيل", "sp": "T", "who": null}, "g5l09w08": {"t": "النَّبْرَة", "sp": "T", "who": null}, "g5l09t1": {"t": "في نادي الْمَواهِبِ، يَعْرِضُ ثَلاثَةُ طُلّابٍ فُنونَهُمْ، وَتُعَلِّقُ الْمُعَلِّمَةُ.", "sp": "R", "who": "الرّاوِي"}, "g5l09t2": {"t": "أَنا أَتَعَلَّمُ الْخَطَّ الْعَرَبِيَّ مُنْذُ سَنَتَيْنِ. اُنْظُروا إِلى هذِهِ الْكَلِمَةِ بِخَطِّ الثُّلُثِ: «سَلام». يَقولُ مُعَلِّمي إِنَّ الْخَطَّ رَقْصَةُ قَلَمٍ عَلى الْوَرَقِ؛ يَحْتاجُ إِلى نَفَسٍ هادِئٍ وَيَدٍ صَبورَةٍ.", "sp": "K", "who": null}, "g5l09t3": {"t": "«رَقْصَةُ قَلَمٍ»: هَلْ يَرْقُصُ الْقَلَمُ حَقًّا يا أَصْدِقاءُ؟ لا، هذا تَعْبيرٌ مَجازِيٌّ يَنْقُلُ الْحَرَكَةَ وَالْجَمالَ. أَحْسَنْتَ يا خَليفَةُ.", "sp": "T", "who": null}, "g5l09t4": {"t": "وَأَنا كَتَبْتُ أَبْياتًا. اِسْمَعوا: «يا قَمَرًا في اللَّيْلِ يَسْهَرُ / كُنْ لِلْمُسافِرِ نورًا يُبْصِرُ». لاحَظْتُ أَنَّ «يَسْهَرُ» وَ«يُبْصِرُ» تَنْتَهِيانِ بِالصَّوْتِ نَفْسِهِ.", "sp": "S", "who": null}, "g5l09t5": {"t": "هذِهِ هِيَ الْقافِيَةُ، وَالإيقاعُ هُوَ ما جَعَلَكُمْ تَهُزّونَ رُؤوسَكُمْ مَعَ الْبَيْتِ. الشِّعْرُ مُقَفًّى وَلَهُ إيقاعٌ، أَمّا النَّثْرُ فَحُرٌّ.", "sp": "T", "who": null}, "g5l09t6": {"t": "أَنا لا أَرْسُمُ وَلا أَكْتُبُ شِعْرًا، لكِنّي أُمَثِّلُ. «أَيُّها الْمَلِكُ، إِنَّ الْمَدينَةَ جائِعَةٌ!» – هذِهِ مِنْ مَسْرَحِيَّةِ الْمَدْرَسَةِ.", "sp": "A", "who": null}, "g5l09t7": {"t": "لاحِظوا كَيْفَ تَغَيَّرَ صَوْتُ أَرْجون فَتَغَيَّرَ شُعورُنا؛ التَّمْثيلُ فَنُّ النَّبْرَةِ. ثَلاثَةُ فُنونٍ مُخْتَلِفَةٍ، وَشَيْءٌ واحِدٌ يَجْمَعُها: الْمَوْهِبَةُ لا تَكْفي وَحْدَها، بَلْ تَحْتاجُ إِلى تَدْريبٍ يُلْهِمُهُ الصَّبْرُ.", "sp": "T", "who": null}, "g5l09q1": {"t": "مَاذَا يَتَعَلَّمُ خَلِيفَةُ مُنْذُ سَنَتَيْنِ؟", "sp": "T", "who": null}, "g5l09q2": {"t": "«رَقْصَةُ قَلَمٍ»: مَا نَوْعُ هَذَا التَّعْبِيرِ؟", "sp": "T", "who": null}, "g5l09q3": {"t": "مَاذَا كَتَبَتْ شَمَّا؟", "sp": "T", "who": null}, "g5l09q4": {"t": "مَا الَّذِي يَجْعَلُنَا نَهُزُّ رُؤُوسَنَا مَعَ الْبَيْتِ؟", "sp": "T", "who": null}, "g5l09q5": {"t": "مَا فَنُّ أَرْجُون؟", "sp": "T", "who": null}, "g5l09m1": {"t": "أَنَا أَتَعَلَّمُ الْخَطَّ الْعَرَبِيَّ مُنْذُ سَنَتَيْنِ.", "sp": "K", "who": null}, "g5l09m2": {"t": "هَلْ يَرْقُصُ الْقَلَمُ حَقًّا؟ لَا، هَذَا تَعْبِيرٌ مَجَازِيٌّ.", "sp": "T", "who": null}, "g5l09m3": {"t": "وَأَنَا كَتَبْتُ أَبْيَاتًا. اسْمَعُوا.", "sp": "S", "who": null}, "g5l09m4": {"t": "هَذِهِ هِيَ الْقَافِيَةُ، وَالإِيقَاعُ هُوَ مَا جَعَلَكُمْ تَهُزُّونَ رُؤُوسَكُمْ.", "sp": "T", "who": null}, "g5l09m5": {"t": "أَنَا لَا أَرْسُمُ وَلَا أَكْتُبُ شِعْرًا، لَكِنِّي أُمَثِّلُ.", "sp": "A", "who": null}, "g5l10w01": {"t": "نَادِي الْقِرَاءَةِ", "sp": "T", "who": null}, "g5l10w02": {"t": "رِوَايَة", "sp": "T", "who": null}, "g5l10w03": {"t": "الزَّمَان وَالْمَكَان", "sp": "T", "who": null}, "g5l10w04": {"t": "الشَّخْصِيَّات", "sp": "T", "who": null}, "g5l10w05": {"t": "الْعَنْقَاء", "sp": "T", "who": null}, "g5l10w06": {"t": "الْعُقْدَة", "sp": "T", "who": null}, "g5l10w07": {"t": "الْحَلّ", "sp": "T", "who": null}, "g5l10w08": {"t": "الأَمَانَة", "sp": "T", "who": null}, "g5l10t1": {"t": "في نادي الْقِراءَةِ، يُلَخِّصُ الطُّلّابُ كِتابَ الشَّهْرِ: رِوايَةٌ لِلْفِتْيانِ بِعُن function L(){return D.lessons.filter(function(x){return x.id===view.l})[0]}
function b64e(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function myCode(){var me=window.__me||{},d=new Date(),p={};D.lessons.forEach(function(l){var a=D.stations.map(function(s){var x=prog(l.id,s.k);return x?(x.star?2:1):0});if(a.some(Boolean))p[l.id]=a});return 'AB1.'+b64e(JSON.stringify({n:me.n||'',c:me.c||'',t:D.stage,d:d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2),p:p}))}
function vCode(){var me=window.__me||{},c=myCode();return top('home')+'<h1>🔢 رمز إنجازي</h1><div class="parent"><b>For parents:</b> copy this code and send it to the teacher (WhatsApp/Teams). It contains only the stars'+(me.n?' of '+esc(me.n):'')+', no recordings.</div>'+(me.n?'':'<p class="note">⚠️ لم تدخل من البوابة باسمك، فالرمز بلا اسم. Open the tool from the portal first.</p>')+'<div class="fn" id="mycode">'+esc(c)+'</div><div class="row"><button class="big ok" data-a="copycode">📋 انسخ · Copy</button></div>'}
function prog(l,k){LS[l]=LS[l]||{};return LS[l][k]||null}
function setProg(l,k,v){LS[l]=LS[l]||{};var p=LS[l][k];if(p&&p.star&&!v.star)v.star=p.star;LS[l][k]=v;save()}
function starsOf(l){var n=0;D.stations.forEach(function(s){var p=prog(l,s.k);if(p&&p.star)n++});return n}
function maxStars(){return D.stations.filter(function(s){return s.verify}).length}
function txt(a){return (D.txt[a]||{}).t||''}
function spk(a){return (D.txt[a]||{}).sp||'T'}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}

function picHTML(key,emo,cls){return '<span class="pic '+(cls||'')+'">'+(key&&HI[key]?'<img src="aal/img/'+key+'.webp" alt="">':'<span class="em">'+esc(emo||'⭐')+'</span>')+'</span>'}
function charPic(c){var ch=D.chars[c]||D.chars.T;return picHTML(ch.img,ch.emo)}
function who(a){var x=D.txt[a]||{};return x.who||(D.chars[x.sp]||{}).name||''}
function wordPic(w){return picHTML(w.img,w.emo)}

function play(a){var ep=EP;return new Promise(function(res){if(!a||!HA[a]){setTimeout(res,a?700:0);return}
 try{player.pause();player.src='aal/audio/'+a+'.mp3';var done=false,fin=function(){if(!done){done=true;res()}};player.onended=fin;player.onerror=fin;setTimeout(fin,15000);var p=player.play();if(p&&p.catch)p.catch(fin)}catch(e){res()}})}

var dbp=new Promise(function(res,rej){try{var r=indexedDB.open('aal_rec',1);r.onupgradeneeded=function(){r.result.createObjectStore('r')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}}catch(e){rej(e)}});
function rput(k,v){return dbp.then(function(db){return new Promise(function(r){var t=db.transaction('r','readwrite');t.objectStore('r').put(v,k);t.oncomplete=r;t.onerror=r})})}
function rget(k){return dbp.then(function(db){return new Promise(function(r){var q=db.transaction('r').objectStore('r').get(k);q.onsuccess=function(){r(q.result)};q.onerror=function(){r(null)}})}).catch(function(){return null})}
function rkeys(){return dbp.then(function(db){return new Promise(function(r){var q=db.transaction('r').objectStore('r').getAllKeys();q.onsuccess=function(){r(q.result||[])};q.onerror=function(){r([])}})}).catch(function(){return []})}

function mime(){var m=['audio/webm;codecs=opus','audio/mp4','audio/webm'];for(var i=0;i<m.length;i++)if(window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m[i]))return m[i];return ''}
function recToggle(key,btn,onDone){
 if(REC&&REC.state==='recording'){REC.stop();return}
 player.pause();
 var go=function(){chunks=[];var mt=mime();try{REC=new MediaRecorder(stream,mt?{mimeType:mt}:undefined)}catch(e){toast('التسجيل غير مدعوم في هذا المتصفح');return}
  REC.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
  REC.onstop=function(){var b=new Blob(chunks,{type:REC.mimeType||mt});btn.classList.remove('on');btn.textContent='🎙️ أعد';rput(key,{blob:b,mime:b.type,at:new Date().toISOString()}).then(function(){onDone&&onDone(b)})};
  REC.start();btn.classList.add('on');btn.textContent='⏹ أوقف'};
 if(stream)return go();
 navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}).then(function(s){stream=s;go()}).catch(function(){toast('اسمح باستخدام الميكروفون')})
}
