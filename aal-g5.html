3t3": {"t": "بَدَأَتْ بِكيلومِتْرٍ واحِدٍ، وَتَوَقَّفْتُ بَعْدَهُ وَأَنا أَلْهَثُ. لكِنّي تَحَدَّيْتُ نَفْسي: كُلَّ أُسْبوعٍ أَزيدُ كيلومِتْرًا. بَعْدَ سَنَةٍ اسْتَدْعاني الْمُدَرِّبُ وَقالَ: أَنْتِ جاهِزَةٌ.", "sp": "O", "who": "مريم"}, "g5l03t4": {"t": "ما أَصْعَبُ لَحْظَةٍ في السِّباقِ؟", "sp": "O", "who": "المذيع خليفة"}, "g5l03t5": {"t": "الْكيلومِتْرُ الثَّلاثونَ. يُسَمّونَهُ «الْحائِطَ»؛ تَشْعُرُ أَنَّ ساقَيْكَ مِنْ حَجَرٍ، وَقَلْبَكَ يَدُقُّ كَطَبْلٍ. تَمَنَّيْتُ أَنْ أَتَوَقَّفَ. لكِنّي تَذَكَّرْتُ الإِحْماءَ الأَوَّلَ، وَالْكيلومِتْرَ الأَوَّلَ، فَقُلْتُ: خُطْوَةٌ واحِدَةٌ فَقَطْ… ثُمَّ خُطْوَةٌ أُخْرى.", "sp": "O", "who": "مريم"}, "g5l03t6": {"t": "وَعِنْدَ خَطِّ النِّهايَةِ؟", "sp": "O", "who": "المذيع خليفة"}, "g5l03t7": {"t": "بَكَيْتُ. لا مِنَ التَّعَبِ، بَلْ لِأَنّي فَهِمْتُ أَنَّ الْحائِطَ لَمْ يَكُنْ في ساقَيَّ، بَلْ في رَأْسي. نَصيحَتي لِلْمُسْتَمِعينَ: لا تَسْأَلْ كَمْ بَقِيَ، اِسْأَلْ كَيْفَ تَتَنَفَّسُ الآنَ.", "sp": "O", "who": "مريم"}, "g5l03t8": {"t": "«الْحائِطُ في الرَّأْسِ لا في السّاقَيْنِ». شُكْرًا يا مَريَم، وَإِلى الْحَلْقَةِ الْقادِمَةِ.", "sp": "O", "who": "المذيع خليفة"}, "g5l03q1": {"t": "مَنْ ضَيْفَةُ الْحَلْقَةِ؟", "sp": "T", "who": null}, "g5l03q2": {"t": "بِمَاذَا بَدَأَتْ مَرْيَم؟", "sp": "T", "who": null}, "g5l03q3": {"t": "مَاذَا يُسَمُّونَ الْكِيلُومِتْرَ الثَّلَاثِينَ؟", "sp": "T", "who": null}, "g5l03q4": {"t": "أَيْنَ بَكَتْ مَرْيَم؟ عِنْدَ…", "sp": "T", "who": null}, "g5l03q5": {"t": "أَيْنَ كَانَ الْحَائِطُ حَقًّا؟ فِي…", "sp": "T", "who": null}, "g5l03m1": {"t": "مَرْيَم، اثْنَانِ وَأَرْبَعُونَ كِيلُومِتْرًا! كَيْفَ بَدَأَتِ الْحِكَايَةُ؟", "sp": "K", "who": null}, "g5l03m2": {"t": "بَدَأَتْ بِكِيلُومِتْرٍ وَاحِدٍ، وَتَوَقَّفْتُ بَعْدَهُ وَأَنَا أَلْهَثُ.", "sp": "O", "who": null}, "g5l03m3": {"t": "لَكِنِّي تَحَدَّيْتُ نَفْسِي: كُلَّ أُسْبُوعٍ أَزِيدُ قَلِيلًا.", "sp": "O", "who": null}, "g5l03m4": {"t": "مَا أَصْعَبُ لَحْظَةٍ فِي السِّبَاقِ؟", "sp": "K", "who": null}, "g5l03m5": {"t": "الْحَائِطُ لَمْ يَكُنْ فِي سَ
