<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>طلاقة · Arabic B · أقرأ وأكتب</title>
<link rel="icon" href="img/icon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap');
:root{--bg:#F1F6FF;--card:#FFFFFF;--ink:#1D2B4F;--muted:#5B6B8C;--line:#D3E4F5;--sky:#2F9BF0;--grass:#22B866;--sun:#FFC83D;--coral:#FF6B6B;--grape:#8E5CF7;
 --ui:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;--read:"Noto Naskh Arabic","Traditional Arabic",serif;color-scheme:light}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--ui);font-size:18px;line-height:1.5;direction:rtl;padding-inline:16px;padding-block:0 120px}
*{box-sizing:border-box}#app{max-width:880px;margin-inline:auto}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
.en{display:block;direction:ltr;unicode-bidi:isolate;text-align:left;font-family:system-ui,"Segoe UI",sans-serif;font-size:.82em;color:var(--muted);font-weight:500;line-height:1.35}
.btn .en,.lb .en,.opt .en,.act .en{text-align:center;color:inherit;opacity:.85}
h1{font-size:1.7rem;margin:6px 0 2px;font-weight:800}h2{font-size:1.25rem;margin:0 0 8px;font-weight:800}
.lead{color:var(--muted);margin:0 0 12px}.note{color:var(--muted);font-size:.95rem}
.top{display:flex;align-items:center;gap:8px;padding-block:14px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;text-decoration:none;color:var(--ink)}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 5px 0 var(--line)}
.btn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;border:0;border-radius:18px;padding:10px 22px;font-weight:800;font-size:1.1rem;background:var(--grass);color:#fff;min-height:56px;box-shadow:0 5px 0 #168A4B}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.sm{min-height:44px;padding:6px 14px;font-size:1rem;border-radius:12px}.btn.red{background:var(--coral);box-shadow:0 5px 0 #c74848}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.ctr{justify-content:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.les{border:3px solid var(--line);border-radius:20px;background:#fff;padding:12px;text-align:right;box-shadow:0 5px 0 var(--line)}
.les .i{font-size:2.2rem}.les h3{font-family:var(--read);margin:4px 0 0}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.act{border:3px solid var(--line);border-radius:20px;background:#fff;padding:12px;text-align:right;box-shadow:0 5px 0 var(--line)}
.act .i{font-size:2rem}.act.done{border-color:var(--grass);background:#F2FBF5}
.how{border:3px dashed var(--sun);background:#FFFBEA;border-radius:16px;padding:10px 12px;margin:8px 0}
.word{font-family:var(--read);font-size:3rem;font-weight:700;text-align:center;line-height:1.6}
.sent{font-family:var(--read);font-size:1.6rem;text-align:center;line-height:2}
.pics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pic{border:3px solid var(--line);border-radius:18px;background:#fff;padding:6px;min-height:110px;display:flex;align-items:center;justify-content:center;font-size:3rem}
.pic img{width:100%;height:100px;object-fit:contain}.pic.ok{border-color:var(--grass);background:#DDF7E8}.pic.no{border-color:var(--coral);background:#FFE3E3}
.wopts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.wo{border:3px solid var(--line);border-radius:16px;background:#fff;padding:8px 16px;font-family:var(--read);font-size:1.6rem;font-weight:700}
.wo.ok{border-color:var(--grass);background:#DDF7E8}.wo.no{border-color:var(--coral);background:#FFE3E3}
.slot{min-height:70px;border:3px dashed var(--sky);border-radius:18px;background:#F5FAFF;font-family:var(--read);font-size:1.8rem;text-align:center;padding:8px;line-height:1.8}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.tile{min-width:58px;height:58px;border:3px solid var(--line);border-radius:16px;background:#fff;font-family:var(--read);font-size:1.6rem;font-weight:700;box-shadow:0 4px 0 var(--line);padding:0 10px}
.tile.used{opacity:.3}
.story .ln{display:flex;gap:10px;align-items:flex-start;border-bottom:2px dashed var(--line);padding:10px 0}
.story .ln .t{flex:1;font-family:var(--read);font-size:1.5rem;line-height:1.9}
.story .sc{width:100%;max-height:220px;object-fit:cover;border-radius:16px}
.mean{background:#EEF4FF;border-radius:10px;padding:2px 8px;margin-top:4px;direction:ltr;unicode-bidi:isolate;font-family:system-ui,'Segoe UI',sans-serif}
.prog{height:12px;background:#E3ECF7;border-radius:999px;overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:var(--grass)}
.stars{font-size:1.6rem;text-align:center;min-height:2rem}
.pad{position:relative;width:min(100%,420px);aspect-ratio:1;margin:0 auto;border:3px solid var(--line);border-radius:22px;background:#fff;touch-action:none;overflow:hidden}
.pad canvas{position:absolute;inset:0;width:100%;height:100%}
.ck{display:flex;align-items:center;gap:10px;border:3px solid var(--sun);border-radius:16px;padding:10px;background:#FFFBEA;width:100%;text-align:right;margin:10px 0}
.ck .bx{width:30px;height:30px;border-radius:8px;border:3px solid var(--line);flex:0 0 30px;display:grid;place-items:center;background:#fff}
.ck.on{border-color:var(--grass);background:#F2FBF5}.ck.on .bx{background:var(--grass);border-color:var(--grass);color:#fff}.ck.on .bx::after{content:"✓"}
.in{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-family:var(--read);font-size:1.4rem;min-height:90px}
.mc{border:1.5px solid var(--line);background:#F7FBFF;border-radius:999px;padding:2px 12px;font-family:var(--read);font-size:1.15rem}
.rec{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app"></div>
<script src="nav.js"></script>
<script>
(function(){'use strict';
function get(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function put(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fnv(s){var h=0x811c9dc5;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h.toString(16)}
function ymd(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
var DIA=/[ً-ْٰـ]/g;function bare(s){return String(s||'').replace(DIA,'').replace(/[إأآ]/g,'ا').replace(/\s+/g,' ').trim()}
function L(ar,en){return esc(ar)+(en?'<span class="en">'+esc(en)+'</span>':'')}
var $app=document.getElementById('app'),player=new Audio();
function play(a){if(!a)return;try{player.pause();player.src=a;player.currentTime=0;var p=player.play();if(p&&p.catch)p.catch(function(){})}catch(e){}}

/* ---------- الطالب ---------- */
var ME=get('ptb_me',null)||get('pt_me',null),qs=new URLSearchParams(location.search),PREV=qs.get('g'),SK=qs.get('k')==='write'?'write':'read';
function gOf(sec){sec=String(sec||'');var m=/^KG([12])/i.exec(sec);if(m)return 'kg'+m[1];m=/^G(\d)/i.exec(sec);return m?'g'+m[1]:null}
var G=PREV||(ME&&!ME.pv?gOf(ME.sec):null),WHO=PREV?'preview|'+PREV:(ME?ME.sec+'|'+ME.name:''),KG=/^kg/.test(G||'');
var URL_=null,Q=get('bsk_q',[]),busy=false;
function cfg(){if(URL_!==null)return Promise.resolve(URL_);return fetch('send-config.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(c){URL_=String(c.progress||'');return URL_}).catch(function(){URL_='';return ''})}
function auth(){return {port:'B',sec:ME.sec,sid:fnv('sid|'+ME.sec+'|'+ME.name+'|'+ME.c),pf:fnv('ap|'+ME.sec+'|'+ME.name+'|'+ME.c+'|'+ME.p),g:(G||'').toUpperCase()}}
function can(){return !PREV&&ME&&ME.c&&ME.p}
function send(ev){if(!can())return;ev.d=ymd();Q.push(ev);put('bsk_q',Q);flush()}
function flush(){if(busy||!Q.length||!can())return;busy=true;var batch=Q.slice(0,20);
 cfg().then(function(url){if(!url){busy=false;return}var b=auth();b.ev=batch;
  return fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},keepalive:true,body:JSON.stringify(b)}).then(function(r){return r.json()}).then(function(j){if(j&&j.ok){Q=Q.slice(batch.length);put('bsk_q',Q)}}).catch(function(){}).then(function(){busy=false})})}
setInterval(flush,30000);document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')flush()});

/* ---------- البيانات ---------- */
var D=null,GL={},HASA={},HASI={},LES=null,ACT=null,V=null;
var ST=get('bsk|'+WHO+'|'+SK,{});function save(){put('bsk|'+WHO+'|'+SK,ST)}
function au(a){return a&&HASA[a]?'aal/audio/'+a+'.mp3':''}
function img(id){return id&&HASI[id]?'aal/img/'+id+'.webp':''}
function tx(a){return (D.txt[a]||{}).t||''}
function en(k){return GL[k]||''}
function picHtml(w){var s=img(w.img);return s?'<img src="'+s+'" alt="">':'<span>'+(w.emo||'❓')+'</span>'}
function chr(c){return D.chars[c]||{name:c,emo:'🙂'}}
function sentences(l){var a=(l.models||[]).map(function(m){return {t:tx(m.a),a:m.a}}).filter(function(x){return x.t});if(!a.length)a=(l.story||[]).map(function(s){return {t:tx(s.a),a:s.a}}).filter(function(x){return x.t&&x.t.split(/\s+/).length<=7});return a}
function words(l){return (l.words||[]).filter(function(w){return w.t})}

var RACTS=[['words','🔤','أقرأ الكلمة وأختار صورتها','Read the word, then choose its picture'],['sight','👁️','كلمات أراها كثيرًا','Words I see a lot'],['build','🧩','أرتّب الجملة','Put the sentence in order'],['story','📖','أقرأ القصة وأسجّل قراءتي','Read the story and record myself'],['quiz','❓','أفهم ما قرأت','Show I understand']];
var WACTS=[['trace','✏️','أتتبّع وأكتب','Trace, then write in my notebook'],['spell','🔠','أكتب الكلمة بالحروف','Spell the word with letters'],['fill','🧱','أكمل الجملة','Complete the sentence'],['mine','🖊️','أكتب جملتي','Write my own sentence']];
function acts(l){var A=SK==='read'?RACTS:WACTS;return A.filter(function(a){var k=a[0];
 if(k==='sight')return (l.sight||[]).length>=2;if(k==='quiz')return (l.questions||[]).length>0;if(k==='story')return (l.story||[]).length>0;if(k==='build'||k==='fill')return sentences(l).length>0;if(k==='mine')return !KG&&(l.ask||[]).length>0;return true})}
function stOf(l,k){return (ST[l.id]||{})[k]}
function setSt(l,k,v){ST[l.id]=ST[l.id]||{};if(!ST[l.id][k]||ST[l.id][k]<v)ST[l.id][k]=v;save()}

function top(){return '<div class="top">'+(window.__tqNav?window.__tqNav.btn('chip'):'')+'<a class="chip" href="b/index.html">→ أدواتي · My tools</a>'+(LES?'<button class="chip" data-a="home">📚 الدروس · Lessons</button>':'')+(ACT?'<button class="chip" data-a="les">'+esc(LES.emo||'')+' '+esc(LES.title)+'</button>':'')+'<span class="chip" style="margin-inline-start:auto">'+(PREV?'Preview · '+esc(PREV.toUpperCase()):esc(ME&&ME.name||''))+'</span></div>'}
function hdr(){return SK==='read'?['📖 أقرأ','Read in Arabic','كل درس فيه كلمات وقصة من دروس الاستماع. اقرأ أولًا، ثم اضغط 🔊 لتتأكد.','Every lesson uses the words and story from your listening lessons. Read first, then tap 🔊 to check yourself.']:['✍️ أكتب','Write in Arabic','أكتب كلمات الدرس وجمله على الشاشة، ثم في دفتري.','Write the lesson words and sentences on the screen, then in your notebook.']}
function vHome(){var H=hdr(),h=top()+'<h1>'+L(H[0],H[1])+'</h1><div class="how">👨‍👩‍👧 '+L(H[2],H[3])+'<span class="en">Parents: sit with your child, turn the sound on, and let them try alone first. Every instruction is in Arabic and English.</span></div><div class="grid">';
 D.lessons.forEach(function(l){var A=acts(l),n=A.filter(function(a){return stOf(l,a[0])}).length;h+='<button class="les" data-a="open" data-l="'+l.id+'"><div class="i">'+esc(l.emo||'📘')+'</div><h3>'+esc(l.title)+'</h3><span class="en" style="text-align:right">'+esc(l.en||'')+'</span><div class="prog"><i style="width:'+Math.round(n/A.length*100)+'%"></i></div><span class="note" dir="ltr">'+n+' / '+A.length+'</span></button>'});
 return h+'</div>'}
function vLes(){var l=LES,h=top()+'<h1 style="font-family:var(--read)">'+esc(l.emo||'')+' '+esc(l.title)+'<span class="en">'+esc(l.en||'')+'</span></h1>';
 h+='<div class="card"><h2>'+L('كلمات الدرس','Lesson words')+'</h2><div class="wopts">'+words(l).map(function(w){return '<button class="wo" data-a="say" data-au="'+au(w.a)+'" style="font-size:1.2rem">'+esc(w.t)+'<span class="en" style="text-align:center">'+esc(en('w:'+w.t)||en(w.a))+'</span></button>'}).join('')+'</div></div><div class="acts">';
 acts(l).forEach(function(a){var s=stOf(l,a[0]);h+='<button class="act'+(s?' done':'')+'" data-a="act" data-k="'+a[0]+'"><div class="i">'+a[1]+'</div><b>'+esc(a[2])+'</b><span class="en" style="text-align:right">'+esc(a[3])+'</span><div class="stars" style="text-align:right;font-size:1.1rem">'+(s?'⭐'.repeat(Math.min(3,s)):'')+'</div></button>'});
 return h+'</div>'}

/* ---------- القراءة ---------- */
function vWords(){var l=LES,W=words(l);if(!V.items){V.items=shuf(W).slice(0,Math.min(8,W.length));V.i=0;V.ok=0}
 if(V.i>=V.items.length)return endHtml(V.ok,V.items.length,'words');
 var w=V.items[V.i];if(!V.opts){var others=shuf(W.filter(function(x){return x!==w&&x.emo!==w.emo})).slice(0,2);V.opts=shuf([w].concat(others))}
 var h=top()+'<h2>'+L('🔤 اقرأ الكلمة، ثم اختر صورتها','Read the word. Then tap its picture.')+'</h2>'+bar()+'<div class="card"><div class="word">'+esc(w.t)+'</div>';
 if(V.ans!=null)h+='<div class="row ctr"><button class="btn alt sm" data-a="say" data-au="'+au(w.a)+'">🔊<span class="en">Listen</span></button><span class="mean">'+esc(en('w:'+w.t)||en(w.a))+'</span></div>';
 h+='<div class="pics" style="margin-top:10px">'+V.opts.map(function(o,i){var c=V.ans!=null?(o===w?' ok':(i===V.ans?' no':'')):'';return '<button class="pic'+c+'" data-a="wpick" data-i="'+i+'"'+(V.ans!=null?' disabled':'')+'>'+picHtml(o)+'</button>'}).join('')+'</div>';
 if(V.ans!=null)h+='<div class="row ctr" style="margin-top:12px"><button class="btn" data-a="next">'+L('التالي','Next')+'</button></div>';
 return h+'</div>'}
function bar(){return '<div class="prog"><i style="width:'+Math.round(V.i/V.items.length*100)+'%"></i></div>'}
function endHtml(ok,n,k){var p=Math.round(ok/Math.max(1,n)*100),s=p>=90?3:p>=70?2:p>=40?1:0;if(!V.sent){V.sent=1;if(s)setSt(LES,k,s);send({t:'bs',k:SK+'|'+LES.id+'|'+k,v:p});send({t:'code',k:SK==='read'?'BRD':'BWR',c:JSON.stringify({id:LES.id,title:LES.title,en:LES.en,act:k,p:p,ok:ok,n:n})})}
 return top()+'<div class="card" style="text-align:center"><div class="stars" style="font-size:2.6rem">'+(s?'⭐'.repeat(s):'💪')+'</div><h2>'+L(s>=2?'أحسنت!':'حاول مرة أخرى','' +(s>=2?'Well done!':'Try again — you can do it!'))+'</h2><p>'+ok+' / '+n+'</p><div class="row ctr"><button class="btn alt" data-a="again">🔁<span class="en">Again</span></button><button class="btn" data-a="les">'+L('أنشطة الدرس','Lesson activities')+'</button></div></div>'}

function vSight(){var l=LES,S=l.sight||[];if(!V.items){V.items=shuf(S.concat(S)).slice(0,6);V.i=0;V.ok=0}
 if(V.i>=V.items.length)return endHtml(V.ok,V.items.length,'sight');
 var w=V.items[V.i];if(!V.opts){var pool=S.filter(function(x){return x.t!==w.t}).concat(words(l).map(function(x){return {t:x.t,a:x.a}}));V.opts=shuf([w].concat(shuf(pool).slice(0,2)))}
 var h=top()+'<h2>'+L('👁️ استمع، ثم اختر الكلمة','Listen. Then tap the word you hear.')+'</h2>'+bar()+'<div class="card"><div class="row ctr"><button class="btn" data-a="say" data-au="'+au(w.a)+'">🔊<span class="en">Listen</span></button></div><div class="wopts" style="margin-top:14px">'+V.opts.map(function(o,i){var c=V.ans!=null?(o.t===w.t?' ok':(i===V.ans?' no':'')):'';return '<button class="wo'+c+'" data-a="spick" data-i="'+i+'"'+(V.ans!=null?' disabled':'')+'>'+esc(o.t)+'</button>'}).join('')+'</div>';
 if(V.ans!=null)h+='<p class="mean" style="text-align:center">'+esc(en(w.a)||'')+'</p><div class="row ctr"><button class="btn" data-a="next">'+L('التالي','Next')+'</button></div>';
 return h+'</div>'}

function toks(t){return t.replace(/[.،!؟:«»]/g,' ').split(/\s+/).filter(Boolean)}
function vBuild(k){var l=LES,SS=sentences(l);if(!V.items){V.items=SS.slice(0,5);V.i=0;V.ok=0}
 if(V.i>=V.items.length)return endHtml(V.ok,V.items.length,k||'build');
 var s=V.items[V.i],T=toks(s.t);if(!V.tl){V.tl=shuf(T.map(function(t,i){return {t:t,i:i}}));if(V.tl.map(function(x){return x.i}).join()===T.map(function(_,i){return i}).join()&&T.length>1)V.tl.reverse();V.pk=[];V.tries=0}
 var cur=V.pk.map(function(i){return V.tl[i].t}).join(' '),full=V.pk.length===T.length,right=full&&cur===T.join(' ');
 var h=top()+'<h2>'+L('🧩 رتّب الكلمات لتكوّن جملة','Tap the words in the right order to make the sentence.')+'</h2>'+bar()+'<div class="card"><div class="slot">'+esc(cur)+'&nbsp;</div>';
 if(right)h+='<div class="stars">🌟</div><p class="sent">'+esc(s.t)+'</p><div class="row ctr"><button class="btn alt sm" data-a="say" data-au="'+au(s.a)+'">🔊<span class="en">Listen</span></button><span class="mean">'+esc(en(s.a))+'</span></div><div class="row ctr" style="margin-top:10px"><button class="btn" data-a="next">'+L('التالي','Next')+'</button></div>';
 else{h+='<div class="tiles">'+V.tl.map(function(x,i){return '<button class="tile'+(V.pk.indexOf(i)>=0?' used':'')+'" data-a="tok" data-i="'+i+'"'+(V.pk.indexOf(i)>=0?' disabled':'')+'>'+esc(x.t)+'</button>'}).join('')+'</div><div class="row ctr"><button class="btn alt sm" data-a="tokbs">⌫<span class="en">Undo</span></button>'+(full?'<span class="note">'+L('ليس هذا الترتيب، جرّب مرة أخرى.','Not quite — try again.')+'</span>':'')+(V.tries>=2?'<button class="btn alt sm" data-a="say" data-au="'+au(s.a)+'">💡🔊<span class="en">Hint: listen</span></button>':'')+'</div>'}
 return h+'</div>'}

var REC=null;
function vStory(){var l=LES,h=top()+'<h2>'+L('📖 اقرأ القصة سطرًا سطرًا','Read the story line by line.')+'</h2><div class="how">'+L('اقرأ السطر بصوتك أولًا، ثم اضغط 🔊 لتسمعه. اضغط «المعنى» لترى الترجمة.','Read each line aloud first, then tap 🔊 to check. Tap "Meaning" to see it in English.')+'</div><div class="card story">';
