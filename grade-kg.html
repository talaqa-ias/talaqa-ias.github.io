@import url('https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap');
/* Layout: one column; a bright playground. Each letter is a ladder of coloured steps climbed from the bottom; a sticker after every step. Single bright theme on purpose. */
:root{

 background-image:radial-gradient(circle at 8% 12%,#FFE48A55 0 90px,transparent 91px),radial-gradient(circle at 92% 30%,#FFB3D255 0 120px,transparent 121px),radial-gradient(circle at 15% 85%,#B8F0CC66 0 110px,transparent 111px),radial-gradient(circle at 85% 90%,#CFC0FF55 0 100px,transparent 101px);background-attachment:fixed}

var UNL={};
function rcNorm(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'')}
function rcStream(code,sec,n){var o=[];for(var i=0;o.length<n;i++){var h=parseInt(fnv(code+'|'+sec+'|'+i),16);o.push(h&255,(h>>>8)&255,(h>>>16)&255,(h>>>24)&255)}return o}

function rcEnc(code,sec,txt){return btoa(rcX(code,sec,unescape(encodeURIComponent(txt))))}
function rcDec(code,sec,x){return decodeURIComponent(escape(rcX(code,sec,atob(x))))}
function rcHash(sec,code){return fnv('rc|'+sec+'|'+code)}
function rcNames(txt){return String(txt||'').split(/[،,\n]/).map(norm).filter(Boolean)}
function rcPins(sec,code){var L=DATA.rlock||{};if(!L[sec]||!L[sec].p)return null;try{return JSON.parse(rcDec(rcNorm(code),sec,L[sec].p))}catch(e){return null}}

function decode(txt){
 var S={},T={};
 (String(txt||'').match(/SP[23]\.[A-Za-z0-9_-]+/g)||[]).forEach(function(c){try{var o=JSON.parse(b64d(c.slice(4)));if(o.t&&o.t!==DATA.tool)return;
  if(c.charAt(2)==='3'){(o.r||[]).forEach(function(r){var k=nkey(r.n)+'|'+nkey(r.c);T[k]=T[k]||{n:r.n,c:r.c,L:{}};T[k].L[[r.k,r.d,r.w||'',r.t||'',r.o||'',r.lv==null?'':r.lv,o.g].join('|')]=Object.assign({tn:o.tn||''},r)});return}
  var k=nkey(o.n)+'|'+nkey(o.c);if(!S[k]||S[k].d<=o.d)S[k]=o}catch(e){}});
 var keys={};Object.keys(S).concat(Object.keys(T)).forEach(function(k){keys[k]=1});
 return Object.keys(keys).map(function(k){var s=S[k]||null,t=T[k],recs=t?Object.keys(t.L).map(function(z){return t.L[z]}).sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0}):[];
  var pl=recs.filter(function(r){return r.k==='p'}),rt=recs.filter(function(r){return r.k==='r'});
  var base=rt.filter(function(r){return r.w==='b'})[0]||null,last=rt.length?rt[rt.length-1]:null;
  var done=DATA.levels.map(function(L){return s?L.tasks.filter(function(x){return s.p&&s.p[x.id]}).length:0});var tiers=[0,0,0],tk=0,ssum=0,sn=0,rec=0,rn=0;if(s)Object.keys(s.p||{}).forEach(function(id){var a=s.p[id];if(id.indexOf('talk:')===0){tk++;return}if(a[2]>=1&&a[2]<=3)tiers[a[2]-1]++;if(a[0]&&a[1]&&a[2]){ssum+=a[0]+a[1]+a[2];sn++}rn++;if(a[3])rec++});
  
  return {n:s?s.n:t.n,c:s?s.c:t.c,d:s?s.d:'',done:done,tiers:tiers,tk:tk,self:sn?Math.round(ssum/sn*10)/10:null,rec:rn?Math.round(rec/rn*100):null,pl:pl.length?pl[pl.length-1]:null,base:base,last:last,nrt:rt.length}
 }).sort(function(a,b){return (a.c+a.n).localeCompare(b.c+b.n,'ar')});
}
