function prog(){var n=T.qs.length+(T.dir?1:0),c=R.ph==='q'?R.qi:R.ph==='dir'?T.qs.length:R.ph==='res'?n:-1,h='<div class="prog">';for(var i=0;i<n;i++)h+='<i class="'+(i<c?'d':i===c?'c':'')+'"></i>';return h+'</div>'}
function hero(){return '<div class="hero"><h1>'+esc(T.title)+'</h1>'+(T.tau?'<button class="spk" data-a="say" data-au="'+esc(T.tau)+'" aria-label="استمع إلى العنوان">🔊</button>':'')+'<span class="pill">'+esc(lvName(T.lv))+'</span><span class="pill k">'+esc(T.kind)+'</span></div>'}
function listenBox0(){var max=T.listens||2,left=max-R.heard;return '<div class="card" style="text-align:center"><button class="big'+(R.playing?' on':'')+'" data-a="listen"'+(left<=0?' disabled':'')+' aria-label="استمع إلى النص">🎧</button><p class="cnt">'+(left>0?'يمكنك الاستماع '+(left===max?max+' مرات':'مرة أخرى ('+left+' متبقية)'):'انتهت مرات الاستماع')+'</p></div>'}
function optBtn(o,act,i,sel,num){return '<div class="ow"><button class="opt'+(sel?' sel':'')+'" data-a="'+act+'" data-i="'+i+'">'+(o.img?'<img class="oi sm" src="'+esc(o.img)+'" alt="" loading="lazy">':o.e?'<span class="em">'+o.e+'</span>':'')+'<span>'+esc(o.t)+'</span>'+(num?'<span class="n">'+num+'</span>':(act==='ans'||act==='pre'?'<span class="ck"></span>':''))+'</button>'+(o.au?'<button class="spk" data-a="say" data-au="'+esc(o.au)+'" aria-label="استمع إلى الخيار">🔊</button>':'')+'</div>'}
function optHtml(q,i,sel,num){var o=q.opts[i];if(q.say){if(o.e)return '<div class="ow"><button class="opt pic'+(sel?' sel':'')+'" data-a="ans" data-i="'+i+'" aria-label="خيار '+(i+1)+'">'+(o.img?'<img class="oi" src="'+esc(o.img)+'" alt="" loading="lazy">':'<span class="em">'+o.e+'</span>')+(!o.img&&q.opts.filter(function(x){return x.e===o.e&&!x.img}).length>1?'<span style="font-family:var(--read,serif);font-size:1.15rem;font-weight:700">'+esc(o.t)+'</span>':'')+'<span class="ck"></span></button></div>';return '<div class="ow"><button class="opt ltr'+(sel?' sel':'')+'" data-a="ans" data-i="'+i+'"><span>'+esc(o.t)+'</span><span class="ck"></span></button></div>'}return optBtn(o,'ans',i,sel,num)}

function vPre(){var p=T.pre;return top()+'<h1>'+esc(T.title)+' <button class="spk" data-a="say" data-au="'+esc(T.tau||'')+'">🔊</button></h1><p class="lead">قبل الاستماع: أتوقّع</p><div class="card"><p class="q">'+esc(p.q)+' <button class="spk" data-a="say" data-au="'+esc(p.au||'')+'">🔊</button></p><div class="opts">'+p.opts.map(function(o,i){return optBtn(o,'pre',i,R.pre===i)}).join('')+'</div><p class="note">لا يوجد توقّع خاطئ. بعد الاستماع نعرف إن كان توقّعك قريبًا من القصة.</p><div class="row" style="margin-top:10px"><button class="btn" data-a="go-listen"'+(R.pre===null?' disabled':'')+'>أنا جاهز للاستماع ←</button></div></div>'}

function listenBox(){var max=T.listens||2,left=max-R.heard;return '<div class="card player"><button class="big'+(R.playing?' on':'')+'" data-a="listen"'+(left<=0||R.playing?' disabled':'')+' aria-label="استمع إلى النص">'+(R.playing?'🔉':'🎧')+'</button><div class="pbar"><i id="pbar"></i></div><p class="cnt">'+(R.playing?'أستمع الآن…':left>0?'يمكنك الاستماع '+(left===max?max+' مرات':'مرة أخرى ('+left+' متبقية)'):'انتهت مرات الاستماع')+'</p></div>'}
function qList(){return '<ol class="qlist">'+T.qs.map(function(q,i){return '<li><span class="num">'+(i+1)+'</span><span>'+esc(q.q)+'</span>'+(q.au?'<button class="spk" data-a="say" data-au="'+esc(q.au)+'" aria-label="استمع إلى السؤال">🔊</button>':'')+'</li>'}).join('')+(T.dir?'<li><span class="num">'+(T.qs.length+1)+'</span><span>وفي النهاية: أسمع توجيهًا وأنفّذه.</span></li>':'')+'</ol>'}
function vListen(){return top()+hero()+'<p class="lead">'+(R.heard?'استمعت إلى النص. أجب عن الأسئلة الآن، ويمكنك الاستماع مرة أخرى أثناء الإجابة.':'1) اقرأ الأسئلة أو استمع إليها. 2) اضغط 🎧 واستمع إلى النص لتجد الإجابات.')+'</p>'+listenBox()+'<div class="card"><h2>الأسئلة التي ستجيب عنها</h2>'+qList()+'<p class="note">الخيارات تظهر بعد الاستماع. النص المكتوب يظهر في النهاية.</p></div><div class="row" style="justify-content:center"><button class="btn" data-a="go-q"'+(R.heard<1||R.playing?' disabled':'')+'>أجيب عن الأسئلة ←</button></div>'}

function mini(){var left=(T.listens||2)-R.heard;if(!T.au)return '<div class="mini">'+prog()+'</div>';return '<div class="mini">'+prog()+'<button class="btn alt sm" data-a="listen"'+(left<=0||R.playing?' disabled':'')+'>'+(R.playing?'🔉 أستمع…':'🎧 النص ('+left+')')+'</button></div>'+(R.playing?'<div class="pbar" style="max-width:none"><i id="pbar"></i></div>':'')}
function vQ(){var q=T.qs[R.qi],a=R.ans[q.id],h=top()+mini()+'<div class="card"><p class="note" style="margin:0">السؤال '+(R.qi+1)+' من '+T.qs.length+'</p><p class="q">'+esc(q.q)+(q.au?' <button class="spk" data-a="say" data-au="'+esc(q.au)+'" aria-label="استمع إلى السؤال">🔊</button>':'')+'</p>'+(q.sau?'<div class="stim"><button class="big" data-a="say" data-au="'+esc(q.sau)+'" aria-label="استمع">🔊</button></div><p class="cnt">اضغط 🔊 لتسمع مرة أخرى</p>':'');
 if(q.type==='seq'){var s=R.seq;h+='<p class="note">اضغط الأحداث بالترتيب: الأول ثم الثاني ثم الثالث.</p><div class="opts">'+R.order[q.id].map(function(i){return optHtml(q,i,s.indexOf(i)>=0,s.indexOf(i)>=0?s.indexOf(i)+1:0)}).join('')+'</div>'+(s.length?'<div class="row" style="margin-top:8px"><button class="btn alt sm" data-a="seq-reset">↺ ابدأ الترتيب من جديد</button></div>':'')}
 else h+='<div class="opts'+(q.say&&q.opts[0].e?' pics':q.say?' pics t':'')+'">'+R.order[q.id].map(function(i){return optHtml(q,i,a===i)}).join('')+'</div>';
 if(q.type==='opinion')h+='<p class="note">هذا رأيك، ولا توجد إجابة خاطئة.</p>';
 var ready=q.type==='seq'?R.seq.length===q.opts.length:a!==undefined;
 h+='<div class="row" style="margin-top:12px"><button class="btn" data-a="next"'+(ready?'':' disabled')+'>التالي ←</button></div></div>';
 return h}

function vDir(){var d=T.dir,h=top()+mini().replace(/<button class="btn alt sm" data-a="listen"[^]*?<\/button>/,'')+'<div class="card"><p class="q">اسمع ونفّذ <button class="spk" data-a="dsay"'+(R.dheard>=2?' disabled':'')+'>🔊 '+(R.dheard?'أعد ('+(2-R.dheard)+')':'استمع')+'</button></p><p class="note">'+(d.colors.length?'لتلوين شيء: اضغط اللون ثم الشيء. ':'')+(d.items.some(function(x){return x.move})?'لنقل شيء: اضغطه ثم اضغط المكان. ':'')+'للضغط على شيء: اضغطه مرة واحدة.</p><div class="scene">';
 d.items.forEach(function(x){var gone=Object.keys(R.dput).some(function(k){return k===x.id}),inside=Object.keys(R.dput).filter(function(k){return R.dput[k]===x.id}).map(function(k){return d.items.filter(function(y){return y.id===k})[0].e}).join('');
  var col=R.dcol[x.id],ord=[];R.dlog.forEach(function(l,k){if(l.t===x.id)ord.push(k+1)});
  h+='<button class="it'+(x.zone===1?' zone':'')+(ord.length?' hit':'')+(R.dsel&&R.dsel.m===x.id?' sel':'')+(gone?' gone':'')+'" data-a="it" data-id="'+x.id+'">'+(ord.length?'<span class="ord">'+ord.map(function(n){return '<b>'+n+'</b>'}).join('')+'</span>':'')+(inside?'<span class="put">'+inside+'</span>':'')+(x.zone===1?'<span class="em" style="opacity:.35">⬚</span>':'<span class="em" style="'+(col?'background:'+col:'')+'">'+x.e+'</span>')+'<span>'+esc(x.l)+'</span></button>'});
 h+='</div>';if(d.colors.length)h+='<div class="sw">'+d.colors.map(function(c){return '<button data-a="col" data-c="'+c.id+'" class="'+(R.dsel&&R.dsel.c===c.id?'sel':'')+'" style="background:'+c.c+'" aria-label="'+esc(c.l)+'">'+esc(c.l)+'</button>'}).join('')+'</div>';
 h+='<div class="row" style="margin-top:12px"><button class="btn" data-a="dir-done"'+(R.dlog.length?'':' disabled')+'>انتهيت ←</button><button class="btn alt sm" data-a="dir-reset">↺ ابدأ من جديد</button></div></div>';return h}

/* ---------- التصحيح ---------- */
function dirScore(){var st=T.dir.steps,j=0,ok=0;st.forEach(function(s){for(;j<R.dlog.length;j++){var a=R.dlog[j];if(a.do===s.do&&a.t===s.t&&(s.do!=='color'||a.c===s.c)&&(s.do!=='put'||a.o===s.o)){ok++;j++;return}}});return {ok:ok,n:st.length}}
function grade(){var by={},pts=0,max=0,rows=[];
 graded().forEach(function(q){var a=R.ans[q.id],right=q.type==='seq'?JSON.stringify(R.seqAns&&R.seqAns[q.id])===JSON.stringify(q.a):a===q.a;
  var tp=q.type;by[tp]=by[tp]||[0,0];by[tp][1]++;if(right){by[tp][0]++;pts++}max++;rows.push({q:q,right:right})});
 if(T.dir){var ds=dirScore();by.dir=[ds.ok,ds.n];pts+=ds.ok/ds.n;max++}
 return {p:Math.round(100*pts/max),by:by,rows:rows}}

function vRes(){var g=R.g,p=g.p,h=top()+prog()+'<div class="card"><p class="res">'+(p>=80?'🌟 ':p>=50?'👍 ':'💪 ')+p+'%</p>';
 if(p>=80)h+='<p class="lead" style="text-align:center">أحسنت! فهمت النص جيدًا.'+(T.lv===ST.lv&&ST.lv<3?' فُتح لك المستوى التالي.':'')+'</p>';
 else if(p>=50)h+='<p class="lead" style="text-align:center">جيد. جرّب نصًّا آخر من المستوى نفسه، أو أعد هذا النص.</p>';
 else h+='<p class="lead" style="text-align:center">لا بأس. استمع إلى النص مرة أخرى وهو مكتوب أمامك، وسيساعدك معلمك.</p>';
 h+='<table class="tbl">'+Object.keys(g.by).map(function(k){var v=g.by[k];return '<tr><td>'+esc(TYPES[k]||(D.types||{})[k]||k)+'</td><td class="'+(v[0]===v[1]?'ok':'bad')+'">'+v[0]+' من '+v[1]+'</td></tr>'}).join('')+'</table>';
 if(T.pre)h+='<p class="note" style="margin-top:10px">🔮 توقّعك قبل الاستماع: «'+esc(T.pre.opts[R.pre].t)+'»'+(R.pre===T.pre.fit?' وكان قريبًا من القصة. 👏':'، والقصة كانت عن: «'+esc(T.pre.opts[T.pre.fit].t)+'».')+'</p>';
 h+='</div>'+(T.text?'<div class="card"><h2>النص مكتوبًا <button class="spk" data-a="say" data-au="'+esc(T.au||'')+'">🔊</button></h2><p class="text">'+esc(T.text).replace(/\n/g,'<br>')+'</p></div>':'')+'<div class="card"><h2>إجاباتي</h2>';
 g.rows.forEach(function(r){var q=r.q;h+='<p>'+(r.right?'<span class="ok">✔</span> ':'<span class="bad">✘</span> ')+esc(q.q)+(q.say?' <small class="note">(سمعتَ: '+esc(q.say)+')</small>':'')+'<br><small class="note">الإجابة: '+(q.type==='seq'?q.a.map(function(i){return esc(q.opts[i].t)}).join(' ← '):esc(q.opts[q.a].t))+'</small></p>'});
 if(T.dir){var ds=g.by.dir;h+='<p>'+(ds[0]===ds[1]?'<span class="ok">✔</span> ':'<span class="bad">✘</span> ')+'التوجيهات: '+ds[0]+' من '+ds[1]+' خطوات<br><small class="note">'+esc(T.dir.say)+'</small></p>'}
 h+='</div><div class="row"><button class="btn" data-a="home">🎧 كل النصوص</button><button class="btn alt" data-a="open" data-t="'+T.id+'">↺ أعد هذا النص</button></div>';return h}

function finish(){R.g=grade();R.ph='res';var p=R.g.p,old=ST.done[T.id];
 ST.done[T.id]={p:Math.max(p,old?old.p:0),last:p,n:(old?old.n:0)+1,d:ymd()};
 if(p>=80&&T.lv===ST.lv&&ST.lv<3)ST.lv++;save();
 var by={};Object.keys(R.g.by).forEach(function(k){by[k]=R.g.by[k]});
 send({t:'ls',k:T.id+'|L'+T.lv,v:p});
 send({t:'code',k:'LST',c:JSON.stringify({id:T.id,set:G,out:T.out||'',title:T.title,lv:T.lv,p:p,by:by,heard:R.heard,pre:R.pre,op:T.qs.filter(function(q){return q.type==='opinion'}).map(function(q){return q.opts[R.ans[q.id]]?q.opts[R.ans[q.id]].t:''})})});
 render()}

function render(){var h;if(!G)h=top()+'<h1>🎧 أستمع وأفهم</h1><div class="card"><p>ادخل أولًا من صفحة طلاقة برقمك المدرسي، ثم افتح الأداة من «أدواتي».</p><a class="btn" href="index.html">الذهاب إلى طلاقة</a></div>';
 else if(!D)h=top()+'<p class="lead">جارٍ التحميل…</p>';
 else if(!T)h=vHome();
 else h={pre:vPre,listen:vListen,q:vQ,dir:vDir,res:vRes}[R.ph]();
 $app.innerHTML=h;enAug($app)}

document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a;
 if(a==='say'){if(R&&R.playing){R.playing=false;onEnd=null;render()}play(b.dataset.au);return}
 if(a==='home'){player.pause();T=null;R=null;render();window.scrollTo(0,0);return}
 if(a==='open'){start(b.dataset.t);window.scrollTo(0,0);return}
 if(!R)return;
 if(a==='pre'){R.pre=+b.dataset.i;render();return}
 if(a==='go-listen'){R.ph=T.au?'listen':'q';render();autoQ();return}
 if(a==='listen'){if(R.heard>=(T.listens||2))return;R.heard++;R.playing=true;render();play(T.au,function(){R.playing=false;render()});return}
 if(a==='go-q'){player.pause();R.playing=false;R.ph='q';R.qi=0;render();autoQ();window.scrollTo(0,0);return}
 if(a==='ans'){var q=T.qs[R.qi],i=+b.dataset.i;if(q.type==='seq'){if(R.seq.indexOf(i)<0)R.seq.push(i)}else R.ans[q.id]=i;render();return}
 if(a==='seq-reset'){R.seq=[];render();return}
 if(a==='next'){var q2=T.qs[R.qi];if(q2.type==='seq'){R.seqAns=R.seqAns||{};R.seqAns[q2.id]=R.seq.slice();R.seq=[]}
  player.pause();if(R.qi<T.qs.length-1)R.qi++;else if(T.dir)R.ph='dir';else return finish();render();autoQ();window.scrollTo(0,0);return}
 if(a==='dsay'){if(R.dheard>=2)return;R.dheard++;play(T.dir.au);render();return}
 if(a==='col'){R.dsel={c:b.dataset.c};render();return}
 if(a==='it'){var id=b.dataset.id,it=T.dir.items.filter(function(x){return x.id===id})[0],s=R.dsel;
  if(s&&s.c){R.dcol[id]=T.dir.colors.filter(function(c){return c.id===s.c})[0].c;R.dlog.push({do:'color',t:id,c:s.c});R.dsel=null}
  else if(s&&s.m){if(it.zone){R.dput[s.m]=id;R.dlog.push({do:'put',o:s.m,t:id})}else R.dlog.push({do:'tap',t:id});R.dsel=null}
  else if(it.move&&!R.dput[id])R.dsel={m:id};
  else if(it.zone!==1){R.dlog.push({do:'tap',t:id});b.classList.add('flash')}
  render();return}
 if(a==='dir-reset'){R.dlog=[];R.dsel=null;R.dcol={};R.dput={};render();return}
 if(a==='dir-done'){finish();window.scrollTo(0,0);return}
});

render();
if(G)fetch('listen-data/'+G+'.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){D=j;render()}).catch(function(){$app.innerHTML=top()+'<h1>🎧 أستمع وأفهم</h1><div class="card"><p>نصوص الاستماع لصفك قيد الإعداد، وستصل قريبًا.</p></div>'});
})();
</script>
<script src="brand.js"></script>
</body></html>
