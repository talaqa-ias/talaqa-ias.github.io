<style>
:root{--ink:#1D2B4F;--blue:#3B6D95;--teal:#29BFCF;--gold:#E0A82E;--cream:#FFF7DD;--bg:#EAF6FB;--ok:#22B866;--bad:#E5484D;--card:#fff;--mut:#5B6B85;--sun:#FFC83D}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.wrap{max-width:860px;margin:0 auto;padding:12px 16px 40px}
.ar{font-family:"Noto Naskh Arabic",serif}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.logos{display:flex;gap:6px}.logos img{width:40px;height:40px;border-radius:50%;background:#fff}
.chip{font:inherit;font-weight:800;border:0;border-radius:999px;padding:8px 14px;background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(29,43,79,.12);cursor:pointer;font-size:1rem}
.chip.star{background:var(--sun);color:#5A3A00}
h1{font-size:clamp(1.6rem,5vw,2.2rem);margin:.2em 0 .1em;text-align:center}
.sub{color:var(--mut);text-align:center;margin:0 0 14px}
.parent{background:var(--cream);border-radius:14px;padding:10px 14px;color:#5A3A00;font-size:.98rem;margin:10px 0;direction:ltr;text-align:left}
.parent b{font-weight:800}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;direction:rtl}
.lcard{border:0;font:inherit;background:#fff;border-radius:24px;padding:14px;box-shadow:0 5px 0 rgba(29,43,79,.12);cursor:pointer;text-align:center;color:var(--ink)}
.lcard .pic{width:120px;height:120px;margin:0 auto 6px}
.lcard strong{font-size:1.6rem;display:block}.lcard small{color:var(--mut)}
.pic{display:flex;align-items:center;justify-content:center;border-radius:50%;background:#fff;overflow:hidden;box-shadow:0 0 0 6px #fff3c4}
.pic img{width:100%;height:100%;object-fit:contain}.pic .em{font-size:3.6rem;line-height:1}
.stars{letter-spacing:2px;font-size:1.1rem}
.path{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:8px;direction:rtl}@media(min-width:620px){.path{grid-template-columns:repeat(4,1fr)}}
.st{border:0;font:inherit;background:#fff;border-radius:22px;padding:14px 8px;box-shadow:0 5px 0 rgba(29,43,79,.12);cursor:pointer;color:var(--ink);position:relative}
.st .ic{font-size:2.6rem;display:block}.st b{display:block;font-size:1.15rem;margin-top:4px}
.st .badge{position:absolute;top:8px;left:10px;font-size:1.3rem}
.st.done{background:#e7f8ee}
.bar{height:12px;background:#d8e6f0;border-radius:9px;overflow:hidden;margin:8px 0 12px}.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--ok));transition:width .3s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.card{border:0;font:inherit;background:#fff;border-radius:22px;padding:12px 8px 8px;box-shadow:0 5px 0 rgba(29,43,79,.12);cursor:pointer;text-align:center;color:var(--ink)}
.card .pic{width:100px;height:100px;margin:0 auto}
.card .w{font-size:1.5rem;font-weight:700;margin-top:6px;display:block}
.card.seen{box-shadow:0 5px 0 var(--ok)}.card.on{transform:scale(1.05);box-shadow:0 0 0 5px var(--teal)}
.big{display:block;margin:6px auto;font:inherit;font-weight:800;font-size:1.3rem;border:0;border-radius:18px;padding:14px 22px;min-height:60px;background:var(--blue);color:#fff;box-shadow:0 5px 0 #24496a;cursor:pointer}
.big.ok{background:var(--ok);box-shadow:0 5px 0 #168a4b}.big.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 rgba(29,43,79,.15)}
.big.rec{background:var(--bad);box-shadow:0 5px 0 #a52a2e}.big.rec.on{animation:pulse 1s infinite}
.big:disabled{opacity:.45}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
.spk{font-size:2.2rem;border:0;background:#fff;border-radius:50%;width:84px;height:84px;box-shadow:0 5px 0 rgba(29,43,79,.15);cursor:pointer}
.spk.on{animation:pulse .8s infinite}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin:14px 0}
.opt{border:0;font:inherit;background:#fff;border-radius:24px;padding:12px;box-shadow:0 5px 0 rgba(29,43,79,.12);cursor:pointer;color:var(--ink)}
.opt .pic{width:110px;height:110px;margin:0 auto}
.opt.right{box-shadow:0 0 0 6px var(--ok)}.opt.wrong{opacity:.4;animation:shake .4s}
.opt .lt{font-size:4rem;font-weight:800;line-height:1.3}
.line{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:10px 12px;margin:8px 0;box-shadow:0 3px 0 rgba(29,43,79,.08)}
.line .pic{width:56px;height:56px;flex:none;box-shadow:none}.line .pic .em{font-size:2rem}
.line .tx{font-size:1.45rem;line-height:1.9;flex:1}
.line.on{box-shadow:0 0 0 4px var(--teal);background:#f2fdff}
.scene{width:100%;max-width:520px;aspect-ratio:4/3;margin:0 auto 10px;border-radius:24px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 5px 0 rgba(29,43,79,.12)}
.scene img{width:100%;height:100%;object-fit:cover}.scene .em{font-size:6rem}
.clapbtn{font-size:4rem;border:0;background:var(--sun);border-radius:50%;width:140px;height:140px;box-shadow:0 6px 0 #c99a1d;cursor:pointer}
.clapbtn:active{transform:scale(.94)}

.fn{direction:ltr;font-family:monospace;background:#fff;border-radius:14px;padding:12px;word-break:break-all;font-size:.95rem;margin:10px 0;user-select:all}
.dots{font-size:2rem;letter-spacing:6px;min-height:2.6rem;text-align:center}

.adult .q{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #eef2f6}
.adult .q:last-child{border-bottom:0}
.mini{font:inherit;font-weight:800;border:0;border-radius:12px;padding:10px 14px;background:#eef2f6;cursor:pointer;font-size:1.2rem}
.mini.sel{background:var(--ok);color:#fff}.mini.sel.n{background:var(--gold)}
.note{color:var(--mut);text-align:center;font-size:.95rem}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;z-index:9}

.day{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;direction:rtl;margin:10px 0}
.day button{border:0;font:inherit;font-weight:800;border-radius:18px;padding:12px 4px;background:#fff;box-shadow:0 4px 0 rgba(29,43,79,.12);cursor:pointer;color:var(--ink);font-size:1.05rem}

.steps{display:flex;gap:6px;justify-content:center;margin:6px 0 10px;direction:rtl}.steps span{width:14px;height:14px;border-radius:50%;background:#d8e6f0}.steps span.on{background:var(--teal)}.steps span.ok{background:var(--ok)}

.parts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;direction:rtl;margin:10px 0}
.part{border:0;font:inherit;font-size:1.6rem;font-weight:700;border-radius:16px;padding:10px 16px;background:#fff;box-shadow:0 4px 0 rgba(29,43,79,.12);cursor:pointer;color:var(--blue);font-family:"Noto Naskh Arabic",serif}
.part.sl{color:#8a5a00;background:#fff3c4}.part.hit{box-shadow:0 0 0 4px var(--ok)}

.tts{position:fixed;bottom:6px;left:50%;transform:translateX(-50%);background:#fff3c4;color:#5A3A00;font-size:.8rem;padding:3px 10px;border-radius:999px;z-index:9}
.wk{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;direction:rtl}

function go(v){EP++;stopAll();if(REC&&REC.state==='recording')try{REC.stop()}catch(e){}view=v;render();scrollTo(0,0)}
function render(){var f={home:vHome,week:vWeek,day:vDay,dict:vDict,code:vCode}[view.n]||vHome;app.innerHTML=f();if(view.after){var a=view.after;view.after=null;a()}}
function vHome(){var w=Wk(LS.w),n=myName();
 var h=top()+'<h1 class="ar">🗣️ روتين التحدّث</h1><p class="sub">'+esc(D.sname)+(n?' · '+esc(n):'')+'</p>';
 h+='<div class="parent"><b>For parents:</b> a 10-minute daily speaking routine. Your child hears a short greeting routine, learns the week’s words, then builds sentences with one fixed pattern per day and records an answer about themselves. '+(D.lock?'One new day opens each calendar day; finished days can be replayed any time.':'')+'</div>';
 if(w){var st=lockState(LS.w,LS.d);h+='<div class="today"><h2>'+(st==='tomorrow'?'أنهيتَ جلسة اليوم ✅':'جلسة اليوم')+'</h2><p style="margin:0 0 8px;font-size:1.2rem">'+esc(w.emo+' '+w.topic)+' · اليوم '+(LS.d+1)+'</p>'+(st==='tomorrow'?'<p style="margin:0">الجلسة التالية تُفتح غدًا إن شاء الله · Next session opens tomorrow</p><button class="big" data-a="week" data-w="'+LS.w+'">🔁 أعد جلسة اليوم</button>':'<button class="big" data-a="start" data-w="'+LS.w+'" data-d="'+LS.d+'">▶️ ابدأ</button>')+'</div>'}
 else h+='<div class="today"><h2>أكملتَ كل الأسابيع المتاحة 🎉</h2></div>';
 h+='<div class="wk">'+D.weeks.map(function(wk,i){var lk=i>LS.w;return '<button class="lcard'+(lk?' lock':'')+'" data-a="week" data-w="'+i+'"'+(lk?' disabled':'')+'>'+picHTML('',wk.emo)+'<strong class="ar">'+esc(wk.topic)+'</strong><small>الأسبوع '+(i+1)+'</small><div class="stars">'+(lk?'🔒':'⭐ '+weekStars(i)+'/15')+'</div></button>'}).join('')+'</div>';
 h+='<div class="row" style="margin-top:14px"><button class="chip" data-a="dict">📖 قاموسي</button><button class="chip" data-a="code">🔢 رمز إنجازي</button><a class="chip" href="'+D.lib+'" style="text-decoration:none">🎧 مكتبة الاستماع</a></div>';
 return h}
function vWeek(){var w=Wk(view.w);var h=top('home')+'<h1 class="ar">'+esc(w.emo+' '+w.topic)+'</h1><p class="sub">الأسبوع '+(view.w+1)+' · '+esc(w.en)+'</p>';
 h+='<div class="day">'+[0,1,2,3,4].map(function(d){var st=lockState(view.w,d),lab=['اليوم 1','اليوم 2','اليوم 3','اليوم 4','اليوم 5'][d],sub=d<3?(w.patterns[d]?'نمط '+(d+1):''):d===3?'أسأل':'أحكي عن نفسي';
  return '<button data-a="start" data-w="'+view.w+'" data-d="'+d+'" class="'+(st==='done'?'done':'')+(isCurrent(view.w,d)?' now':'')+'"'+(st==='locked'||st==='tomorrow'?' disabled':'')+'>'+lab+'<br><small>'+esc(sub)+'</small><br>'+(st==='done'?'⭐'.repeat(dayStars(view.w,d))||'✓':st==='locked'?'🔒':st==='tomorrow'?'🌙 غدًا':'▶️')+'</button>'}).join('')+'</div>';
 h+='<h3 class="ar" style="direction:rtl;margin:14px 0 6px">كلمات الأسبوع</h3><div class="grid" style="direction:rtl">'+w.dict.map(function(x,i){return '<button class="card" data-a="sayw" data-w="'+view.w+'" data-i="'+i+'">'+picHTML(x.img,x.emo)+'<span class="w ar">'+esc(x.t)+'</span></button>'}).join('')+'</div>';
 h+='<h3 class="ar" style="direction:rtl;margin:14px 0 6px">أنماط الأسبوع</h3>'+w.patterns.map(function(p,i){return '<div class="bubble"><span class="tx">'+esc(p.frame)+'</span><button class="spk" style="width:56px;height:56px;font-size:1.5rem" data-a="sayex" data-w="'+view.w+'" data-p="'+i+'">🔊</button></div><div class="parent" style="margin:0 0 8px">'+esc(p.note)+'</div>'}).join('');
 if(w.song.length)h+='<div class="row"><button class="big ghost" data-a="song" data-w="'+view.w+'">🎵 إنشاد الأسبوع</button></div>';
 return h}
function vDict(){var h=top('home')+'<h1 class="ar">📖 قاموسي</h1><p class="sub">الكلمات التي تعلّمتها · tap to hear</p><div class="dlist">';
 for(var w=0;w<=Math.min(LS.w,D.weeks.length-1);w++){var wk=Wk(w);h+='<h3 class="ar">'+esc(wk.emo+' '+wk.topic)+'</h3><div class="grid">'+wk.dict.map(function(x,i){return '<button class="card" data-a="sayw" data-w="'+w+'" data-i="'+i+'">'+picHTML(x.img,x.emo)+'<span class="w ar">'+esc(x.t)+'</span>'+(x.forms.acc?'<small class="ar">'+esc(x.forms.acc.t)+'</small>':'')+'</button>'}).join('')+'</div>'}
 return h+'</div>'}
function vCode(){var me=window.__me||{},c=myCode();return top('home')+'<h1>🔢 رمز إنجازي</h1><div class="parent"><b>For parents:</b> copy this code and send it to the teacher. It contains only the stars'+(me.n?' of '+esc(me.n):'')+', no recordings.</div>'+(me.n?'':'<p class="note">⚠️ لم تدخل من البوابة باسمك، فالرمز بلا اسم.</p>')+'<div class="fn" id="mycode">'+esc(c)+'</div><div class="row"><button class="big ok" data-a="copycode">📋 انسخ · Copy</button></div>'}
/* ---- the daily session ---- */
function stepsFor(w,d){var s=['routine'];if(Wk(w).recall)s.push('recall');s.push('dict');s.push(d<3?'pat':d===3?'ask':'self');s.push('done');return s}
function startDay(w,d){var st=lockState(w,d);if(st==='locked'){toast('🔒 أكمل الأيام السابقة أولًا');return}if(st==='tomorrow'){toast('🌙 الجلسة التالية غدًا');return}
 var wk=Wk(w),nf=Math.min(D.fixed.length,4+2*w);
 view={n:'day',w:w,d:d,steps:stepsFor(w,d),si:0,stars:[0,0,0],built:0,sentences:[],heard:0,hits:{},i:0,ph:'',fixedN:nf};render();enterStep()}
function cur(){return view.steps[view.si]}
function nextStep(){EP++;stopAll();view.si++;view.i=0;view.ph='';view.heard=0;view.hits={};view.q=null;enterStep();scrollTo(0,0)}
function enterStep(){var s=cur(),w=Wk(view.w);
 if(s==='routine'){routineLine()}
 else if(s==='recall'){view.ph='w';view.q=makeQuiz(w.recall.w,w.recall.w.length);view.i=0;render();say(w.recall.w[0])}
 else if(s==='dict'){view.ph=view.d<2?'learn':'quiz';if(view.ph==='learn'){view.i=0;render();say(w.dict[0])}else startQuiz()}
 else if(s==='pat'){view.p=w.patterns[view.d];view.ph='hear';render();hearEx()}
 else if(s==='ask'){view.i=0;view.ph='ask';render();say(w.patterns[0].q)}
 else if(s==='self'){view.i=0;view.ph='self';render();say(w.self[0])}
 else if(s==='done'){finishDay()}}
function routineLine(){if(cur()!=='routine')return;var L=D.fixed[view.i],ep=EP;render();if(!L.child){say(L).then(function(){if(ep!==EP)return;later(function(){view.i++;if(view.i>=view.fixedN)nextStep();else routineLine()},400)})}else{say({a:L.a,t:withName(L.t)})}}
function makeQuiz(words,n){var idx=words.map(function(_,i){return i});return shuffle(idx).slice(0,n).map(function(t){var others=shuffle(idx.filter(function(j){return j!==t})).slice(0,2);return {t:t,o:shuffle([t].concat(others)),ok:null,tries:0}})}
function startQuiz(){var w=Wk(view.w);view.ph='quiz';view.q=makeQuiz(w.dict,Math.min(w.dict.length,view.d<2?w.dict.length:4));view.i=0;render();say(w.dict[view.q[0].t])}
function hearEx(){var p=view.p,ep=EP,si=view.si;say(p.ex).then(function(){if(ep!==EP||view.si!==si||view.ph!=='hear')return;view.heard++;render()})}
function exItems(p){var it=[];p.chunks.forEach(function(c,i){it.push(c);if(p.slots[i])it.push(p.slots[i].opts[0])});return it}
function sentHTML(p,fill,now){var parts=p.frame.split('___'),h='<div class="sent">';parts.forEach(function(t,i){h+='<span class="ch">'+esc(t)+'</span>';if(i<parts.length-1){var f=fill&&fill[i];h+='<span class="sl'+(f?' filled':'')+(now===i?' now':'')+'" data-a="slot" data-i="'+i+'">'+(f?esc(f.t):'&nbsp;')+'</span>'}});return h+'</div>'}
function sentText(p,fill){var parts=p.frame.split('___'),s='';parts.forEach(function(t,i){s+=t;if(i<parts.length-1)s+=fill[i].t});return s.replace(/\s+/g,' ')}
function buildItems(p,fill){var it=[];p.chunks.forEach(function(c,i){it.push(c);if(fill[i])it.push(fill[i])});return it}
function headDay(){var w=Wk(view.w),s=cur(),names={routine:['👋 التحية','Greeting routine — say each line out loud.'],recall:['🧠 أتذكّر','Remember last week.'],dict:['📖 كلماتي','Words of the week: listen, repeat, then choose the picture.'],pat:['🧱 أبني جملة','Sentence pattern of the day.'],ask:['❓ أسأل','Today the child asks the questions.'],self:['🗣️ أحكي عن نفسي','Answer about yourself and record.'],done:['🏁','']};
 var h=top('week')+'<div class="steps">'+view.steps.map(function(x,i){return '<span class="'+(i<view.si?'ok':i===view.si?'on':'')+'"></span>'}).join('')+'</div><h1 class="ar" style="font-size:1.5rem">'+names[s][0]+'</h1><p class="sub ar">'+esc(w.emo+' '+w.topic)+' · اليوم '+(view.d+1)+'</p>';
 return h}
function vDay(){var s=cur(),w=Wk(view.w),h=headDay();
 if(s==='routine'){var n=view.fixedN;for(var i=0;i<=Math.min(view.i,n-1);i++){var L=D.fixed[i],me=L.child,curr=i===view.i;h+='<div class="bubble'+(me?' me':'')+(curr?'':' dim')+'">'+charPic(me?'K':'T')+'<span class="tx">'+(me?'<small style="color:#8a5a00">قُلْ:</small> ':'')+esc(me?withName(L.t):L.t)+'</span>'+(curr?'<button class="spk" style="width:56px;height:56px;font-size:1.4rem" data-a="rl">🔊</button>':'')+'</div>'}
  var L=D.fixed[view.i];if(L&&L.child)h+='<div class="row"><button class="big rec" data-a="rec" data-k="'+recKey('f'+view.i)+'">🎙️ سجّل</button><button class="big ok" data-a="rnext">✅ قلتُها</button></div>';
  h+='<div class="parent">Teacher asks, child answers with their own name and class. Tap 🔊 to hear the model again.</div>'}
 else if(s==='recall'){var r=w.recall;
  if(view.ph==='w'){h+=quizHTML(r.w,view.q,view.i)}
  else{var b=r.bridge;h+='<p class="note ar">النمط القديم بكلمات جديدة · old pattern, new words</p>'+sentHTML(b,view.fill,view.fill.length)+optsHTML(b.slots[view.fill.length]?b.slots[view.fill.length].opts:[],'fillb')+'<p class="note">'+view.built+'/2 ✅</p>'+(view.built>=2?'<div class="row"><button class="big ok" data-a="next">التالي ←</button></div>':'')}}
 else if(s==='dict'){
  if(view.ph==='learn'){var x=w.dict[view.i];h+='<div class="row" style="flex-direction:column">'+picHTML(x.img,x.emo,'')+'<div class="sent">'+esc(x.t)+'</div></div><div class="row"><button class="spk" data-a="sayi">🔊</button></div><div class="row"><button class="big ok" data-a="lnext">'+(view.i<w.dict.length-1?'التالي ←':'إلى الاختبار')+'</button></div><p class="note">'+(view.i+1)+'/'+w.dict.length+' · listen and repeat</p>';
   var cg=x.cog;}
  else h+=quizHTML(w.dict,view.q,view.i)}
 else if(s==='pat'){var p=view.p;
  if(view.ph==='hear'){h+='<p class="note ar">'+esc(p.name)+'</p>'+sentHTML(p,p.slots.map(function(s){return s.opts[0]}))+'<div class="row"><button class="spk" data-a="hear">🔊</button></div><p class="note">سمعتُها '+view.heard+'/3</p><div class="parent">'+esc(p.note)+'</div>'+(view.heard>=3?'<div class="row"><button class="big ok" data-a="torep">أكرّر ←</button></div>':'')}
  else if(view.ph==='rep'){var it=exItems(p),all=it.every(function(_,i){return view.hits[i]});h+='<p class="note ar">اضغط كل جزء واسمعه وكرّره · tap each part, listen, repeat</p>'+sentHTML(p,p.slots.map(function(s){return s.opts[0]}))+'<div class="parts">'+it.map(function(x,i){var isS=p.chunks.indexOf(x)<0;return '<button class="part'+(isS?' sl':'')+(view.hits[i]?' hit':'')+'" data-a="part" data-i="'+i+'">'+esc(x.t)+'</button>'}).join('')+'</div>'+(all?'<div class="row"><button class="big ok" data-a="tobuild">أبني جملتي ←</button></div>':'')}
  else if(view.ph==='build'){var k=view.fill.length,full=k>=p.slots.length;h+='<p class="note ar">اختر الصورة لتملأ الفراغ · choose a picture for the gap</p>'+sentHTML(p,view.fill,full?-1:k)+(full?'<div class="row"><button class="spk" data-a="saysent">🔊</button><button class="big" data-a="again">➕ جملة أخرى</button></div>':optsHTML(p.slots[k].opts,'fill'))+'<p class="note">جملي: '+view.built+'/3 ✅</p>'+(view.built>=3?'<div class="row"><button class="big ok" data-a="toans">أجيب عن السؤال ←</button></div>':'')}
  else if(view.ph==='ans'){h+='<div class="bubble">'+charPic('T')+'<span class="tx">'+esc(p.q.t)+'</span><button class="spk" style="width:56px;height:56px;font-size:1.4rem" data-a="sayq">🔊</button></div><div class="bubble me">'+charPic('K')+'<span class="tx">'+esc(p.frame)+'</span></div>'+recRow(recKey('p'+view.d))+'<div class="parent">Child answers with the pattern about themselves (real things!). Recording earns the star; the adult tick is optional.</div>'+adultRow()}}
 else if(s==='ask'){var p=w.patterns[view.i];h+='<p class="note ar">اليوم أنت تسأل والمعلمة تجيب · you ask, the teacher answers</p><div class="bubble me">'+charPic('K')+'<span class="tx"><small style="color:#8a5a00">اسأل:</small> '+esc(p.q.t)+'</span><button class="spk" style="width:56px;height:56px;font-size:1.4rem" data-a="sayq">🔊</button></div>'+(view.ph==='asked'?'<div class="bubble">'+charPic('T')+'<span class="tx">'+esc(p.ex.t)+'</span></div>':'')+recRow(recKey('a'+view.i))+(view.ph==='asked'?'<div class="row"><button class="big ok" data-a="asknext">'+(view.i<w.patterns.length-1?'السؤال التالي ←':'التالي ←')+'</button></div>':'<div class="row"><button class="big" data-a="asked">✅ سألتُ</button></div>')+'<p class="note">'+(view.i+1)+'/'+w.patterns.length+'</p>'}
 else if(s==='self'){var q=w.self[view.i];h+='<div class="bubble">'+charPic('T')+'<span class="tx">'+esc(q.t)+'</span><button class="spk" style="width:56px;height:56px;font-size:1.4rem" data-a="sayself">🔊</button></div>'+recRow(recKey('s'+view.i))+'<div class="parent">Answer about yourself using this week’s patterns. Record and listen back; the adult tick is optional.</div>'+adultRow()+'<p class="note">'+(view.i+1)+'/'+w.self.length+'</p>'}
 else if(s==='done'){var st=view.stars,lab=['الكلمات','الجمل','الإجابة'];h+='<div class="reward"><span class="big-ic">🏆</span><h2 class="ar">أنهيتَ جلسة اليوم!</h2><div class="stars" style="font-size:2rem">'+st.map(function(x){return x?'⭐':'☆'}).join('')+'</div><p class="note ar">'+st.map(function(x,i){return lab[i]+(x?' ✅':' ◻️')}).join(' · ')+'</p></div><div class="row">'+(w.song.length?'<button class="big ghost" data-a="song" data-w="'+view.w+'">🎵 إنشاد</button>':'')+'<button class="big ok" data-a="home">🏠 الرئيسية</button></div>'}
 return h}
function recKey(x){return 'r:'+D.stage+':'+dk(view.w,view.d)+':'+x}
function recRow(k){return '<div class="row"><button class="big rec" data-a="rec" data-k="'+k+'">🎙️ سجّل</button><button class="big ghost" data-a="playrec" data-k="'+k+'">▶️ أسمع تسجيلي</button></div>'}
function adultRow(){return '<div class="adult"><div class="q"><span class="ar">هل قالها؟ · Did the child say it?</span><span><button class="mini'+(view.adult===1?' sel':'')+'" data-a="adult" data-v="1">✅ نعم</button> <button class="mini'+(view.adult===0?' sel n':'')+'" data-a="adult" data-v="0">🔁 ليس بعد</button></span></div></div>'+'<div class="row"><button class="big ok" data-a="next">التالي ←</button></div>'}
function quizHTML(words,q,i){if(!q)return '';var qq=q[i],h='<p class="note ar">اسمع واختر الصورة · listen and choose</p><div class="row"><button class="spk" data-a="sayqz">🔊</button></div><div class="opts">'+qq.o.map(function(o){var w=words[o],cls=qq.ok!=null&&o===qq.t?' right':qq.wrong&&qq.wrong.indexOf(o)>=0?' wrong':'';return '<button class="opt'+cls+'" data-a="pick" data-o="'+o+'">'+picHTML(w.img,w.emo)+(qq.ok!=null?'<span class="wt">'+esc(w.t)+'</span>':'')+'</button>'}).join('')+'</div><div class="fb '+(qq.ok===true?'ok':qq.ok===false?'no':'')+'">'+(qq.ok===true?'أَحْسَنْتَ! 🎉':qq.ok===false?'هذه هي ✅':'')+'</div>'+(qq.ok!=null?'<div class="row"><button class="big ok" data-a="qnext">'+(i<q.length-1?'التالي ←':'تم ✅')+'</button></div>':'')+'<p class="note">'+(i+1)+'/'+q.length+'</p>';return h}
function optsHTML(opts,act){return '<div class="opts small">'+shuffle(opts).map(function(o){var j=opts.indexOf(o);return '<button class="opt" data-a="'+act+'" data-o="'+j+'">'+picHTML(o.img,o.emo)+'<span class="wt">'+esc(o.t)+'</span></button>'}).join('')+'</div>'}
function finishDay(){var k=dk(view.w,view.d),was=LS.done[k];LS.done[k]={d:today(),s:view.stars.map(function(x,i){return Math.max(x,was?was.s[i]||0:0)})};
 if(isCurrent(view.w,view.d)){LS.d++;if(LS.d>=5){LS.d=0;LS.w++}LS.lastDate=today()}save();render();confetti();praise()}
/* ---- actions ---- */
document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a,w=view.w!=null?Wk(view.w):null;
 switch(a){
 case 'home':go({n:'home'});break;
 case 'week':go({n:'week',w:+b.dataset.w});break;
 case 'dict':go({n:'dict'});break;
 case 'code':go({n:'code'});break;
 case 'copycode':try{navigator.clipboard.writeText(myCode()).then(function(){toast('نُسخ الرمز · Copied')})}catch(e){}break;
 case 'start':startDay(+b.dataset.w,+b.dataset.d);break;
 case 'sayw':EP++;stopAll();say(Wk(+b.dataset.w).dict[+b.dataset.i]);break;
 case 'sayex':EP++;stopAll();say(Wk(+b.dataset.w).patterns[+b.dataset.p].ex);break;
 case 'song':EP++;stopAll();sayAll(Wk(+b.dataset.w).song);toast('🎵');break;
 /* routine */
 case 'rl':EP++;var L=D.fixed[view.i];say({a:L.a,t:L.child?withName(L.t):L.t});break;
 case 'rnext':EP++;stopAll();view.i++;if(view.i>=view.fixedN)nextStep();else routineLine();break;
 /* quiz (dict + recall words) */
 case 'sayqz':EP++;var words=cur()==='recall'?w.recall.w:w.dict;say(words[view.q[view.i].t]);break;
 case 'pick':(function(){var words=cur()==='recall'?w.recall.w:w.dict,q=view.q[view.i],o=+b.dataset.o;if(q.ok!=null)return;q.wrong=q.wrong||[];if(o===q.t){q.ok=true;render();praise()}else{q.wrong.push(o);q.tries++;if(q.tries>=2){q.ok=false;render();say(words[q.t])}else{render();say(words[q.t])}}})();break;
 case 'qnext':(function(){var words=cur()==='recall'?w.recall.w:w.dict;if(view.i<view.q.length-1){view.i++;render();say(words[view.q[view.i].t])}else{var g=view.q.filter(function(q){return q.ok===true&&q.tries===0}).length;if(cur()==='dict'){view.stars[0]=g>=Math.ceil(view.q.length*0.7)?1:0;nextStep()}else{if(w.recall.bridge){view.ph='b';view.fill=[];view.built=0;render()}else nextStep()}}})();break;
 case 'fillb':(function(){var bb=w.recall.bridge,k=view.fill.length,o=bb.slots[k].opts[+b.dataset.o];view.fill.push(o);EP++;say(o);if(view.fill.length>=bb.slots.length){view.built++;render();later(function(){sayAll(buildItems(bb,view.fill)).then(function(){later(function(){if(view.built<2){view.fill=[];render()}},600)})},300)}else render()})();break;
 case 'next':nextStep();break;
 /* dict learn */
 case 'sayi':EP++;say(w.dict[view.i]);break;
 case 'lnext':EP++;stopAll();if(view.i<w.dict.length-1){view.i++;render();say(w.dict[view.i])}else startQuiz();break;
 /* pattern */
 case 'hear':EP++;hearEx();break;
 case 'torep':view.ph='rep';view.hits={};render();break;
 case 'part':(function(){var it=exItems(view.p),i=+b.dataset.i;view.hits[i]=1;EP++;render();say(it[i])})();break;
 case 'tobuild':view.ph='build';view.fill=[];view.built=0;view.sentences=[];render();break;
 case 'fill':(function(){var p=view.p,k=view.fill.length,o=p.slots[k].opts[+b.dataset.o];view.fill.push(o);EP++;say(o);if(view.fill.length>=p.slots.length){var s=sentText(p,view.fill);if(view.sentences.indexOf(s)<0){view.sentences.push(s);view.built++}render();later(function(){sayAll(buildItems(p,view.fill)).then(function(){if(view.built>=3)praise()})},300)}else render()})();break;
 case 'saysent':EP++;sayAll(buildItems(view.p,view.fill));break;
 case 'again':view.fill=[];render();break;
 case 'toans':view.ph='ans';view.adult=null;view.stars[1]=1;render();say(view.p.q);break;
 case 'sayq':EP++;say(cur()==='ask'?w.patterns[view.i].q:view.p.q);break;
 case 'adult':view.adult=+b.dataset.v;if(view.adult===1){if(cur()==='pat')view.stars[2]=1;else{view.okc=(view.okc||0)+1}}render();break;
 /* ask day */
 case 'asked':view.ph='asked';view.asked=(view.asked||0)+1;render();EP++;say(w.patterns[view.i].ex);break;
 case 'asknext':EP++;stopAll();if(view.i<w.patterns.length-1){view.i++;view.ph='ask';render();say(w.patterns[view.i].q)}else{view.stars[0]=view.stars[0];view.stars[1]=view.asked>=w.patterns.length?1:0;view.stars[2]=view.recd>=2?1:0;nextStep()}break;
 /* self day */
 case 'sayself':EP++;say(w.self[view.i]);break;
 /* recording */
 case 'rec':(function(){var k=b.dataset.k;recToggle(k,b,function(){view.recd=(view.recd||0)+1;if(cur()==='pat')view.stars[2]=1;toast('✅ سُجِّل');render()})})();break;
 case 'playrec':EP++;playRec(b.dataset.k);break;
 }
});
/* self-day 'next' handling: advance prompts, then finish */
var _next=nextStep;nextStep=function(){if(cur()==='self'&&view.i<Wk(view.w).self.length-1){view.i++;view.adult=null;render();say(Wk(view.w).self[view.i]);return}
 if(cur()==='self'){view.stars[1]=(view.recd||0)>=1?1:0;view.stars[2]=(view.recd||0)>=3?1:0}_next()};
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=function(){};
render();
})();
</script></body></html>
