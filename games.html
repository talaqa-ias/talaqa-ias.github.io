<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ساحة الألعاب · طلاقة</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap');
:root{--bg:#EAF6FF;--card:#fff;--ink:#1D2B4F;--muted:#5B6B8C;--line:#D3E4F5;--sky:#2F9BF0;--navy:#1E6FD9;--grass:#22B866;--sun:#FFC83D;--coral:#FF6B6B;--grape:#8E5CF7;--tang:#FF9417;--pink:#FF4F9A;--ok:#DDF7E8;--bad:#FFE3E3;
 --ui:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;--read:"Noto Naskh Arabic","Traditional Arabic",serif;color-scheme:light}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--ui);font-size:17px;line-height:1.55;padding-inline:16px;padding-block:0 60px;
 background-image:radial-gradient(circle at 8% 12%,#FFE48A55 0 90px,transparent 91px),radial-gradient(circle at 92% 30%,#FFB3D255 0 120px,transparent 121px),radial-gradient(circle at 15% 85%,#B8F0CC66 0 110px,transparent 111px);background-attachment:fixed}
*{box-sizing:border-box}#app{max-width:820px;margin-inline:auto}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:14px;flex-wrap:wrap}
.chip{border:0;background:var(--card);border-radius:999px;padding:8px 16px;font-weight:800;box-shadow:0 3px 0 var(--line);text-decoration:none;color:var(--ink)}
.chip.pts{background:var(--sun);box-shadow:0 3px 0 #D9A21C}
h1{font-size:1.9rem;margin:4px 0;font-weight:800}.lead{color:var(--muted);margin:0 0 16px}
.panel{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 6px 0 var(--line);margin-bottom:16px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.gm{border:0;border-radius:26px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;background:var(--c);box-shadow:0 6px 0 var(--d);min-height:160px;justify-content:center}
.gm .ic{font-size:3rem;line-height:1}.gm strong{font-size:1.25rem}.gm small{opacity:.92;font-weight:700;text-align:center;line-height:1.3}.gm .best{background:#ffffff33;border-radius:999px;padding:0 10px;font-size:.8rem;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:18px;padding:12px 22px;font-weight:800;font-size:1.1rem;background:var(--grass);color:#fff;min-height:52px;box-shadow:0 5px 0 #168A4B}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line)}.btn.small{min-height:40px;padding:6px 14px;font-size:.95rem}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.hud .bar{flex:1;min-width:120px;height:14px;background:#DCE8F5;border-radius:8px;overflow:hidden}.hud .bar b{display:block;height:100%;background:var(--grass);transition:width .3s}
.big{font-family:var(--read);font-size:2.4rem;font-weight:700;text-align:center;line-height:1.6}
.emo{font-size:4.2rem;text-align:center;line-height:1.2}
.ask{background:var(--card);border-radius:22px;padding:14px;text-align:center;box-shadow:0 6px 0 var(--line);margin-bottom:12px}
.ask .t{color:var(--muted);font-weight:700}
.arena{position:relative;height:56vh;min-height:330px;max-height:520px;background:linear-gradient(#CFEAFF,#EAF6FF);border-radius:26px;overflow:hidden;box-shadow:inset 0 -6px 0 #BFE0FA;touch-action:manipulation}
.fall{position:absolute;top:0;border:0;border-radius:999px;padding:10px 18px;font-family:var(--read);font-weight:700;font-size:1.6rem;background:#fff;box-shadow:0 5px 0 var(--line);white-space:nowrap;will-change:transform}
.fall.l{width:74px;height:74px;padding:0;font-size:2.3rem;display:flex;align-items:center;justify-content:center}
.fall.hit{background:var(--grass);color:#fff;box-shadow:0 5px 0 #168A4B;transition:opacity .4s;opacity:0}
.fall.miss{background:var(--coral);color:#fff;animation:shake .35s}
@keyframes shake{0%,100%{translate:0}25%{translate:-6px}75%{translate:6px}}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.tile{border:0;background:var(--card);border-radius:16px;min-width:58px;min-height:58px;padding:6px 14px;font-family:var(--read);font-size:1.7rem;font-weight:700;box-shadow:0 5px 0 var(--line)}
.tile.used{visibility:hidden}.tile.bad{background:var(--bad);animation:shake .35s}.tile.ok{background:var(--ok)}
.tile.w{font-size:1.35rem}
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:64px;padding:8px;border:3px dashed var(--line);border-radius:18px;background:#F6FAFF;direction:rtl}
.slot{min-width:46px;height:54px;border-bottom:4px solid var(--sky);display:flex;align-items:center;justify-content:center;font-family:var(--read);font-size:1.7rem;font-weight:700}
.chipw{background:var(--card);border-radius:12px;padding:4px 12px;font-family:var(--read);font-size:1.35rem;box-shadow:0 3px 0 var(--line)}
.mwrap{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:40px 70px;padding:6px}
.mwrap svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mb{border:0;background:var(--card);border-radius:18px;min-height:66px;font-family:var(--read);font-size:1.6rem;font-weight:700;box-shadow:0 5px 0 var(--line);position:relative;z-index:1}
.mb.e{font-size:2.4rem;font-family:var(--ui)}
.mb.sel{outline:4px solid var(--sun)}.mb.done{background:var(--ok);box-shadow:0 5px 0 #9ad8b4}.mb.bad{background:var(--bad);animation:shake .35s}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{aspect-ratio:1;border:0;border-radius:18px;background:var(--grape);box-shadow:0 5px 0 #6236C9;font-size:2rem;color:#fff;font-family:var(--read);font-weight:700;display:flex;align-items:center;justify-content:center;padding:4px;line-height:1.3}
.card.open{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line)}.card.done{background:var(--ok);color:var(--ink);box-shadow:0 5px 0 #9ad8b4}
.card .w{font-size:1.15rem}
.opts{display:grid;gap:10px}.opt{border:0;background:var(--card);border-radius:18px;padding:14px;font-family:var(--read);font-size:1.3rem;font-weight:700;box-shadow:0 5px 0 var(--line);text-align:right}
.opt.ok{background:var(--ok)}.opt.bad{background:var(--bad)}
.passage{font-family:var(--read);font-size:1.3rem;line-height:2.1;background:#FFFDF5;border-radius:18px;padding:16px;max-height:46vh;overflow:auto;box-shadow:inset 0 0 0 2px #F3E7BF}
.kbd{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:10px;direction:rtl}
.key{border:0;background:var(--card);border-radius:10px;min-height:48px;font-family:var(--read);font-size:1.4rem;font-weight:700;box-shadow:0 3px 0 var(--line)}
.key.f{grid-column:span 2;font-family:var(--ui);font-size:1rem}
.typed{min-height:64px;background:#F6FAFF;border:3px solid var(--line);border-radius:16px;font-family:var(--read);font-size:2rem;text-align:center;padding:4px}
.story{display:grid;gap:10px}
.sline{border:0;background:var(--card);border-radius:16px;padding:12px 14px;font-family:var(--read);font-size:1.2rem;text-align:right;box-shadow:0 4px 0 var(--line);line-height:1.8}
.sline.pick{opacity:.35}.sline .n{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--sky);color:#fff;align-items:center;justify-content:center;font-family:var(--ui);margin-inline-end:8px;font-size:1rem}
.fb{text-align:center;font-weight:800;min-height:32px;font-size:1.15rem}.fb.ok{color:#13804A}.fb.bad{color:#C0392B}
.end{text-align:center}.end .stars{font-size:3rem;letter-spacing:6px}
.code{font-family:ui-monospace,Menlo,monospace;direction:ltr;text-align:left;word-break:break-all;background:#F6FAFF;border:2px solid var(--line);border-radius:14px;padding:10px;font-size:.85rem;width:100%;min-height:70px}
.note{color:var(--muted);font-size:.92rem}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;z-index:9}
@media (max-width:520px){.big{font-size:2rem}.fall{font-size:1.3rem}.mwrap{gap:30px 44px}.kbd{grid-template-columns:repeat(7,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div>

نَعُوا مَشْرُوعًا عِلْمِيًّا.", "فِي الْبِدَايَةِ لَمْ يَتَحَرَّكِ الرُّوبُوتُ، فَحَزِنَتْ نُورَةُ قَلِيلًا.", "ضَغَطَتْ نُورَةُ عَلَى الزِّرِّ، فَتَحَرَّكَ الرُّوبُوتُ وَأَضَاءَتْ عَيْنَاهُ.", "فِي الصَّبَاحِ الْبَاكِرِ يَكُونُ الشَّاطِئُ هَادِئًا جِدًّا.", "الْمَاءُ أَزْرَقُ صَافٍ، وَالْأَمْوَاجُ الصَّغِيرَةُ تَلْمِسُ الرَّمْلَ بِلُطْفٍ ثُمَّ تَعُودُ.", "تَطِيرُ طُيُورُ النَّوْرَسِ فَوْقَ الْمَاءِ، وَتَقِفُ مَرَاكِبُ الصَّيْدِ بَعِيدًا عَنِ الشَّاطِئِ.", "وَرَائِحَةُ الْبَحْرِ تَمْلَأُ الْهَوَاءَ.", "ذَهَبَ خَالِدٌ مَعَ عَائِلَتِهِ إِلَى الصَّحْرَاءِ فِي عُطْلَةِ نِهَايَةِ الْأُسْبُوعِ.", "نَصَبَ الْأَبُ الْخَيْمَةَ، وَسَاعَدَهُ خَالِدٌ فِي شَدِّ الْحِبَالِ.", "جَلَسَتِ الْعَائِلَةُ حَوْلَ النَّارِ، وَحَكَى الْجَدُّ قِصَّةً عَنْ رِحْلَاتِ الْقَوَافِلِ قَدِيمًا.", "كَانَتِ النُّجُومُ كَثِيرَةً وَلَامِعَةً حَتَّى إِنَّ خَالِدًا لَمْ يَسْتَطِعْ عَدَّهَا.", "وَقَبْلَ أَنْ يَنَامَ الْجَمِيعُ، أَطْفَأَ خَالِدٌ النَّارَ بِالرَّمْلِ كَمَا وَعَدَ أَبَاهُ.", "النَّخْلَةُ شَجَرَةٌ طَوِيلَةٌ تَعِيشُ فِي الْأَمَاكِنِ الْحَارَّةِ، وَتَصْبِرُ عَلَى الْحَرِّ وَالْعَطَشِ.", "يَصْعَدُ الْمُزَارِعُ إِلَى الْقِمَّةِ بِحَبْلٍ قَوِيٍّ لِيَقْطِفَ الْعَنَاقِيدَ.", "لِذَلِكَ يَقُولُونَ: «النَّخْلَةُ أُمُّنَا الثَّانِيَةُ، لِأَنَّهَا تُعْطِينَا كُلَّ شَيْءٍ.»", "فِي حِصَّةِ التَّارِيخِ أَحْضَرَ الْجَدُّ رَاشِدٌ صُنْدُوقًا خَشَبِيًّا قَدِيمًا إِلَى الصَّفِّ.", "فَتَحَهُ أَمَامَ التَّلَامِيذِ، فَرَأَوْا فِيهِ لُؤْلُؤَةً بَيْضَاءَ تَلْمَعُ كَالنَّجْمِ.", "قَالَ الْجَدُّ: «كَانَ أَبِي غَوَّاصًا.", "الطَّائِرَةُ بِدُونِ طَيَّارٍ جِهَازٌ صَغِيرٌ يَطِيرُ بِأَرْبَعِ مَرَاوِحَ.", "يَتَحَكَّمُ فِيهَا الْإِنْسَانُ مِنَ الْأَرْضِ بِجِهَازٍ يُشْبِهُ لُعْبَةَ الْفِيدْيُو.", "تَحْمِلُ الطَّائِرَةُ كَامِيرَا تُصَوِّرُ الْأَرْضَ مِنْ فَوْقُ.", "يَسْتَخْدِمُهَا رِجَالُ الْإِنْقَاذِ لِلْبَحْثِ عَنِ النَّاسِ فِي الصَّحْرَاءِ أَوِ الْبَحْرِ.", "وَفِي الْإِمَارَاتِ تُسْتَخْدَمُ لِتَوْصِيلِ الطُّرُودِ وَزَرْعِ الْأَشْجَارِ.", "كَانَ مَاجِدٌ أَسْرَعَ مِنْهُ.", "اِنْطَلَقَتْ صَافِرَةُ الْحَكَمِ، فَجَرَى الْأَوْلَا ُ قُفَّازًا عَلَى يَدِهِ، ثُمَّ يَقِفُ الصَّقْرُ عَلَيْهِ.", "وَلِذَلِكَ نَرَى صُورَةَ الصَّقْرِ فِي شِعَارِ الدَّوْلَةِ."], ["فِي حِصَّةِ الْعُلُومِ صَنَعَ عُمَرُ وَصَدِيقُهُ خَالِدٌ رُوبُوتًا صَغِيرًا.", "وَضَعَا فِيهِ بَطَّارِيَّةً وَعَجَلَتَيْنِ.", "ضَغَطَ عُمَرُ عَلَى الزِّرِّ، فَتَحَرَّكَ الرُّوبُوتُ إِلَى الْأَمَامِ، ثُمَّ تَوَقَّفَ فَجْأَةً.", "قَالَ خَالِدٌ: «رُبَّمَا السِّلْكُ غَيْرُ مَوْصُولٍ.» أَصْلَحَ عُمَرُ السِّلْكَ، فَمَشَى الرُّوبُوتُ مِنْ جَدِيدٍ.", "فَرِحَ الصَّدِيقَانِ، وَعَرَضَا عَمَلَهُمَا أَمَامَ الصَّفِّ كُلِّهِ."], ["فِي الصَّبَاحِ الْبَاكِرِ يَكُونُ الشَّاطِئُ هَادِئًا.", "الرَّمْلُ نَاعِمٌ وَبَارِدٌ تَحْتَ الْقَدَمَيْنِ.", "تَأْتِي الْمَوْجَةُ الصَّغِيرَةُ، ثُمَّ تَرْجِعُ بِهُدُوءٍ.", "عَلَى الرَّمْلِ صَدَفَاتٌ بَيْضَاءُ وَوَرْدِيَّةٌ، وَالشَّمْسُ تَلْمَعُ عَلَى الْمَاءِ.", "فِي الْبَعِيدِ يَظْهَرُ قَارِبٌ خَشَبِيٌّ، وَفَوْقَهُ طُيُورٌ بَيْضَاءُ تَطِيرُ.", "تَجْلِسُ مَرْيَمُ عَلَى الرَّمْلِ وَتَرْسُمُ الْبَحْرَ وَالْقَارِبَ فِي دَفْتَرِهَا الصَّغِيرِ بِهُدُوءٍ."], ["الطَّائِرَةُ الصَّغِيرَةُ الَّتِي نَرَاهَا فِي الْحَدَائِقِ اسْمُهَا الدُّرُونُ.", "لَهَا أَرْبَعُ مَرَاوِحَ تَدُورُ بِسُرْعَةٍ كَبِيرَةٍ، فَتَرْفَعُهَا فِي الْهَوَاءِ.", "يُحَرِّكُهَا الشَّخْصُ بِجِهَازٍ صَغِيرٍ فِي يَدِهِ.", "فِي أَسْفَلِهَا كَامِيرَا تُصَوِّرُ الْبُيُوتَ وَالشَّوَارِعَ وَالْحَدَائِقَ مِنْ فَوْقُ.", "يَسْتَخْدِمُهَا الْمُزَارِعُ لِيَرَى حَقْلَهُ كُلَّهُ.", "لَكِنْ يَجِبُ أَنْ نَطِيرَ بِهَا فِي مَكَانٍ آمِنٍ وَبَعِيدٍ عَنِ النَّاسِ."], ["فِي يَوْمِ الرِّيَاضَةِ وَقَفَتْ نُورَةُ عَلَى خَطِّ الْبِدَايَةِ.", "كَانَتْ تَتَدَرَّبُ كُلَّ يَوْمٍ فِي الْحَدِيقَةِ.", "صَفَّرَ الْمُعَلِّمُ، فَانْطَلَقَتِ الْبَنَاتُ بِسُرْعَةٍ.", "فِي الْمُنْتَصَفِ تَعَثَّرَتْ صَدِيقَتُهَا هِنْدُ وَوَقَعَتْ عَلَى الْأَرْضِ.", "تَوَقَّفَتْ نُورَةُ، وَمَدَّتْ يَدَهَا إِلَيْهَا.", "قَالَتْ هِنْدُ: «اذْهَبِي، سَتَخْسَرِينَ السِّبَاقَ!» قَالَتْ نُورَةُ: «الصَّدِيقَةُ أَهَمُّ مِنَ الْفَوْزِ.» وَصَلَتِ الْبِنْتَانِ مَعًا فِي النِّهَايَةِ، وَصَفَّقَ لَهُمَا الْجَمِيعُ."], ["فِي الْمَاضِي كَانَ أَهْلُ الْإِمَارَاتِ يَرْكَبُونَ السُّفُنَ الْخَشَبِيَّةَ وَيَذْهَبُونَ إِلَى الْبَحْرِ لِلْبَحْثِ عَنِ اللُّؤْلُؤِ.", "كَانَ الْغَوَّاصُ يَضَعُ مِشْبَكًا عَلَى أَنْفِهِ، وَيَرْبِطُ حَجَرًا فِي رِجْلِهِ لِيَنْزِلَ بِسُرْعَةٍ.", "فِي الْأَسْفَلِ يَجْمَعُ الْمَحَارَ فِي كِيسٍ صَغِيرٍ.", "ثُمَّ يَشُدُّ الْحَبْلَ، فَيَرْفَعُهُ صَدِيقُهُ إِلَى السَّفِينَةِ.", "يَفْتَحُونَ الْمَحَارَ، وَأَحْيَانًا يَجِدُونَ فِيهِ لُؤْلُؤَةً جَمِيلَةً.", "كَانَ هَذَا الْعَمَلُ صَعْبًا، لَكِنَّهُ جُزْءٌ مُهِمٌّ مِنْ تُرَاثِنَا."], ["خَلْفَ مَدْرَسَتِنَا حَدِيقَةٌ صَغِيرَةٌ وَجَمِيلَةٌ.", "فِي وَسَطِهَا نَخْلَةٌ عَالِيَةٌ، وَحَوْلَهَا أَحْوَاضٌ مِنَ الزُّهُورِ الْحَمْرَاءِ وَالصَّفْرَاءِ.", "زَرَعَ طُلَّابُ الصَّفِّ الرَّابِعِ الطَّمَاطِمَ وَالنَّعْنَاعَ فِي الْحَوْضِ الْكَبِيرِ.", "كُلَّ صَبَاحٍ يَسْقِي طَالِبٌ النَّبَاتَاتِ، وَيَكْتُبُ فِي دَفْتَرِ الْحَدِيقَةِ الْأَخْضَرِ مَاذَا رَأَى.", "تَأْتِي الْعَصَافِيرُ لِتَشْرَبَ مِنَ الْإِنَاءِ الصَّغِيرِ.", "وَفِي الظِّلِّ مَقْعَدٌ خَشَبِيٌّ يَجْلِسُ عَلَيْهِ الْمُعَلِّمُ وَيَقْرَأُ قِصَّةً لِلطُّلَّابِ.", "هَذِهِ الْحَدِيقَةُ أَجْمَلُ مَكَانٍ فِي الْمَدْرَسَةِ."], ["فِي الْحَدِيقَةِ وَجَدَ يُوسُفُ هَاتِفًا عَلَى الْمَقْعَدِ الْخَشَبِيِّ.", "نَظَرَ حَوْلَهُ، فَلَمْ يَرَ أَحَدًا قَرِيبًا.", "فَكَّرَ يُوسُفُ قَلِيلًا، ثُمَّ حَمَلَ الْهَاتِفَ بِسُرْعَةٍ إِلَى حَارِسِ الْحَدِيقَةِ.", "قَالَ الْحَارِسُ: «أَحْسَنْتَ، سَنَبْحَثُ عَنْ صَاحِبِهِ.» بَعْدَ قَلِيلٍ جَاءَتِ امْرَأَةٌ تَبْحَثُ عَنْ هَاتِفِهَا.", "فَرِحَتْ كَثِيرًا عِنْدَمَا رَأَتْهُ، وَشَكَرَتْ يُوسُفَ.", "قَالَتْ: «فِيهِ صُوَرُ أَوْلَادِي، وَكُنْتُ حَزِينَةً جِدًّا.» رَجَعَ يُوسُفُ إِلَى الْبَيْتِ وَهُوَ سَعِيدٌ جِدًّا، لِأَنَّهُ فَعَلَ الصَّوَابَ."], ["فِي يَوْمِ الْمُبَارَاةِ وَقَفَ سَالِمٌ أَمَامَ الْمَرْمَى.", "كَانَ قَلْبُهُ يَدُقُّ بِسُرْعَةٍ، لَكِنَّهُ تَنَفَّسَ بِهُدُوءٍ.", "جَاءَتِ الْكُرَةُ قَوِيَّةً نَحْوَ الزَّاوِيَةِ، فَقَفَزَ سَالِمٌ وَأَمْسَكَهَا بِيَدَيْهِ.", "صَاحَ أَصْدِقَاؤُهُ فَرَحًا، وَرَفَعَ الْمُدَرِّبُ يَدَهُ إِعْجَابًا بِهِ.", "بَعْدَ الْمُبَارَاةِ قَالَ سَالِمٌ لِأَبِيهِ: «التَّدْرِيبُ كُلَّ يَوْمٍ جَعَلَنِي أَقْوَى.» اِبْتَسَمَ الْأَبُ وَقَالَ: «الصَّبْرُ يَصْنَعُ الْأَبْطَالَ.» وَفِي الْمَسَاءِ كَتَبَ سَالِمٌ فِي دَفْتَرِهِ: سَأَتَدَرَّبُ غَدًا أَيْضًا."], ["الصَّقْرُ طَائِرٌ قَوِيٌّ يَعِيشُ فِي الصَّحْرَاءِ وَالْجِبَالِ.", "عَيْنَاهُ حَادَّتَانِ جِدًّا، فَهُوَ يَرَى فَرِيسَتَهُ مِنْ مَسَافَةٍ بَعِيدَةٍ.", "يَطِيرُ الصَّقْرُ بِسُرْعَةٍ كَبِيرَةٍ، ثُمَّ يَنْقَضُّ عَلَى هَدَفِهِ فِي لَحْظَةٍ وَاحِدَةٍ.", "فِي الْإِمَارَاتِ يُحِبُّ النَّاسُ الصَّقْرَ لِأَنَّهُ رَمْزٌ لِلْقُوَّةِ وَالشَّجَاعَةِ.", "يُدَرِّبُ الصَّقَّارُ صَقْرَهُ بِصَبْرٍ، وَيُطْعِمُهُ بِيَدِهِ كُلَّ يَوْمٍ حَتَّى يَثِقَ بِهِ.", "وَفِي الْمُسَابَقَاتِ الْكَبِيرَةِ يَطِيرُ الصَّقْرُ عَالِيًا نَحْوَ الطُّعْمِ أَسْرَعَ مِنَ الرِّيحِ."], ["طَلَبَتِ الْمُعَلِّمَةُ مِنَ التَّلَامِيذِ أَنْ يَصْنَعُوا مَشْرُوعًا عِلْمِيًّا.", "اِخْتَارَتْ مَرْيَمُ وَصَدِيقَتُهَا نُورَةُ أَنْ تَبْنِيَا رُوبُوتًا صَغِيرًا مِنْ عُلَبٍ قَدِيمَةٍ وَأَسْلَاكٍ مُلَوَّنَةٍ.", "فِي الْبِدَايَةِ لَمْ يَتَحَرَّكِ الرُّوبُوتُ، فَحَزِنَتْ نُورَةُ قَلِيلًا.", "لَكِنَّ مَرْيَمَ قَالَتْ: «لِنُرَاجِعِ الْأَسْلَاكَ مَرَّةً أُخْرَى.» وَجَدَتَا سِلْكًا غَيْرَ مَوْصُولٍ، فَأَصْلَحَتَاهُ بِسُرْعَةٍ.", "ضَغَطَتْ نُورَةُ عَلَى الزِّرِّ، فَتَحَرَّكَ الرُّوبُوتُ وَأَضَاءَتْ عَيْنَاهُ.", "فِي يَوْمِ الْعَرْضِ صَفَّقَ الْجَمِيعُ لَهُمَا، وَقَالَتِ الْمُعَلِّمَةُ: «الْعَمَلُ الْجَمَاعِيُّ هُوَ سِرُّ النَّجَاحِ.»"], ["فِي الصَّبَاحِ الْبَاكِرِ يَكُونُ الشَّاطِئُ هَادِئًا جِدًّا.", "الْمَاءُ أَزْرَقُ صَافٍ، وَالْأَمْوَاجُ الصَّغِيرَةُ تَلْمِسُ الرَّمْلَ بِلُطْفٍ ثُمَّ تَعُودُ.", "تَطِيرُ طُيُورُ النَّوْرَسِ فَوْقَ الْمَاءِ، وَتَقِفُ مَرَاكِبُ الصَّيْدِ بَعِيدًا عَنِ الشَّاطِئِ.", "وَرَائِحَةُ الْبَحْرِ تَمْلَأُ الْهَوَاءَ.", "تَسِيرُ سَلْطَانَةُ مَعَ جَدِّهَا عَلَى الرَّمْلِ الْبَارِدِ، وَتَجْمَعُ أَصْدَافًا بَيْضَاءَ فِي سَلَّتِهَا.", "يَقُولُ الْجَدُّ: «كُنَّا نَخْرُجُ لِلصَّيْدِ فِي مِثْلِ هَذَا الْوَقْتِ.» تَنْظُرُ سَلْطَانَةُ إِلَى الْبَحْرِ الْوَاسِعِ الْهَادِئِ، وَتَشْعُرُ أَنَّ الصَّبَاحَ هُوَ أَجْمَلُ أَوْقَاتِ الْيَوْمِ."], ["ذَهَبَ خَالِدٌ مَعَ عَائِلَتِهِ إِلَى الصَّحْرَاءِ فِي عُطْلَةِ نِهَايَةِ الْأُسْبُوعِ.", "نَصَبَ الْأَبُ الْخَيْمَةَ، وَسَاعَدَهُ خَالِدٌ فِي شَدِّ الْحِبَالِ.", "قَالَ الْأَبُ: «أَنْتَ مَسْؤُولٌ اللَّيْلَةَ عَنْ إِطْفَاءِ النَّارِ قَبْلَ النَّوْمِ.» شَعَرَ خَالِدٌ بِالْفَخْرِ، لِأَنَّ أَبَاهُ وَثِقَ بِهِ.", "جَلَسَتِ الْعَائِلَةُ حَوْلَ النَّارِ، وَحَكَى الْجَدُّ قِصَّةً عَنْ رِحْلَاتِ الْقَوَافِلِ قَدِيمًا.", "كَانَتِ النُّجُومُ كَثِيرَةً وَلَامِعَةً حَتَّى إِنَّ خَالِدًا لَمْ يَسْتَطِعْ عَدَّهَا.", "وَقَبْلَ أَنْ يَنَامَ الْجَمِيعُ، أَطْفَأَ خَالِدٌ النَّارَ بِالرَّمْلِ كَمَا وَعَدَ أَبَاهُ."], ["النَّخْلَةُ شَجَرَةٌ طَوِيلَةٌ تَعِيشُ فِي الْأَمَاكِنِ الْحَارَّةِ، وَتَصْبِرُ عَلَى الْحَرِّ وَالْعَطَشِ.", "فِي الرَّبِيعِ يُسَاعِدُ الْمُزَارِعُ النَّخْلَةَ عَلَى التَّلْقِيحِ، ثُمَّ تَظْهَرُ عَنَاقِيدُ صَغِيرَةٌ خَضْرَاءُ اللَّوْنِ.", "مَعَ حَرَارَةِ الصَّيْفِ يَتَحَوَّلُ لَوْنُ التَّمْرِ إِلَى الْأَصْفَرِ ثُمَّ إِلَى الْبُنِّيِّ، وَيُصْبِحُ حُلْوًا وَلَذِيذًا.", "يَصْعَدُ الْمُزَارِعُ إِلَى الْقِمَّةِ بِحَبْلٍ قَوِيٍّ لِيَقْطِفَ الْعَنَاقِيدَ.", "كَانَ أَهْلُ الْإِمَارَاتِ قَدِيمًا يَأْكُلُونَ التَّمْرَ فِي كُلِّ يَوْمٍ، وَيَصْنَعُونَ مِنْ سَعَفِ النَّخْلِ السِّلَالَ وَالْحُصُرَ وَالْبُيُوتَ.", "لِذَلِكَ يَقُولُونَ: «النَّخْلَةُ أُمُّنَا الثَّانِيَةُ، لِأَنَّهَا تُعْطِينَا كُلَّ شَيْءٍ.»"], ["فِي حِصَّةِ التَّارِيخِ أَحْضَرَ الْجَدُّ رَاشِدٌ صُنْدُوقًا خَشَبِيًّا قَدِيمًا إِلَى الصَّفِّ.", "فَتَحَهُ أَمَامَ التَّلَامِيذِ، فَرَأَوْا فِيهِ لُؤْلُؤَةً بَيْضَاءَ تَلْمَعُ كَالنَّجْمِ.", "قَالَ الْجَدُّ: «كَانَ أَبِي غَوَّاصًا.", "كَانَ يَنْزِلُ إِلَى قَاعِ الْبَحْرِ بِحَجَرٍ ثَقِيلٍ مَرْبُوطٍ بِقَدَمِهِ، وَيُغْلِقُ أَنْفَهُ بِمِشْبَكٍ صَغِيرٍ، وَيَجْمَعُ الْمَحَارَ بِسُرْعَةٍ قَبْلَ أَنْ يَنْتَهِيَ نَفَسُهُ.» سَأَلَتْ عَائِشَةُ: «وَهَلْ كَانَ الْعَمَلُ صَعْبًا؟» أَجَابَ الْجَدُّ: «صَعْبًا جِدًّا، لَكِنَّ الْغَوَّاصِينَ كَانُوا يُرَدِّدُونَ الْأَهَازِيجَ مَعًا لِيَنْسَوُا التَّعَبَ.» مَرَّرَ الْجَدُّ اللُّؤْلُؤَةَ بَيْنَ التَّلَامِيذِ، فَشَعَرَ كُلُّ وَاحِدٍ أَنَّهُ يَلْمِسُ قِطْعَةً مِنْ تَارِيخِ بِلَادِهِ."], ["الطَّائِرَةُ بِدُونِ طَيَّارٍ جِهَازٌ صَغِيرٌ يَطِيرُ بِأَرْبَعِ مَرَاوِحَ.", "يَتَحَكَّمُ فِيهَا الْإِنْسَانُ مِنَ الْأَرْضِ بِجِهَازٍ يُشْبِهُ لُعْبَةَ الْفِيدْيُو.", "عِنْدَمَا تَدُورُ الْمَرَاوِحُ بِسُرْعَةٍ تَدْفَعُ الْهَوَاءَ إِلَى الْأَسْفَلِ، فَتَرْتَفِعُ الطَّائِرَةُ إِلَى الْأَعْلَى.", "وَإِذَا دَارَتْ مَرَاوِحُ جِهَةٍ وَاحِدَةٍ أَسْرَعَ مِنَ الْأُخْرَى مَالَتِ الطَّائِرَةُ وَتَحَرَّكَتْ إِلَى الْأَمَامِ.", "تَحْمِلُ الطَّائِرَةُ كَامِيرَا تُصَوِّرُ الْأَرْضَ مِنْ فَوْقُ.", "يَسْتَخْدِمُهَا رِجَالُ الْإِنْقَاذِ لِلْبَحْثِ عَنِ النَّاسِ فِي الصَّحْرَاءِ أَوِ الْبَحْرِ.", "وَفِي الْإِمَارَاتِ تُسْتَخْدَمُ لِتَوْصِيلِ الطُّرُودِ وَزَرْعِ الْأَشْجَارِ.", "لَكِنْ يَجِبُ أَنْ نَطِيرَ بِهَا فِي الْأَمَاكِنِ الْمَسْمُوحَةِ، حِفَاظًا عَلَى سَلَامَةِ الْجَمِيعِ."], ["فِي يَوْمِ السِّبَاقِ السَّنَوِيِّ وَقَفَ يُوسُفُ عَلَى خَطِّ الْبِدَايَةِ بِجَانِبِ صَدِيقِهِ مَاجِدٍ.", "كَانَ مَاجِدٌ أَسْرَعَ مِنْهُ.", "اِنْطَلَقَتْ صَافِرَةُ الْحَكَمِ، فَجَرَى الْأَوْلَادُ كَالرِّيحِ.", "فِي مُنْتَصَفِ الطَّرِيقِ تَعَثَّرَ مَاجِدٌ وَسَقَطَ عَلَى الْأَرْضِ.", "نَظَرَ يُوسُفُ إِلَى خَطِّ النِّهَايَةِ، ثُمَّ نَظَرَ إِلَى صَدِيقِهِ.", "تَوَقَّفَ، وَعَادَ إِلَيْهِ، وَمَدَّ لَهُ يَدَهُ.", "قَالَ مَاجِدٌ: «اُرْكُضْ، سَتَخْسَرُ!» أَجَابَ يُوسُفُ: «لَنْ أَتْرُكَكَ وَحْدَكَ.» وَصَلَ الصَّدِيقَانِ مَعًا فِي الْمَرْكَزِ الْأَخِيرِ، لَكِنَّ الْجَمِيعَ صَفَّقُوا لَهُمَا أَكْثَرَ مِنَ الْفَائِزِ.", "وَفِي الْحَفْلِ أَعْطَى الْمُدِيرُ يُوسُفَ مِيدَالِيَّةً خَاصَّةً كُتِبَ عَلَيْهَا: «الصَّدَاقَةُ أَغْلَى مِنَ الْفَوْزِ.»"], ["فِي صَبَاحِ يَوْمِ السَّبْتِ اجْتَمَعَ تَلَامِيذُ الصَّفِّ الرَّابِعِ عَلَى شَاطِئِ الْبَحْرِ، وَمَعَهُمْ أَكْيَاسٌ كَبِيرَةٌ وَقُفَّازَاتٌ.", "كَانَ هَدَفُهُمْ تَنْظِيفَ الشَّاطِئِ الَّذِي امْتَلَأَ بِالْأَوْرَاقِ وَالزُّجَاجَاتِ بَعْدَ الْعُطْلَةِ.", "عَمِلَ الْجَمِيعُ بِنَشَاطٍ، وَكَانَ حَمْدَانُ يَجْرِي مِنْ مَكَانٍ إِلَى آخَرَ كَأَنَّهُ نَحْلَةٌ لَا تَتْعَبُ.", "بَعْدَ سَاعَتَيْنِ صَارَ الرَّمْلُ نَظِيفًا يَلْمَعُ تَحْتَ الشَّمْسِ.", "ثُمَّ رَأَوْا سُلَحْفَاةً بَحْرِيَّةً تَخْرُجُ مِنَ الْمَاءِ وَتَمْشِي بِهُدُوءٍ عَلَى الرَّمْلِ.", "قَالَتِ الْمُعَلِّمَةُ: «لَوْ بَقِيَتِ الزُّجَاجَاتُ هُنَا لَمَا اسْتَطَاعَتِ السُّلَحْفَاةُ أَنْ تَضَعَ بَيْضَهَا.» شَعَرَ حَمْدَانُ أَنَّ تَعَبَهُ كُلَّهُ كَانَ يَسْتَحِقُّ هَذِهِ اللَّحْظَةَ."], ["يُسَمَّى الْجَمَلُ سَفِينَةَ الصَّحْرَاءِ، لِأَنَّهُ يَسِيرُ فَوْقَ الرِّمَالِ كَمَا تَسِيرُ السَّفِينَةُ فَوْقَ الْمَاءِ.", "خَلَقَ اللهُ لِلْجَمَلِ أَقْدَامًا عَرِيضَةً لَا تَغُوصُ فِي الرَّمْلِ، وَرُمُوشًا طَوِيلَةً تَحْمِي عَيْنَيْهِ مِنَ الْغُبَارِ.", "أَمَّا السَّنَامُ الَّذِي فَوْقَ ظَهْرِهِ فَلَا يَحْفَظُ الْمَاءَ، بَلْ يَحْفَظُ الدُّهُونَ الَّتِي يَسْتَخْدِمُهَا الْجِسْمُ عِنْدَمَا يَقِلُّ الطَّعَامُ.", "يَسْتَطِيعُ الْجَمَلُ أَنْ يَشْرَبَ كَمِّيَّةً كَبِيرَةً مِنَ الْمَاءِ فِي دَقَائِقَ قَلِيلَةٍ، ثُمَّ يَسِيرُ أَيَّامًا دُونَ أَنْ يَشْرَبَ.", "كَانَ أَهْلُ الْإِمَارَاتِ قَدِيمًا يَعْتَمِدُونَ عَلَى الْجَمَلِ فِي السَّفَرِ وَنَقْلِ الْبَضَائِعِ، وَمَا زَالُوا إِلَى الْيَوْمِ يُحِبُّونَهُ وَيُقِيمُونَ لَهُ سِبَاقَاتٍ مَشْهُورَةً."], ["تَقِفُ الْقَلْعَةُ الْقَدِيمَةُ عَلَى تَلٍّ صَغِيرٍ تُطِلُّ مِنْهُ عَلَى الْمَدِينَةِ كُلِّهَا.", "جُدْرَانُهَا الْعَالِيَةُ مَبْنِيَّةٌ مِنَ الطِّينِ وَالْحَجَرِ، وَلَوْنُهَا يُشْبِهُ لَوْنَ الرِّمَالِ عِنْدَ غُرُوبِ الشَّمْسِ.", "فِي كُلِّ زَاوِيَةٍ يَرْتَفِعُ بُرْجٌ مُسْتَدِيرٌ لَهُ نَوَافِذُ ضَيِّقَةٌ كَانَ الْحُرَّاسُ يَنْظُرُونَ مِنْهَا إِلَى الْبَعِيدِ.", "عِنْدَمَا تَدْخُلُ مِنَ الْبَابِ الْخَشَبِيِّ الضَّخْمِ تَجِدُ سَاحَةً وَاسِعَةً فِي وَسَطِهَا بِئْرٌ قَدِيمَةٌ وَنَخْلَةٌ وَحِيدَةٌ تُلْقِي ظِلَّهَا عَلَى الْأَرْضِ.", "الْهَوَاءُ فِي الدَّاخِلِ بَارِدٌ لِأَنَّ الْجُدْرَانَ السَّمِيكَةَ تَمْنَعُ الْحَرَارَةَ.", "وَفِي الْغُرَفِ الصَّغِيرَةِ تُعْرَضُ أَدَوَاتٌ قَدِيمَةٌ وَصُوَرٌ لِلْمَدِينَةِ قَبْلَ مِئَةِ عَامٍ.", "كُلُّ حَجَرٍ هُنَا يَحْكِي قِصَّةً لِمَنْ يُحْسِنُ الْإِصْغَاءَ."], ["مُنْذُ أَنْ أَهْدَاهَا أَبُوهَا مِنْظَارًا فَلَكِيًّا صَارَتْ شَمَّةُ تَقْضِي كُلَّ مَسَاءٍ عَلَى سَطْحِ الْبَيْتِ.", "كَانَتْ تُوَجِّهُ الْمِنْظَارَ نَحْوَ الْقَمَرِ فَتَرَى الْحُفَرَ عَلَى سَطْحِهِ كَأَنَّهَا نُقُوشٌ عَلَى صَحْنٍ فِضِّيٍّ.", "وَفِي لَيْلَةٍ صَافِيَةٍ رَأَتْ نُقْطَةً حَمْرَاءَ تَلْمَعُ بَيْنَ النُّجُومِ.", "رَكَضَتْ إِلَى أَبِيهَا وَقَالَتْ: «هُنَاكَ نَجْمٌ أَحْمَرُ لَا يَرْمِشُ!» نَظَرَ الْأَبُ فِي الْمِنْظَارِ ثُمَّ قَالَ: «هَذَا لَيْسَ نَجْمًا يَا شَمَّةُ، إِنَّهُ كَوْكَبُ الْمِرِّيخِ، الْكَوْكَبُ الَّذِي أَرْسَلَتْ إِلَيْهِ بِلَادُنَا مِسْبَارَ الْأَمَلِ.» فِي تِلْكَ اللَّيْلَةِ لَمْ تَنَمْ مُبَكِّرًا، بَلْ جَلَسَتْ تَكْتُبُ فِي دَفْتَرِهَا كُلَّ مَا عَرَفَتْهُ عَنِ الْكَوْكَبِ الْأَحْمَرِ، وَقَرَّرَتْ أَنْ تُصْبِحَ يَوْمًا عَالِمَةَ فَضَاءٍ."], ["مِنْ أَيْنَ يَأْتِي الْمَاءُ الَّذِي نَشْرَبُهُ فِي الْإِمَارَاتِ؟", "مُعْظَمُهُ يَأْتِي مِنَ الْبَحْرِ!", "لَكِنَّ مَاءَ الْبَحْرِ مَالِحٌ وَلَا يَصْلُحُ لِلشُّرْبِ، لِذَلِكَ بَنَتِ الدَّوْلَةُ مَحَطَّاتٍ كَبِيرَةً لِتَحْلِيَةِ الْمِيَاهِ.", "فِي الْمَحَطَّةِ يُسَخَّنُ مَاءُ الْبَحْرِ حَتَّى يَتَحَوَّلَ إِلَى بُخَارٍ، وَيَبْقَى الْمِلْحُ فِي الْأَسْفَلِ.", "ثُمَّ يُبَرَّدُ الْبُخَارُ فَيَعُودُ مَاءً نَقِيًّا.", "وَفِي مَحَطَّاتٍ أُخْرَى يُدْفَعُ الْمَاءُ بِقُوَّةٍ عَبْرَ أَغْشِيَةٍ رَقِيقَةٍ تَسْمَحُ لِلْمَاءِ بِالْمُرُورِ وَتَمْنَعُ الْمِلْحَ.", "تَحْتَاجُ هَذِهِ الْعَمَلِيَّةُ إِلَى طَاقَةٍ كَبِيرَةٍ، وَلِهَذَا يَجِبُ عَلَيْنَا أَلَّا نُسْرِفَ فِي اسْتِخْدَامِ الْمَاءِ.", "فَإِذَا أَغْلَقْتَ الصُّنْبُورَ وَأَنْتَ تُنَظِّفُ أَسْنَانَكَ، فَأَنْتَ تُسَاعِدُ بِلَادَكَ عَلَى حِفْظِ كُلِّ قَطْرَةٍ جَاءَتْ مِنَ الْبَحْرِ بَعْدَ رِحْلَةٍ طَوِيلَةٍ."], ["عِنْدَمَا انْتَقَلَ سَعِيدٌ إِلَى الْمَدْرَسَةِ الْجَدِيدَةِ كَانَ يَجْلِسُ وَحْدَهُ فِي الْفُسْحَةِ وَلَا يَجْرُؤُ عَلَى الِاقْتِرَابِ مِنْ أَحَدٍ.", "لَاحَظَ ذَلِكَ زَمِيلُهُ طَارِقٌ، الَّذِي كَانَ قَائِدَ فَرِيقِ كُرَةِ الْقَدَمِ.", "فِي الْيَوْمِ التَّالِي اقْتَرَبَ طَارِقٌ مِنْهُ وَقَالَ: «يَنْقُصُنَا لَاعِبٌ فِي الْفَرِيقِ، هَلْ تُجِيدُ اللَّعِبَ؟» أَجَابَ سَعِيدٌ بِصَوْتٍ خَافِتٍ: «لَسْتُ مَاهِرًا كَثِيرًا.» قَالَ طَارِقٌ: «الْمُهِمُّ أَنْ تَلْعَبَ مَعَنَا.» فِي الْبِدَايَةِ أَخْطَأَ سَعِيدٌ مَرَّاتٍ عَدِيدَةً، لَكِنَّ الْجَمِيعَ شَجَّعَهُ.", "وَمَعَ مُرُورِ الْأَيَّامِ صَارَتْ تَمْرِيرَاتُهُ أَدَقَّ.", "وَفِي آخِرِ مُبَارَاةٍ لِلْفَصْلِ سَجَّلَ سَعِيدٌ الْهَدَفَ الْأَوَّلَ، فَحَمَلَهُ أَصْدِقَاؤُهُ عَلَى الْأَكْتَافِ.", "وَقَالَ لِأُمِّهِ مَسَاءً: «لَمْ أَعُدْ غَرِيبًا يَا أُمِّي، صَارَتِ الْمَدْرَسَةُ بَيْتِي الثَّانِيَ.»"], ["الْمَهَا الْعَرَبِيُّ حَيَوَانٌ جَمِيلٌ يَعِيشُ فِي صَحْرَاءِ الْجَزِيرَةِ الْعَرَبِيَّةِ.", "لَوْنُهُ أَبْيَضُ نَاصِعٌ يَعْكِسُ أَشِعَّةَ الشَّمْسِ، وَلَهُ قَرْنَانِ طَوِيلَانِ مُسْتَقِيمَانِ يَبْدُوَانِ مِنْ بَعِيدٍ كَقَرْنٍ وَاحِدٍ.", "يَسْتَطِيعُ الْمَهَا أَنْ يَعِيشَ أَسَابِيعَ طَوِيلَةً دُونَ شُرْبٍ، لِأَنَّهُ يَحْصُلُ عَلَى الْمَاءِ مِنَ النَّبَاتَاتِ الَّتِي يَأْكُلُهَا وَمِنْ قَطَرَاتِ النَّدَى فِي الصَّبَاحِ.", "قَبْلَ سَنَوَاتٍ كَثِيرَةٍ كَادَ الْمَهَا أَنْ يَخْتَفِيَ مِنَ الصَّحْرَاءِ، فَقَرَّرَتِ الْإِمَارَاتُ حِمَايَتَهُ.", "أَنْشَأَتْ مَحْمِيَّاتٍ وَاسِعَةً لَا يُسْمَحُ فِيهَا بِالصَّيْدِ، وَاعْتَنَى الْعُلَمَاءُ بِالصِّغَارِ حَتَّى كَبِرَتْ وَتَكَاثَرَتْ.", "وَالْيَوْمَ تَعِيشُ قُطْعَانٌ كَبِيرَةٌ مِنَ الْمَهَا فِي مَحْمِيَّاتِ الدَّوْلَةِ، وَيَأْتِي الزُّوَّارُ مِنْ كُلِّ مَكَانٍ لِيَرَوْهَا تَجْرِي بِحُرِّيَّةٍ بَيْنَ الْكُثْبَانِ الذَّهَبِيَّةِ.", "إِنَّ حِمَايَةَ الْحَيَوَانَاتِ مَسْؤُولِيَّةُ كُلِّ إِنْسَانٍ."], ["كُلَّ عَامٍ يُقَامُ سِبَاقٌ لِلسُّفُنِ الشِّرَاعِيَّةِ قُرْبَ شَاطِئِ مَدِينَتِنَا، وَكَانَ جَدِّي يَشْتَرِكُ فِيهِ مُنْذُ شَبَابِهِ.", "هَذِهِ السَّنَةَ قَالَ لِي: «سَتَكُونُ مُسَاعِدِي عَلَى السَّفِينَةِ.» وَبَدَأْتُ أَتَدَرَّبُ مَعَهُ عَلَى رَبْطِ الْحِبَالِ وَرَفْعِ الشِّرَاعِ الْكَبِيرِ.", "فِي يَوْمِ السِّبَاقِ كَانَتِ الرِّيحُ قَوِيَّةً وَالْأَمْوَاجُ تَرْقُصُ حَوْلَنَا.", "اِنْطَلَقَتِ السُّفُنُ مَعًا، وَتَقَدَّمَتْ سَفِينَتُنَا حَتَّى صَارَتْ فِي الْمُقَدِّمَةِ.", "فَجْأَةً انْفَكَّ أَحَدُ الْحِبَالِ وَبَدَأَ الشِّرَاعُ يَرْتَخِي.", "صَاحَ جَدِّي: «إِذَا لَمْ نَشُدَّ الْحَبْلَ الْآنَ فَسَنَخْسَرُ السِّبَاقَ!» أَمْسَكْتُ الْحَبْلَ بِكِلْتَا يَدَيَّ وَشَدَدْتُهُ بِكُلِّ قُوَّتِي، فَانْتَفَخَ الشِّرَاعُ مِنْ جَدِيدٍ وَطَارَتِ السَّفِينَةُ فَوْقَ الْمَاءِ.", "وَصَلْنَا ثَانِيًا، لَكِنَّ جَدِّي ضَحِكَ وَقَالَ: «الْيَوْمَ فُزْتُ بِمَا هُوَ أَغْلَى مِنَ الْكَأْسِ: بَحَّارٌ صَغِيرٌ يَحْمِلُ اسْمِي.»"], ["فِي مُسَابَقَةِ الْعُلُومِ طَلَبَتِ الْمُعَلِّمَةُ مِنْ كُلِّ فَرِيقٍ أَنْ يُصَمِّمَ مَدِينَةَ الْمُسْتَقْبَلِ.", "جَلَسَتْ لَطِيفَةُ مَعَ زَمِيلَيْهَا حَوْلَ طَاوِلَةٍ كَبِيرَةٍ.", "قَالَ مُحَمَّدٌ: «لِنَبْنِ أَبْرَاجًا عَالِيَةً تَلْمِسُ السَّحَابَ!» لَكِنَّ لَطِيفَةَ هَزَّتْ رَأْسَهَا وَقَالَتْ: «الْمَدِينَةُ الذَّكِيَّةُ لَيْسَتْ هِيَ الْأَعْلَى، بَلْ هِيَ الَّتِي تَحْتَرِمُ الطَّبِيعَةَ.» اقْتَرَحَتْ أَنْ يَضَعُوا أَلْوَاحًا شَمْسِيَّةً فَوْقَ الْبُيُوتِ، وَأَنْ تَسِيرَ الْحَافِلَاتُ بِالْكَهْرَبَاءِ، وَأَنْ تَمْتَلِئَ الشَّوَارِعُ بِالْأَشْجَارِ الَّتِي تُنَقِّي الْهَوَاءَ.", "عَمِلَ الْفَرِيقُ ثَلَاثَةَ أَيَّامٍ دُونَ أَنْ يَشْعُرَ بِالتَّعَبِ، وَصَنَعَ مُجَسَّمًا صَغِيرًا جَمِيلًا.", "فِي يَوْمِ الْعَرْضِ وَقَفَتْ لَطِيفَةُ أَمَامَ الْحُكَّامِ وَقَالَتْ: «إِذَا اهْتَمَمْنَا بِالْأَرْضِ الْيَوْمَ فَسَتَهْتَمُّ بِنَا غَدًا.» فَازَ الْفَرِيقُ بِالْمَرْكَزِ الْأَوَّلِ، وَالْأَجْمَلُ أَنَّ الْمَدْرَسَةَ قَرَّرَتْ أَنْ تَضَعَ أَلْوَاحًا شَمْسِيَّةً فَوْقَ سَطْحِهَا."], ["فِي يَوْمِ الْجُمُعَةِ ذَهَبَ عَلِيٌّ إِلَى الْمَلْعَبِ مَعَ أَبِيهِ.", "كَانَ الْمَلْعَبُ كَبِيرًا وَالْمَقَاعِدُ مَلِيئَةً بِالنَّاسِ.", "لَعِبَ عَلِيٌّ مَعَ فَرِيقِهِ وَجَرَى كَثِيرًا.", "فِي النِّصْفِ الثَّانِي مَرَّرَ لَهُ صَدِيقُهُ الْكُرَةَ، فَسَجَّلَ هَدَفًا جَمِيلًا.", "صَفَّقَ الْأَبُ بِقُوَّةٍ وَقَالَ: «أَنْتَ بَطَلٌ يَا عَلِيُّ!» عَادَ عَلِيٌّ إِلَى الْبَيْتِ وَهُوَ سَعِيدٌ جِدًّا."], ["الطَّائِرَةُ بِلَا طَيَّارٍ جِهَازٌ صَغِيرٌ يَطِيرُ فِي السَّمَاءِ.", "يُحَرِّكُهَا الْإِنْسَانُ مِنَ الْأَرْضِ بِجِهَازِ تَحَكُّمٍ.", "فِيهَا كَامِيرَا تُصَوِّرُ الْأَمَاكِنَ مِنْ فَوْقُ.", "يَسْتَخْدِمُهَا الْمُزَارِعُ لِيَرَى حَقْلَهُ، وَيَسْتَخْدِمُهَا رِجَالُ الْإِنْقَاذِ لِلْبَحْثِ عَنِ النَّاسِ فِي الصَّحْرَاءِ.", "لَكِنْ يَجِبُ أَنْ نَطِيرَ بِهَا فِي الْأَمَاكِنِ الْمَسْمُوحَةِ فَقَطْ، بَعِيدًا عَنِ الْمَطَارِ، وَنُحَافِظَ عَلَيْهَا حَتَّى لَا تَسْقُطَ."], ["فِي الصَّبَاحِ الْبَاكِرِ يَكُونُ الْمِينَاءُ هَادِئًا.", "تَقِفُ الْقَوَارِبُ الْخَشَبِيَّةُ بِجَانِبِ بَعْضِهَا، وَتَتَحَرَّكُ قَلِيلًا مَعَ الْمَوْجِ.", "يَجْلِسُ الصَّيَّادُونَ عَلَى الرَّصِيفِ وَيُصْلِحُونَ شِبَاكَهُمْ.", "تَطِيرُ طُيُورُ النَّوْرَسِ فَوْقَ الْمَاءِ وَتَبْحَثُ عَنِ السَّمَكِ.", "رَائِحَةُ الْبَحْرِ قَوِيَّةٌ، وَالْهَوَاءُ بَارِدٌ وَمُنْعِشٌ.", "عِنْدَمَا تَرْتَفِعُ الشَّمْسُ تَبْدَأُ الْقَوَارِبُ رِحْلَتَهَا إِلَى الْبَحْرِ الْوَاسِعِ، وَيَعُودُ الصَّيَّادُونَ فِي الْمَسَاءِ وَمَعَهُمْ سَمَكٌ كَثِيرٌ."], ["نَسِيَ سُلْطَانُ كِتَابَ الْعُلُومِ فِي الْبَيْتِ.", "فِي الصَّفِّ سَأَلَتِ الْمُعَلِّمَةُ: «أَيْنَ كِتَابُكَ يَا سُلْطَانُ؟» شَعَرَ سُلْطَانُ بِالْخَجَلِ وَقَالَ الْحَقِيقَةَ.", "قَالَتِ الْمُعَلِّمَةُ: «شُكْرًا لِأَنَّكَ صَادِقٌ، لَكِنْ يَجِبُ أَنْ تُحَضِّرَ حَقِيبَتَكَ فِي اللَّيْلِ.» فِي الْمَسَاءِ كَتَبَ سُلْطَانُ قَائِمَةً بِكُلِّ مَا يَحْتَاجُهُ، وَوَضَعَهَا عَلَى بَابِ غُرْفَتِهِ.", "مُنْذُ ذَلِكَ الْيَوْمِ لَمْ يَنْسَ سُلْطَانُ شَيْئًا، وَفَرِحَتِ الْمُعَلِّمَةُ بِهِ."], ["فِي اللَّيْلِ نَرَى نُجُومًا كَثِيرَةً فِي السَّمَاءِ.", "النَّجْمُ كُرَةٌ ضَخْمَةٌ مِنَ الْغَازَاتِ الْمُلْتَهِبَةِ، وَهُوَ يُضِيءُ بِنَفْسِهِ.", "الشَّمْسُ نَجْمٌ قَرِيبٌ مِنَّا، لِذَلِكَ نَرَاهَا كَبِيرَةً وَسَاطِعَةً.", "أَمَّا الْكَوْكَبُ فَلَا يُضِيءُ بِنَفْسِهِ، بَلْ يَدُورُ حَوْلَ النَّجْمِ وَيَعْكِسُ ضَوْءَهُ.", "الْأَرْضُ كَوْكَبٌ يَدُورُ حَوْلَ الشَّمْسِ، وَالْقَمَرُ يَدُورُ حَوْلَ الْأَرْضِ.", "فِي الْإِمَارَاتِ يُحِبُّ النَّاسُ النَّظَرَ إِلَى النُّجُومِ فِي الصَّحْرَاءِ حَيْثُ السَّمَاءُ صَافِيَةٌ."], ["يَذْهَبُ مَنْصُورٌ كُلَّ جُمُعَةٍ مَعَ جَدِّهِ إِلَى الصَّحْرَاءِ.", "يَحْمِلُ الْجَدُّ صَقْرَهُ عَلَى يَدِهِ، وَيُعَلِّمُ مَنْصُورًا كَيْفَ يَعْتَنِي بِهِ.", "قَالَ الْجَدُّ: «الصَّقْرُ يُحِبُّ الْهُدُوءَ، فَلَا تَرْفَعْ صَوْتَكَ قُرْبَهُ.» أَعْطَى الْجَدُّ مَنْصُورًا الْقُفَّازَ، فَلَبِسَهُ وَوَقَفَ ثَابِتًا.", "طَارَ الصَّقْرُ بَعِيدًا، ثُمَّ عَادَ وَحَطَّ عَلَى يَدِ مَنْصُورٍ.", "خَفَقَ قَلْبُ مَنْصُورٍ مِنَ الْفَرَحِ، وَقَالَ: «سَأَكُونُ صَقَّارًا مِثْلَكَ يَا جَدِّي.» ابْتَسَمَ الْجَدُّ."], ["تَعِيشُ السُّلَحْفَاةُ الْبَحْرِيَّةُ فِي مِيَاهِ الْخَلِيجِ.", "لَهَا دِرْعٌ صُلْبٌ يَحْمِي جِسْمَهَا، وَأَرْجُلٌ تُشْبِهُ الْمَجَادِيفَ تُسَاعِدُهَا عَلَى السِّبَاحَةِ.", "تَأْكُلُ السُّلَحْفَاةُ الْأَعْشَابَ الْبَحْرِيَّةَ وَقَنَادِيلَ الْبَحْرِ.", "فِي اللَّيْلِ تَخْرُجُ الْأُمُّ إِلَى الشَّاطِئِ وَتَحْفِرُ حُفْرَةً فِي الرَّمْلِ، ثُمَّ تَضَعُ فِيهَا بَيْضَهَا وَتَعُودُ إِلَى الْبَحْرِ.", "بَعْدَ أَسَابِيعَ تَخْرُجُ الصِّغَارُ مِنَ الْبَيْضِ وَتَزْحَفُ نَحْوَ الْمَاءِ.", "فِي الْإِمَارَاتِ يُحَافِظُ النَّاسُ عَلَى الشَّوَاطِئِ حَتَّى تَبْقَى السَّلَاحِفُ آمِنَةً وَتَعُودَ كُلَّ عَامٍ."], ["تُحِبُّ شَمَّةُ السِّبَاحَةَ مُنْذُ كَانَتْ صَغِيرَةً.", "تَتَدَرَّبُ فِي الْمَسْبَحِ ثَلَاثَ مَرَّاتٍ فِي الْأُسْبُوعِ، وَتَسْتَيْقِظُ مُبَكِّرًا قَبْلَ الْمَدْرَسَةِ.", "فِي الْبِدَايَةِ كَانَتْ تَتْعَبُ بِسُرْعَةٍ، لَكِنَّهَا لَمْ تَتْرُكِ التَّدْرِيبَ.", "قَالَتْ لَهَا الْمُدَرِّبَةُ: «الصَّبْرُ هُوَ سِرُّ النَّجَاحِ.» جَاءَ يَوْمُ الْبُطُولَةِ، وَوَقَفَتْ شَمَّةُ عَلَى الْمِنَصَّةِ وَقَلْبُهَا يَدُقُّ.", "انْطَلَقَتْ فِي الْمَاءِ كَالسَّهْمِ، وَوَصَلَتْ فِي الْمَرْكَزِ الثَّانِي.", "لَمْ تَحْزَنْ شَمَّةُ، بَلْ قَالَتْ: «فِي الْمَرَّةِ الْقَادِمَةِ سَأَكُونُ الْأُولَى.» ابْتَسَمَتِ الْمُدَرِّبَةُ بِفَخْرٍ."], ["فِي مُبَارَاةِ الْمَدْرَسَةِ وَقَفَ رَاشِدٌ فِي مَرْمَى فَرِيقِهِ.", "كَانَ الْفَرِيقُ الْآخَرُ قَوِيًّا، لَكِنَّ رَاشِدًا لَمْ يَخَفْ.", "رَكَّزَ عَيْنَيْهِ عَلَى الْكُرَةِ، وَقَفَزَ يَمِينًا وَيَسَارًا، وَصَدَّ ثَلَاثَ كُرَاتٍ صَعْبَةٍ.", "فِي نِهَايَةِ الْمُبَارَاةِ فَازَ فَرِيقُهُ بِهَدَفٍ وَاحِدٍ.", "حَمَلَهُ زُمَلَاؤُهُ عَلَى أَكْتَافِهِمْ، وَقَالَ الْمُدَرِّبُ: الْحَارِسُ الْجَيِّدُ لَا يَحْتَاجُ إِلَى أَنْ يُسَجِّلَ، لِأَنَّهُ يَحْمِي الْفَرِيقَ كُلَّهُ.", "ابْتَسَمَ رَاشِدٌ وَشَكَرَ مُدَرِّبَهُ، ثُمَّ عَادَ إِلَى بَيْتِهِ سَعِيدًا."], ["الصَّقْرُ طَائِرٌ قَوِيٌّ يَعِيشُ فِي صَحْرَاءِ الْإِمَارَاتِ.", "لَهُ جَنَاحَانِ طَوِيلَانِ وَعَيْنَانِ حَادَّتَانِ، تَرَيَانِ الطَّائِرَ الصَّغِيرَ مِنْ مَكَانٍ بَعِيدٍ.", "عِنْدَمَا يُرِيدُ الصَّقْرُ أَنْ يَطِيرَ، يَفْرِدُ جَنَاحَيْهِ وَيَدْفَعُ الْهَوَاءَ إِلَى الْأَسْفَلِ، فَيَرْتَفِعُ جِسْمُهُ إِلَى الْأَعْلَى.", "ثُمَّ يَنْزَلِقُ فِي السَّمَاءِ دُونَ أَنْ يُحَرِّكَ جَنَاحَيْهِ، لِأَنَّ الْهَوَاءَ السَّاخِنَ يَرْفَعُهُ مِثْلَ الطَّائِرَةِ الْوَرَقِيَّةِ.", "وَكَانَ أَجْدَادُنَا يُدَرِّبُونَ الصُّقُورَ عَلَى الصَّيْدِ، وَمَا زَالَتِ الصُّقُورُ الْيَوْمَ رَمْزًا لِلْقُوَّةِ وَالْفَخْرِ فِي بِلَادِنَا."], ["فِي الصَّبَاحِ الْبَاكِرِ يَمْتَلِئُ سُوقُ السَّمَكِ بِالْحَرَكَةِ وَالْأَصْوَاتِ.", "تَصْطَفُّ الْأَسْمَاكُ الْفِضِّيَّةُ عَلَى الثَّلْجِ الْأَبْيَضِ، وَتَلْمَعُ تَحْتَ الضَّوْءِ كَأَنَّهَا قِطَعٌ مِنَ الْمَعْدِنِ.", "يُنَادِي الْبَائِعُونَ بِصَوْتٍ عَالٍ، وَيَسْأَلُ الزُّبَائِنُ عَنِ الْأَسْعَارِ.", "فِي رُكْنٍ قَرِيبٍ يَجْلِسُ رَجُلٌ كَبِيرٌ فِي السِّنِّ يُصْلِحُ شَبَكَةَ صَيْدٍ بِخُيُوطٍ زَرْقَاءَ.", "رَائِحَةُ الْبَحْرِ تَمْلَأُ الْمَكَانَ، وَصَوْتُ الْأَمْوَاجِ يَأْتِي مِنْ خَلْفِ الْجِدَارِ.", "مَنْ يَزُرِ السُّوقَ مَرَّةً وَاحِدَةً، يَفْهَمْ لِمَاذَا أَحَبَّ أَجْدَادُنَا الْبَحْرَ وَالصَّيْدَ مُنْذُ زَمَنٍ بَعِيدٍ."], ["فِي حِصَّةِ الْعُلُومِ صَنَعَتْ مَيْثَاءُ وَزَمِيلُهَا خَالِدٌ رُوبُوتًا صَغِيرًا مِنَ الْعُلَبِ الْفَارِغَةِ وَبَطَّارِيَّةٍ وَمُحَرِّكٍ صَغِيرٍ.", "فِي الْمَرَّةِ الْأُولَى لَمْ يَتَحَرَّكِ الرُّوبُوتُ أَبَدًا.", "فَحَصَتْ مَيْثَاءُ الْأَسْلَاكَ بِهُدُوءٍ وَوَجَدَتْ سِلْكًا غَيْرَ مَوْصُولٍ.", "وَصَلَتْهُ بِحَذَرٍ، فَتَحَرَّكَ الرُّوبُوتُ إِلَى الْأَمَامِ وَأَضَاءَتْ عَيْنَاهُ بِاللَّوْنِ الْأَخْضَرِ.", "صَفَّقَ الطُّلَّابُ جَمِيعًا بِحَرَارَةٍ، وَقَالَ الْمُعَلِّمُ: الْخَطَأُ الْأَوَّلُ لَيْسَ فَشَلًا، بَلْ هُوَ خُطْوَةٌ نَحْوَ النَّجَاحِ.", "كَتَبَ خَالِدٌ هَذِهِ الْجُمْلَةَ فِي أَوَّلِ صَفْحَةٍ مِنْ دَفْتَرِهِ حَتَّى لَا يَنْسَاهَا أَبَدًا."], ["تَبْدَأُ رِحْلَةُ التَّمْرِ مِنْ نَخْلَةٍ طَوِيلَةٍ فِي مَزْرَعَةٍ خَضْرَاءَ.", "فِي الرَّبِيعِ تَظْهَرُ عَلَى النَّخْلَةِ أَزْهَارٌ صَغِيرَةٌ، ثُمَّ تَتَحَوَّلُ إِلَى حَبَّاتٍ خَضْرَاءَ صَلْبَةٍ.", "مَعَ حَرَارَةِ الصَّيْفِ تَكْبُرُ الْحَبَّاتُ وَيَصِيرُ لَوْنُهَا أَصْفَرَ، ثُمَّ تَلِينُ وَتَصِيرُ بُنِّيَّةً، وَتُسَمَّى عِنْدَهَا رُطَبًا.", "يَتَسَلَّقُ الْمُزَارِعُ النَّخْلَةَ وَيَقْطِفُ الْعُذُوقَ بِعِنَايَةٍ، ثُمَّ يُجَفِّفُ التَّمْرَ تَحْتَ الشَّمْسِ وَيَضَعُهُ فِي صَنَادِيقَ نَظِيفَةٍ.", "وَهَكَذَا يَصِلُ التَّمْرُ إِلَى بُيُوتِنَا، غِذَاءً حُلْوًا مُفِيدًا أَحَبَّهُ أَهْلُ الْإِمَارَاتِ مُنْذُ زَمَنٍ بَعِيدٍ، وَمَا زَالُوا يُقَدِّمُونَهُ لِلضُّيُوفِ مَعَ الْقَهْوَةِ الْعَرَبِيَّةِ."], ["سَأَلَتِ الْمُعَلِّمَةُ طُلَّابَهَا: مَاذَا تُرِيدُونَ أَنْ تُصْبِحُوا فِي الْمُسْتَقْبَلِ؟", "رَفَعَ سَيْفٌ يَدَهُ بِسُرْعَةٍ وَقَالَ: أُرِيدُ أَنْ أَكُونَ مُهَنْدِسًا أَبْنِي الْجُسُورَ الطَّوِيلَةَ فَوْقَ الْبَحْرِ.", "قَالَتْ شَمَّةُ: وَأَنَا سَأَكُونُ طَبِيبَةً أُعَالِجُ الْأَطْفَالَ الْمَرْضَى حَتَّى يَعُودُوا إِلَى اللَّعِبِ.", "ضَحِكَ عُمَرُ وَقَالَ بِحَمَاسٍ: أَمَّا أَنَا فَسَأُصْبِحُ رَائِدَ فَضَاءٍ، وَسَأُرْسِلُ لَكُمْ صُورَةً مِنَ الْقَمَرِ!", "سَأَلَتِ الْمُعَلِّمَةُ: وَمَا الَّذِي تَحْتَاجُونَ إِلَيْهِ لِتَصِلُوا إِلَى أَحْلَامِكُمْ؟", "أَجَابَ الْجَمِيعُ بِصَوْتٍ وَاحِدٍ: الدِّرَاسَةُ وَالصَّبْرُ!", "ابْتَسَمَتِ الْمُعَلِّمَةُ وَقَالَتْ: وَأَنَا أَثِقُ بِكُمْ جَمِيعًا، فَابْدَؤُوا مِنَ الْيَوْمِ."], ["قَبْلَ عُطْلَةِ الرَّبِيعِ طَلَبَ الْمُعَلِّمُ مُتَطَوِّعًا لِيَعْتَنِيَ بِحَوْضِ أَسْمَاكِ الصَّفِّ.", "رَفَعَتْ نُورَةُ يَدَهَا بِسُرْعَةٍ، وَحَمَلَتِ الْحَوْضَ إِلَى بَيْتِهَا بِمُسَاعَدَةِ أَبِيهَا.", "كُلَّ صَبَاحٍ كَانَتْ تُطْعِمُ الْأَسْمَاكَ قَلِيلًا، وَكُلَّ ثَلَاثَةِ أَيَّامٍ تُغَيِّرُ جُزْءًا مِنَ الْمَاءِ.", "فِي أَحَدِ الْأَيَّامِ لَاحَظَتْ أَنَّ سَمَكَةً صَفْرَاءَ لَا تَتَحَرَّكُ كَثِيرًا.", "قَرَأَتْ فِي كِتَابٍ أَنَّ الْمَاءَ الْبَارِدَ يُتْعِبُ الْأَسْمَاكَ، فَنَقَلَتِ الْحَوْضَ إِلَى مَكَانٍ دَافِئٍ.", "بَعْدَ يَوْمَيْنِ عَادَتِ السَّمَكَةُ تَسْبَحُ بِنَشَاطٍ.", "عِنْدَمَا عَادَتِ الدِّرَاسَةُ قَالَ الْمُعَلِّمُ: الْمَسْؤُولِيَّةُ لَيْسَتْ كَلِمَةً نَقُولُهَا، بَلْ عَمَلٌ نَقُومُ بِهِ كُلَّ يَوْمٍ."], ["بَعْدَ لَيْلَةٍ مِنَ الْمَطَرِ تَتَغَيَّرُ الصَّحْرَاءُ تَمَامًا.", "يَصِيرُ الرَّمْلُ دَاكِنًا وَبَارِدًا، وَتَظْهَرُ بُقَعٌ خَضْرَاءُ صَغِيرَةٌ بَيْنَ الْكُثْبَانِ.", "تَخْرُجُ الْخَنَافِسُ الصَّغِيرَةُ مِنْ جُحُورِهَا، وَتَرْكُضُ السَّحَالِي عَلَى الرَّمْلِ الرَّطْبِ بَحْثًا عَنِ الطَّعَامِ.", "فِي الْأُفُقِ تَقِفُ الْجِمَالُ هَادِئَةً، وَتَمْضَغُ أَوْرَاقَ شُجَيْرَةٍ خَضْرَاءَ كَأَنَّهَا تَحْتَفِلُ بِالْمَطَرِ.", "الْهَوَاءُ نَقِيٌّ وَبَارِدٌ، وَرَائِحَةُ التُّرَابِ الْمُبَلَّلِ تَمْلَأُ الصَّدْرَ بِالرَّاحَةِ.", "وَعِنْدَ الْغُرُوبِ تَصِيرُ السَّمَاءُ بُرْتُقَالِيَّةً، وَتَطُولُ ظِلَالُ النَّخِيلِ الْعَالِيَةِ عَلَى الرَّمْلِ الْأَحْمَرِ.", "فِي مِثْلِ هَذِهِ الْأَيَّامِ يَفْهَمُ الزَّائِرُ لِمَاذَا يُحِبُّ أَهْلُ الْبَادِيَةِ صَحْرَاءَهُمُ الْجَمِيلَةَ أَكْثَرَ مِنْ أَيِّ مَكَانٍ آخَرَ."], ["يَنْظُرُ كَثِيرٌ مِنَ النَّاسِ إِلَى الْقَمَرِ كُلَّ لَيْلَةٍ، فَيَرَوْنَهُ أَحْيَانًا دَائِرَةً كَامِلَةً، وَأَحْيَانًا هِلَالًا رَفِيعًا.", "لَكِنَّ الْقَمَرَ لَا يَتَغَيَّرُ، فَهُوَ كُرَةٌ صَخْرِيَّةٌ تَدُورُ حَوْلَ الْأَرْضِ.", "الْقَمَرُ لَا يُضِيءُ بِنَفْسِهِ، بَلْ يَعْكِسُ ضَوْءَ الشَّمْسِ.", "وَعِنْدَمَا يَدُورُ حَوْلَ الْأَرْضِ، نَرَى الْجُزْءَ الْمُضِيءَ مِنْهُ مِنْ زَاوِيَةٍ مُخْتَلِفَةٍ كُلَّ لَيْلَةٍ.", "لِذَلِكَ يَبْدُو الْقَمَرُ كَأَنَّهُ يَكْبُرُ ثُمَّ يَصْغُرُ خِلَالَ الشَّهْرِ.", "وَقَدْ أَرْسَلَتِ الْإِمَارَاتُ مُسْتَكْشِفًا صَغِيرًا نَحْوَ الْقَمَرِ، لِيَتَعَلَّمَ الْعُلَمَاءُ الْمَزِيدَ عَنْ سَطْحِهِ وَتُرَابِهِ.", "فَفِي الْمَرَّةِ الْقَادِمَةِ الَّتِي تَرَى فِيهَا الْهِلَالَ، تَذَكَّرْ أَنَّكَ تَرَى جُزْءًا صَغِيرًا مِنْ كُرَةٍ كَبِيرَةٍ."], ["طَلَبَتِ الْمُعَلِّمَةُ مِنْ كُلِّ مَجْمُوعَةٍ أَنْ تُعِدَّ مَشْرُوعًا عَنْ تَوْفِيرِ الْمَاءِ.", "اخْتَارَ حَمَدٌ وَعَلْيَاءُ وَمَنْصُورٌ أَنْ يَصْنَعُوا لَوْحَةً كَبِيرَةً تَشْرَحُ كَيْفَ نُوَفِّرُ الْمَاءَ فِي الْبَيْتِ وَالْمَدْرَسَةِ.", "قَضَوْا أُسْبُوعًا كَامِلًا يَبْحَثُونَ فِي الْكُتُبِ وَالْمَوَاقِعِ، وَيَرْسُمُونَ الصُّوَرَ، وَيَكْتُبُونَ الْجُمَلَ الْقَصِيرَةَ.", "فِي الْيَوْمِ الْأَخِيرِ سَقَطَ كُوبُ عَصِيرٍ عَلَى اللَّوْحَةِ فَاتَّسَخَ نِصْفُهَا.", "حَزِنَتْ عَلْيَاءُ، لَكِنَّ مَنْصُورًا قَالَ: لَدَيْنَا وَقْتٌ، هَيَّا نَعْمَلْ مَعًا.", "أَعَادُوا رَسْمَ النِّصْفِ الْمُتَّسِخِ فِي سَاعَةٍ وَاحِدَةٍ.", "فِي الْيَوْمِ التَّالِي فَازَتْ مَجْمُوعَتُهُمْ بِالْمَرْكَزِ الْأَوَّلِ، وَقَالَتِ الْمُعَلِّمَةُ: لَمْ تَفُوزُوا بِسَبَبِ اللَّوْحَةِ فَقَطْ، بَلْ لِأَنَّكُمْ لَمْ تَسْتَسْلِمُوا أَمَامَ الْمُشْكِلَةِ."], ["عِنْدَمَا كَانَ جَدُّ سُلْطَانَ شَابًّا، كَانَ يَمْلِكُ صَقْرًا اسْمُهُ بَرْقٌ، يُدَرِّبُهُ كُلَّ مَسَاءٍ فِي الصَّحْرَاءِ الْقَرِيبَةِ مِنَ الْقَرْيَةِ.", "فِي أَحَدِ الْأَيَّامِ طَارَ بَرْقٌ خَلْفَ طَائِرٍ بَعِيدٍ وَاخْتَفَى خَلْفَ الْكُثْبَانِ، فَانْتَظَرَهُ الْجَدُّ حَتَّى الْغُرُوبِ دُونَ أَنْ يَعُودَ.", "حَزِنَ الْجَدُّ كَثِيرًا، لَكِنَّهُ تَرَكَ قِطْعَةَ لَحْمٍ عَلَى الصَّخْرَةِ الَّتِي اعْتَادَ الصَّقْرُ الْوُقُوفَ عَلَيْهَا.", "وَفِي صَبَاحِ الْيَوْمِ الثَّالِثِ سَمِعَ صَوْتَ أَجْنِحَةٍ قَوِيَّةٍ، فَإِذَا بِبَرْقٍ يَهْبِطُ عَلَى ذِرَاعِهِ كَأَنَّهُ لَمْ يَغِبْ أَبَدًا.", "يَقُولُ الْجَدُّ لِسُلْطَانَ كُلَّمَا رَوَى الْقِصَّةَ: مَنْ يُعَامِلِ الْحَيَوَانَ بِالرِّفْقِ، يَعُدْ إِلَيْهِ مَهْمَا ابْتَعَدَ."], ["الطَّائِرَةُ بِدُونِ طَيَّارٍ جِهَازٌ صَغِيرٌ يَطِيرُ فِي الْهَوَاءِ، وَيَتَحَكَّمُ فِيهِ شَخْصٌ يَقِفُ عَلَى الْأَرْضِ.", "لَهَا أَرْبَعُ مَرَاوِحَ سَرِيعَةٍ تَدُورُ فِي اتِّجَاهَاتٍ مُخْتَلِفَةٍ، فَإِذَا دَارَتْ كُلُّهَا بِالسُّرْعَةِ نَفْسِهَا ارْتَفَعَتِ الطَّائِرَةُ إِلَى الْأَعْلَى، وَإِذَا أَبْطَأَتْ مِرْوَحَتَانِ مَالَتِ الطَّائِرَةُ نَحْوَ جَانِبٍ وَاحِدٍ.", "تَحْمِلُ الطَّائِرَةُ كَامِيرَا صَغِيرَةً تُرْسِلُ الصُّوَرَ إِلَى شَاشَةِ الْمُتَحَكِّمِ فِي اللَّحْظَةِ نَفْسِهَا.", "وَفِي الْإِمَارَاتِ تُسْتَخْدَمُ هَذِهِ الطَّائِرَاتُ لِتَصْوِيرِ الْمَزَارِعِ مِنَ الْأَعْلَى، وَلِمُرَاقَبَةِ الشَّوَاطِئِ، وَحَتَّى لِتَوْصِيلِ الْأَدْوِيَةِ إِلَى الْأَمَاكِنِ الْبَعِيدَةِ.", "غَيْرَ أَنَّ قِيَادَتَهَا تَحْتَاجُ إِلَى تَدْرِيبٍ، وَإِلَى احْتِرَامِ الْقَوَانِينِ الَّتِي تَحْمِي الطَّائِرَاتِ الْكَبِيرَةَ وَالنَّاسَ عَلَى الْأَرْضِ."], ["قَبْلَ أَنْ تُشْرِقَ الشَّمْسُ يَسْتَيْقِظُ الْمِينَاءُ الصَّغِيرُ عَلَى صَوْتِ الْمُحَرِّكَاتِ.", "تَتَمَايَلُ قَوَارِبُ الصَّيْدِ الْخَشَبِيَّةُ بِهُدُوءٍ فَوْقَ الْمَاءِ الْهَادِئِ، وَتَنْعَكِسُ أَضْوَاؤُهَا الصَّفْرَاءُ عَلَى سَطْحِ الْبَحْرِ كَأَنَّهَا نُجُومٌ سَقَطَتْ فِيهِ.", "يَجُرُّ الصَّيَّادُونَ الشِّبَاكَ الثَّقِيلَةَ بِأَذْرُعٍ قَوِيَّةٍ وَصَبُورَةٍ، بَيْنَمَا تُحَلِّقُ طُيُورُ النَّوْرَسِ فَوْقَهُمْ مُنْتَظِرَةً نَصِيبَهَا مِنَ السَّمَكِ.", "عَلَى الرَّصِيفِ تَصْطَفُّ صَنَادِيقُ الثَّلْجِ الْبَيْضَاءُ، وَيَجْلِسُ رَجُلٌ كَبِيرٌ فِي السِّنِّ يَشْرَبُ قَهْوَتَهُ السَّاخِنَةَ وَيُرَاقِبُ الشَّبَابَ بِابْتِسَامَةٍ، لِأَنَّهُ كَانَ يَوْمًا وَاحِدًا مِنْهُمْ.", "وَعِنْدَمَا تَرْتَفِعُ الشَّمْسُ يَصِيرُ الْمَاءُ أَزْرَقَ صَافِيًا، وَتَعُودُ الْقَوَارِبُ إِلَى الشَّاطِئِ الرَّمْلِيِّ مُحَمَّلَةً بِخَيْرِ الْبَحْرِ، وَيَبْدَأُ يَوْمٌ جَدِيدٌ فِي الْمِينَاءِ الْقَدِيمِ."], ["سَأَلَ يُوسُفُ أُخْتَهُ الْكُبْرَى: هَلْ صَحِيحٌ أَنَّ رَائِدًا إِمَارَاتِيًّا عَاشَ فِي مَحَطَّةِ الْفَضَاءِ؟", "أَجَابَتْ هِنْدُ: نَعَمْ، وَقَضَى هُنَاكَ أَشْهُرًا طَوِيلَةً يُجْرِي التَّجَارِبَ الْعِلْمِيَّةَ.", "قَالَ يُوسُفُ مُتَعَجِّبًا: وَكَيْفَ يَنَامُ إِذَا كَانَ كُلُّ شَيْءٍ يَطْفُو فِي الْهَوَاءِ؟", "ضَحِكَتْ هِنْدُ وَقَالَتْ: يَرْبِطُ كِيسَ النَّوْمِ بِالْجِدَارِ حَتَّى لَا يَطِيرَ وَهُوَ نَائِمٌ!", "سَأَلَ يُوسُفُ: وَمَاذَا يَأْكُلُ؟", "قَالَتْ: طَعَامًا مُجَفَّفًا يُضِيفُ إِلَيْهِ الْمَاءَ، وَيَشْرَبُ مِنْ أَكْيَاسٍ خَاصَّةٍ بِوَاسِطَةِ أُنْبُوبٍ رَفِيعٍ.", "صَمَتَ يُوسُفُ قَلِيلًا ثُمَّ قَالَ: أُرِيدُ أَنْ أَكُونَ مِثْلَهُ، فَمَاذَا أَفْعَلُ الْآنَ؟", "أَجَابَتْ هِنْدُ: اهْتَمَّ بِالرِّيَاضِيَّاتِ وَالْعُلُومِ، وَحَافِظْ عَلَى صِحَّتِكَ، فَرُوَّادُ الْفَضَاءِ يَبْدَؤُونَ مِنْ مَقَاعِدِ الدِّرَاسَةِ."], ["فِي طَرِيقِ الْعَوْدَةِ مِنَ الْمَدْرَسَةِ وَجَدَ مُبَارَكٌ حَقِيبَةً سَوْدَاءَ عَلَى مَقْعَدِ الْحَافِلَةِ.", "فَتَحَهَا بِحَذَرٍ فَوَجَدَ فِيهَا دَفَاتِرَ وَآلَةً حَاسِبَةً وَبِطَاقَةً مَكْتُوبًا عَلَيْهَا اسْمُ طَالِبٍ مِنَ الصَّفِّ الْخَامِسِ.", "فَكَّرَ مُبَارَكٌ، ثُمَّ قَرَّرَ أَنْ يَحْمِلَهَا إِلَى الْمَدْرَسَةِ فِي الْيَوْمِ التَّالِي بَدَلًا مِنْ أَنْ يَتْرُكَهَا فِي الْحَافِلَةِ.", "فِي الصَّبَاحِ ذَهَبَ إِلَى مَكْتَبِ الْإِدَارَةِ وَسَلَّمَ الْحَقِيبَةَ لِلْمُشْرِفَةِ.", "بَعْدَ قَلِيلٍ جَاءَ طَالِبٌ طَوِيلٌ يَلْهَثُ، وَقَدْ بَدَا عَلَيْهِ التَّعَبُ لِأَنَّهُ بَحَثَ عَنْهَا طَوَالَ الْمَسَاءِ.", "عِنْدَمَا رَأَى حَقِيبَتَهُ تَنَفَّسَ بِعُمْقٍ وَقَالَ: فِيهَا مَشْرُوعِي الَّذِي عَمِلْتُ عَلَيْهِ شَهْرًا كَامِلًا!", "شَكَرَ مُبَارَكًا مَرَّاتٍ كَثِيرَةً، وَمُنْذُ ذَلِكَ الْيَوْمِ صَارَا صَدِيقَيْنِ رَغْمَ فَرْقِ الْعُمْرِ بَيْنَهُمَا."], ["يُسَمِّي الْعَرَبُ الْجَمَلَ سَفِينَةَ الصَّحْرَاءِ، لِأَنَّهُ يَسْتَطِيعُ أَنْ يَسِيرَ أَيَّامًا بَيْنَ الرِّمَالِ الْحَارَّةِ تَحْتَ الشَّمْسِ دُونَ أَنْ يَشْرَبَ.", "كَيْفَ يَفْعَلُ ذَلِكَ؟", "يَظُنُّ بَعْضُ النَّاسِ أَنَّ الْجَمَلَ يَخْزُنُ الْمَاءَ فِي سَنَامِهِ، لَكِنَّ السَّنَامَ فِي الْحَقِيقَةِ مَلِيءٌ بِالدُّهُونِ الَّتِي يُحَوِّلُهَا الْجِسْمُ إِلَى طَاقَةٍ عِنْدَمَا يَقِلُّ الطَّعَامُ.", "أَمَّا الْمَاءُ فَيَشْرَبُ مِنْهُ الْجَمَلُ كَمِّيَّةً كَبِيرَةً فِي دَقَائِقَ قَلِيلَةٍ، وَيُحَافِظُ عَلَيْهِ جِسْمُهُ لِأَنَّهُ لَا يَتَعَرَّقُ كَثِيرًا.", "وَلِلْجَمَلِ أَيْضًا رُمُوشٌ طَوِيلَةٌ تَحْمِي عَيْنَيْهِ مِنَ الرَّمْلِ، وَأَقْدَامٌ عَرِيضَةٌ لَا تَغُوصُ فِي الْكُثْبَانِ النَّاعِمَةِ.", "لِهَذَا اعْتَمَدَ أَجْدَادُنَا عَلَى الْجَمَلِ فِي السَّفَرِ وَنَقْلِ الْبَضَائِعِ، وَمَا زَالَ الْيَوْمَ جُزْءًا عَزِيزًا مِنْ تُرَاثِ الْإِمَارَاتِ، نَرَاهُ فِي السِّبَاقَاتِ وَالْمَهْرَجَانَاتِ."], ["كَانَ رَاشِدٌ يُلَاحِظُ أَنَّ جَدَّتَهُ تَنْسَى مَوْعِدَ دَوَائِهَا فِي كَثِيرٍ مِنَ الْأَحْيَانِ.", "فَكَّرَ طَوِيلًا، ثُمَّ قَرَّرَ أَنْ يَصْنَعَ لَهَا عُلْبَةَ دَوَاءٍ ذَكِيَّةً لِمَعْرِضِ الْعُلُومِ فِي مَدْرَسَتِهِ.", "اسْتَعْمَلَ عُلْبَةً بِلَاسْتِيكِيَّةً وَسَاعَةً صَغِيرَةً وَمِصْبَاحًا أَحْمَرَ، وَرَبَطَهَا بِأَسْلَاكٍ رَفِيعَةٍ بِمُسَاعَدَةِ مُعَلِّمِ الْعُلُومِ.", "عِنْدَمَا يَحِينُ مَوْعِدُ الدَّوَاءِ يُضِيءُ الْمِصْبَاحُ وَيَصْدُرُ صَوْتٌ لَطِيفٌ حَتَّى تَفْتَحَ الْجَدَّةُ الْعُلْبَةَ.", "فِي الْمَرَّةِ الْأُولَى كَانَ الصَّوْتُ عَالِيًا جِدًّا، فَضَحِكَتِ الْجَدَّةُ وَقَالَتْ: سَيَسْمَعُهُ الْجِيرَانُ كُلُّهُمْ!", "خَفَّضَ رَاشِدٌ الصَّوْتَ، وَجَرَّبَ الْعُلْبَةَ مَعَ جَدَّتِهِ أُسْبُوعًا كَامِلًا قَبْلَ يَوْمِ الْمَعْرِضِ.", "فَازَ الِاخْتِرَاعُ بِالْجَائِزَةِ الثَّانِيَةِ، لَكِنَّ رَاشِدًا كَانَ يَشْعُرُ أَنَّ جَائِزَتَهُ الْحَقِيقِيَّةَ هِيَ ابْتِسَامَةُ جَدَّتِهِ حِينَ قَالَتْ لَهُ: لَمْ أَنْسَ دَوَائِي مُنْذُ أُسْبُوعٍ بِفَضْلِكَ."], ["فَوْقَ تَلٍّ صَغِيرٍ تَقِفُ قَلْعَةٌ قَدِيمَةٌ بُنِيَتْ مِنَ الطِّينِ وَالْحَجَرِ قَبْلَ مِئَاتِ السَّنَوَاتِ.", "جُدْرَانُهَا سَمِيكَةٌ بِلَوْنِ الرَّمْلِ، وَفِي أَعْلَاهَا بُرْجٌ دَائِرِيٌّ كَانَ الْحُرَّاسُ يَقِفُونَ فِيهِ لِيُرَاقِبُوا الطَّرِيقَ وَالْوَاحَةَ.", "عِنْدَمَا تَدْخُلُ مِنَ الْبَابِ الْخَشَبِيِّ الْكَبِيرِ تَشْعُرُ بِبُرُودَةٍ لَطِيفَةٍ، لِأَنَّ الطِّينَ يَحْفَظُ الْمَكَانَ بَارِدًا حَتَّى فِي أَيَّامِ الصَّيْفِ الشَّدِيدَةِ الْحَرَارَةِ.", "فِي السَّاحَةِ الدَّاخِلِيَّةِ بِئْرٌ عَمِيقَةٌ وَنَخْلَةٌ وَاحِدَةٌ عَالِيَةٌ تُلْقِي ظِلَّهَا عَلَى الْأَرْضِ التُّرَابِيَّةِ.", "وَمِنْ نَوَافِذِ الْبُرْجِ الضَّيِّقَةِ يَبْدُو الْوَادِي أَخْضَرَ وَالْجِبَالُ الْبَعِيدَةُ زَرْقَاءَ تَحْتَ ضَوْءِ الصَّبَاحِ.", "يَقُولُ الْمُرْشِدُ لِلزَّائِرِينَ إِنَّ كُلَّ حَجَرٍ هُنَا يَحْكِي قِصَّةً عَنْ أُنَاسٍ عَاشُوا بِبَسَاطَةٍ وَشَجَاعَةٍ، وَإِنَّ مَنْ يَعْرِفْ مَاضِيَهُ يَبْنِ مُسْتَقْبَلَهُ بِثِقَةٍ، وَلِذَلِكَ تَحْرِصُ الدَّوْلَةُ عَلَى تَرْمِيمِ الْقِلَاعِ الْقَدِيمَةِ."], ["قَبْلَ أَنْ يُكْتَشَفَ النِّفْطُ، كَانَ كَثِيرٌ مِنْ أَهْلِ الْإِمَارَاتِ يَعْمَلُونَ فِي الْغَوْصِ بَحْثًا عَنِ اللُّؤْلُؤِ.", "فِي بِدَايَةِ الصَّيْفِ تُبْحِرُ السُّفُنُ الْخَشَبِيَّةُ إِلَى أَمَاكِنَ مَعْرُوفَةٍ يَكْثُرُ فِيهَا الْمَحَارُ، وَتَبْقَى هُنَاكَ أَشْهُرًا طَوِيلَةً، وَيَنْتَظِرُ أَهْلُهُمْ عَوْدَتَهُمْ بِشَوْقٍ.", "يَضَعُ الْغَوَّاصُ مِشْبَكًا عَلَى أَنْفِهِ حَتَّى لَا يَدْخُلَ الْمَاءُ إِلَيْهِ، وَيَرْبِطُ حَجَرًا ثَقِيلًا بِقَدَمِهِ لِيَنْزِلَ بِسُرْعَةٍ إِلَى الْقَاعِ.", "هُنَاكَ يَجْمَعُ الْمَحَارَ فِي كِيسٍ خِلَالَ دَقِيقَةٍ ُسَافِرُونَ عَلَى الْجِمَالِ وَيَحْمِلُونَ عَلَيْهَا أَمْتِعَتَهُمْ.", "لِهَذَا سَمَّاهُ الْعَرَبُ سَفِينَةَ الصَّحْرَاءِ.", "لَهَا أَرْبَعُ مَرَاوِحَ تَدُورُ بِسُرْعَةٍ، وَكَامِيرَا تُصَوِّرُ مِنْ فَوْقُ.", "وَفِي بَعْضِ الْمُدُنِ تَحْمِلُ الطَّائِرَةُ الطُّرُودَ الصَّغِيرَةَ إِلَى الْبُيُوتِ.", "فِي الصَّبَاحِ الْبَاكِرِ يَكُونُ الشَّاطِئُ هَادِئًا وَجَمِيلًا.", "وَرَائِحَةُ الْبَحْرِ تَمْلَأُ الْمَكَانَ.", "تَقِفُ طُيُورُ النَّوْرَسِ عَلَى الصُّخُورِ، ثُمَّ تَطِيرُ فَوْقَ الْمَوْجِ.", "فِي الْبَعِيدِ تَسِيرُ الْقَوَارِبُ الْخَشَبِيَّةُ بِبُطْءٍ، وَتَعُودُ بِالسَّمَكِ إِلَى الْمِينَاءِ.", "عَلَى الشَّاطِئِ يَجْمَعُ الْأَطْفَالُ الْأَصْدَافَ الْمُلَوَّنَةَ، وَيَرْسُمُونَ عَلَى الرَّمْلِ.", "مَا أَجْمَلَ الْبَحْرَ فِي بِلَادِنَا!", "فِي الْأُسْبُوعِ الْأَوَّلِ نَسِيَ خَالِدٌ مَرَّتَيْنِ، فَذَبُلَتْ أَوْرَاقُ النَّبْتَةِ.", "الْفَضَاءُ مَكَانٌ وَاسِعٌ بَعِيدٌ عَنِ الْأَرْضِ.", "يَذْهَبُ إِلَيْهِ رُوَّادُ الْفَضَاءِ فِي صَوَارِيخَ كَبِيرَةٍ.", "وَصَلَ رُوَّادٌ مِنَ الْإِمَارَاتِ إِلَى مَحَطَّةِ الْفَضَاءِ، وَصَوَّرُوا الْأَرْضَ.", "كَانَتِ الْأَرْضُ تَبْدُو كَكُرَةٍ زَرْقَاءَ.", "يَحْلُمُ كَثِيرٌ مِنَ الْأَطْفَالِ أَنْ يُصْبِحُوا رُوَّادَ فَضَاءٍ.", "فِي وَسَطِ الْمَدِينَةِ تَقِفُ قَلْعَةٌ قَدِيمَةٌ جَمِيلَةٌ بُنِيَتْ مِنَ الطِّينِ وَالْحَجَرِ.", "بَابُهَا الْخَشَبِيُّ كَبِيرٌ وَمُزَيَّنٌ بِالْمَسَامِيرِ النُّحَاسِيَّةِ.", "الْيَوْمَ صَارَتِ الْقَلْعَةُ مَتْحَفًا، يَزُورُهُ الطُّلَّابُ لِيَتَعَرَّفُوا عَلَى تَارِيخِ بِلَادِهِمْ.", "طَلَبَتِ الْمُعَلِّمَةُ مِنْ كُلِّ طَالِبٍ أَنْ يَصْنَعَ اخْتِرَاعًا بَسِيطًا لِلْمَعْرِضِ.", "فَكَّرَ مَنْصُورٌ، ثُمَّ قَرَّرَ أَنْ يَصْنَعَ مِصْبَاحًا يَعْمَلُ بِالشَّمْسِ.", "أَحْضَرَ لَوْحًا شَمْسِيًّا صَغِيرًا وَبَطَّارِيَّةً وَمِصْبَاحًا.", "سَاعَدَهُ أَبُوهُ فِي التَّوْصِيلِ، لَكِنَّ الْمِصْبَاحَ لَمْ يُضِئْ.", "لَمْ يَيْأَسْ مَنْصُورٌ، بَلْ رَاجَعَ كُلَّ سِلْكٍ، فَوَجَدَ سِلْكًا غَيْرَ مَوْصُولٍ.", "وَصَلَهُ بِحَذَرٍ، فَأَضَاءَ الْمِصْبَاحُ!", "فَازَ مَشْرُوعُهُ بِالْمَرْكَزِ الثَّانِي، وَكَانَ أَسْعَدَ طَالِبٍ.", "سَافَرَتْ عَائِشَةُ لِأَوَّلِ مَرَّةٍ بِالطَّائِرَةِ مَعَ عَائِلَتِهَا.", "فِي الْمَطَارِ وَقَفَتْ فِي الصَّفِّ بِهُدُوءٍ، وَأَعْطَتِ الْمُوَظَّفَ جَوَازَ سَفَرِهَا.", "جَلَسَتْ بِجَانِبِ النَّافِذَةِ، وَرَبَطَتْ حِزَامَ الْأَمَانِ كَمَا قَالَتِ الْمُضِيفَةُ.", "انْطَلَقَتِ الطَّائِرَةُ بِسُرْعَةٍ، ثُمَّ ارْتَفَعَتْ فَوْقَ الْغُيُومِ.", "نَظَرَتْ عَائِشَةُ إِلَى الْأَسْفَلِ، فَرَأَتِ الْبُيُوتَ صَغِيرَةً وَالطُّرُقَ كَالْخُيُوطِ.", "كَانَ الْجَوُّ بَارِدًا، وَالْجِبَالُ مُغَطَّاةً بِالثَّلْجِ.", "فَتَحَتْ عَائِشَةُ دَفْتَرَهَا وَكَتَبَتْ: «الْيَوْمَ بَدَأَتْ مُغَامَرَتِي الْأُولَى.»", "فِي يَوْمِ الْجُمُعَةِ الْمَاضِي وَقَفَ خَالِدٌ فِي مَرْمَى فَرِيقِهِ لِأَوَّلِ مَرَّةٍ.", "صَاحَ أَصْدِقَاؤُهُ فَرَحًا شَدِيدًا، وَانْتَهَتِ الْمُبَارَاةُ بِفَوْزِ فَرِيقِهِ بِهَدَفٍ وَاحِدٍ.", "حَمَلَهُ اللَّاعِبُونَ عَلَى أَكْتَافِهِمْ وَهُمْ يُرَدِّدُونَ اسْمَهُ بِفَخْرٍ.", "لِلصَّقْرِ جَنَاحَانِ طَوِيلَانِ وَرِيشٌ خَفِيفٌ، لِذَلِكَ يَسْتَطِيعُ أَنْ يَطِيرَ لِسَاعَاتٍ طَوِيلَةٍ.", "أَمَّا عِنْدَمَا يُرِيدُ أَنْ يَنْزِلَ، فَإِنَّهُ يَضُمُّ جَنَاحَيْهِ وَيَهْبِطُ بِسُرْعَةٍ.", "عَيْنَا الصَّقْرِ حَادَّتَانِ جِدًّا، فَهُوَ يَرَى الْأَشْيَاءَ الصَّغِيرَةَ مِنْ مَسَافَةٍ بَعِيدَةٍ.", "فِي الصَّبَاحِ الْبَاكِرِ يَمْتَلِئُ سُوقُ السَّمَكِ بِالْحَرَكَةِ وَالْأَصْوَاتِ.", "تَصْطَفُّ الْأَسْمَاكُ اللَّامِعَةُ عَلَى الثَّلْجِ الْأَبْيَضِ، وَيُنَادِي الْبَائِعُونَ بِأَصْوَاتٍ عَالِيَةٍ.", "هُنَاكَ سَمَكُ الْهَامُورِ الْكَبِيرُ، وَسَمَكُ الصَّافِي الصَّغِيرُ، وَالرُّوبْيَانُ الَّذِي يُحِبُّهُ الْجَمِيعُ.", "رَائِحَةُ الْبَحْرِ تَمْلَأُ الْمَكَانَ، وَالْأَرْضُ مَبْلُولَةٌ بِالْمَاءِ الْبَارِدِ.", "أُحِبُّ هَذَا الْمَكَانَ لِأَنَّهُ يَحْكِي قِصَّةَ الْبَحْرِ وَالنَّاسِ.", "طَلَبَتِ الْمُعَلِّمَةُ مِنَ الطُّلَّابِ أَنْ يَصْنَعُوا مَشْرُوعًا عِلْمِيًّا خِلَالَ أُسْبُوعَيْنِ.", "قَرَّرَتْ نُورَةُ وَزَمِيلُهَا رَاشِدٌ أَنْ يَبْنِيَا رُوبُوتًا صَغِيرًا يُنَظِّفُ الطَّاوِلَةَ.", "فِي الْبِدَايَةِ لَمْ يَتَحَرَّكِ الرُّوبُوتُ، وَشَعَرَا بِالْحُزْنِ.", "بَعْدَ إِصْلَاحِهِ تَحَرَّكَ الرُّوبُوتُ وَمَسَحَ الطَّاوِلَةَ.", "جَلَسَ سَيْفٌ مَعَ جَدِّهِ عَلَى سَطْحِ الْبَيْتِ يَنْظُرَانِ إِلَى السَّمَاءِ.", "قَبْلَ سَنَوَاتٍ طَوِيلَةٍ كَانَ الْغَوْصُ عَلَى اللُّؤْلُؤِ أَهَمَّ عَمَلٍ فِي الْإِمَارَاتِ.", "فِي الْمَسَاءِ يَفْتَحُ الْبَحَّارَةُ الْمَحَارَ وَيَبْحَثُونَ عَنِ اللُّؤْلُؤِ بِصَبْرٍ وَأَمَلٍ كَبِيرٍ.", "الْيَوْمَ نَتَذَكَّرُ هَؤُلَاءِ الرِّجَالَ لِأَنَّهُمْ عَلَّمُونَا مَعْنَى الصَّبْرِ وَالتَّعَاوُنِ.", "فِي الْعُطْلَةِ سَافَرَتْ عَائِلَةُ مَهَا إِلَى جَبَلِ جَيْسٍ.", "جَلَسَا هُنَاكَ يَشْرَبَانِ الْمَاءَ وَيَشْعُرَانِ بِأَنَّهُمَا حَقَّقَا شَيْئًا كَبِيرًا.", "بَعْدَ لَيْلَةٍ مِنَ الْمَطَرِ تَتَغَيَّرُ الصَّحْرَاءُ.", "يَخْرُجُ الضَّبُّ مِنْ جُحْرِهِ لِيَسْتَمْتِعَ بِالشَّمْسِ الدَّافِئَةِ، وَتَطِيرُ الْفَرَاشَاتُ فَوْقَ الْأَعْشَابِ.", "فِي الصَّبَاحِ تَكُونُ رَائِحَةُ الْأَرْضِ الْمُبَلَّلَةِ أَجْمَلَ مِنْ أَيِّ عِطْرٍ.", "وَفِي الْمَسَاءِ تَمْتَلِئُ بِرْكَةٌ صَغِيرَةٌ بِالْمَاءِ فَتَأْتِي إِلَيْهَا الْجِمَالُ لِتَشْرَبَ بِهُدُوءٍ.", "مَنْ يَزُورُهَا فِي هَذَا الْوَقْتِ يَفْهَمُ لِمَاذَا أَحَبَّهَا أَجْدَادُنَا.", "وَفِي بِلَادِنَا تُسْتَخْدَمُ لِتَوْصِيلِ الْأَدْوِيَةِ إِلَى الْأَمَاكِنِ الْبَعِيدَةِ.", "فِي الْمَسَاءِ رَأَى أَوْرَاقَ النَّخْلَةِ وَقَدْ بَدَأَتْ تَذْبُلُ، فَشَعَرَ بِالْخَجَلِ.", "لَمْ يَفُزْ جَمَلُ الْعَمِّ، لَكِنَّهُ أَكْمَلَ السِّبَاقَ دُونَ أَنْ يَتَوَقَّفَ.", "لِذَلِكَ يُقَالُ إِنَّ النَّخْلَةَ شَجَرَةٌ كَرِيمَةٌ لَا تُبْقِي شَيْئًا لِنَفْسِهَا.", "إِذَا زَرَعْتَ نَخْلَةً الْيَوْمَ فَإِنَّ أَحْفَادَكَ سَيَأْكُلُونَ مِنْ ثَمَرِهَا بَعْدَ سَنَوَاتٍ.", "تَقِفُ الْقَلْعَةُ الْقَدِيمَةُ وَسَطَ الْمَدِينَةِ كَحَارِسٍ صَامِتٍ يُرَاقِبُ الزَّمَنَ.", "جُدْرَانُهَا السَّمِيكَةُ مَبْنِيَّةٌ مِنَ الْحَجَرِ الْمَرْجَانِيِّ وَالطِّينِ، وَلَوْنُهَا يُشْبِهُ لَوْنَ الرِّمَالِ.", "فِي السَّاحَةِ الدَّاخِلِيَّةِ بِئْرٌ قَدِيمَةٌ وَنَخْلَتَانِ عَالِيَتَانِ يَسْتَرِيحُ الزُّوَّارُ تَحْتَ ظِلِّهِمَا.", "نَظَرَ أَعْضَاءُ الْفَرِيقِ بَعْضُهُمْ إِلَى بَعْضٍ بِوُجُوهٍ شَاحِبَةٍ.", "عِنْدَمَا نَادَى الْحَكَمُ عَلَى اسْمِ الْفَرِيقِ كَانَ الرُّوبُوتُ يَتَحَرَّكُ.", "الْمِرِّيخُ كَوْكَبٌ أَحْمَرُ يَبْعُدُ عَنِ الْأَرْضِ مَلَايِينَ الْكِيلُومِتْرَاتِ.", "فِي يَوْمِ الْجُمُعَةِ وَجَدَ يُوسُفُ هَاتِفًا صَغِيرًا عَلَى مَقْعَدٍ فِي الْحَدِيقَةِ.", "نَظَرَ حَوْلَهُ طَوِيلًا فَلَمْ يَرَ أَحَدًا.", "بَعْدَ قَلِيلٍ جَاءَ رَجُلٌ يَبْحَثُ عَنْ هَاتِفِهِ بِقَلَقٍ.", "السُّلَحْفَاةُ الْبَحْرِيَّةُ حَيَوَانٌ هَادِئٌ يَعِيشُ فِي الْبَحْرِ.", "لَهَا دِرْعٌ صُلْبٌ عَلَى ظَهْرِهَا يَحْمِي جِسْمَهَا.", "تَسْبَحُ السُّلَحْفَاةُ بِزَعَانِفِهَا مَسَافَاتٍ طَوِيلَةً، وَتَأْكُلُ الْأَعْشَابَ الْبَحْرِيَّةَ.", "بَعْدَ أَسَابِيعَ تَخْرُجُ السَّلَاحِفُ الصَّغِيرَةُ وَتَمْشِي بِسُرْعَةٍ نَحْوَ الْمَاءِ.", "فِي الْإِمَارَاتِ يَحْمِي النَّاسُ شَوَاطِئَ السَّلَاحِفِ حَتَّى تَبْقَى آمِنَةً دَائِمًا.", "فِي الصَّبَاحِ الْبَاكِرِ يَمْتَلِئُ سُوقُ السَّمَكِ الْقَدِيمِ بِالنَّاسِ وَالْأَصْوَاتِ.", "تَصْطَفُّ الْأَسْمَاكُ اللَّامِعَةُ عَلَى الثَّلْجِ الْأَبْيَضِ، كَبِيرَةٌ وَصَغِيرَةٌ، فِضِّيَّةٌ وَزَرْقَاءُ.", "يُنَادِي الْبَائِعُونَ بِأَصْوَاتٍ عَالِيَةٍ، وَيَخْتَارُ الْآبَاءُ وَالْأُمَّهَاتُ السَّمَكَ الطَّازَجَ.", "رَائِحَةُ الْبَحْرِ الْمَالِحَةُ تَمْلَأُ الْمَكَانَ، وَالْأَرْضُ مُبَلَّلَةٌ بِالْمَاءِ.", "فِي الزَّاوِيَةِ يَجْلِسُ رَجُلٌ عَجُوزٌ طَيِّبٌ يُنَظِّفُ السَّمَكَ بِمَهَارَةٍ وَيَبْتَسِمُ لِلزَّبَائِنِ.", "فِي يَوْمِ الْمُبَارَاةِ الْكَبِيرَةِ كَانَ فَرِيقُ الصَّفِّ الْخَامِسِ مُتَحَمِّسًا جِدًّا.", "بَدَأَتِ الْمُبَارَاةُ، وَسَجَّلَ الْفَرِيقُ الْآخَرُ نُقْطَتَيْنِ بِسُرْعَةٍ.", "صَاحَ التَّلَامِيذُ فَرَحًا فِي الْمَلْعَبِ.", "فِي النِّهَايَةِ فَازَ فَرِيقُ الْخَامِسِ، وَصَافَحَ اللَّاعِبُونَ جَمِيعًا الْفَرِيقَ الْآخَرَ بِاحْتِرَامٍ.", "قَالَ الْمُعَلِّمُ: «التَّعَاوُنُ الْجَمِيلُ هُوَ سِرُّ الْفَوْزِ.»", "النَّحْلَةُ حَشَرَةٌ صَغِيرَةٌ لَكِنَّهَا نَشِيطَةٌ جِدًّا.", "تَطِيرُ النَّحْلَةُ فِي الصَّبَاحِ مِنْ زَهْرَةٍ إِلَى زَهْرَةٍ وَتَجْمَعُ الرَّحِيقَ الْحُلْوَ.", "بَعْدَ أَيَّامٍ يَتَحَوَّلُ الرَّحِيقُ إِلَى عَسَلٍ لَذِيذٍ.", "يَعِيشُ فِي الْخَلِيَّةِ آلَافُ النَّحْلِ، وَلِكُلِّ نَحْلَةٍ عَمَلٌ خَاصٌّ.", "بَعْضُهَا يَجْمَعُ الرَّحِيقَ، وَبَعْضُهَا يَحْرُسُ بَاب
