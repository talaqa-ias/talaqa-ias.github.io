عَمَلِ", "لِأَنَّ الْمُسَابَقَةَ انْتَهَتْ مُبَكِّرًا"], ["لِمَاذَا نَظَرَ سَالِمٌ إِلَى جَدَّتِهِ بَدَلَ الْكَأْسِ عِنْدَ إِعْلَانِ فَوْزِهِ؟", "لِأَنَّهَا سَبَبُ فِكْرَتِهِ وَأَرَادَ أَنْ يَرَى فَرَحَهَا", "لِأَنَّهُ لَمْ يُحِبَّ شَكْلَ الْكَأْسِ", "لِأَنَّهَا طَلَبَتْ مِنْهُ أَنْ يَعُودَ إِلَى الْبَيْتِ"], ["مَا مَعْنَى كَلِمَةِ «سَهِرَ» فِي النَّصِّ؟", "بَقِيَ مُسْتَيْقِظًا فِي اللَّيْلِ", "نَامَ مُبَكِّرًا", "خَرَجَ لِلَّعِبِ مَعَ أَصْدِقَائِهِ"]]}], "P": [["صَنَعَ سَالِمٌ رُوبُوتَهُ.", "مَشَى رُوبُوتُهُ وَرَفَعَ يَدَهُ.", "قَالَ سَالِمٌ: رُوبُوتِي يَسِيرُ!", "فَرِحَ سَالِمٌ."], ["فِي يَوْمِ الْجُمُعَةِ لَعِبَ فَرِيقُ حَمَدٍ مُبَارَاةً فِي كُرَةِ الْقَدَمِ.", "كَانَ الْفَرِيقُ الْآخَرُ قَوِيًّا، لَكِنَّ حَمَدًا لَمْ يَخَفْ.", "مَرَّرَ الْكُرَةَ إِلَى صَدِيقِهِ عَلِيٍّ، فَسَجَّلَ عَلِيٌّ هَدَفًا جَمِيلًا.", "صَفَّقَ الْجُمْهُورُ.", "فِي النِّهَايَةِ فَازَ الْفَرِيقُ، وَقَالَ الْمُدَرِّبُ: «الْفَوْزُ جَاءَ لِأَنَّكُمْ لَعِبْتُمْ مَعًا.» عَادَ حَمَدٌ إِلَى الْبَيْتِ وَهُوَ سَعِيدٌ، وَحَكَى لِأُمِّهِ عَنِ الْمُبَارَاةِ."], ["الْجَمَلُ حَيَوَانٌ قَوِيٌّ يَعِيشُ فِي الصَّحْرَاءِ الْحَارَّةِ.", "يَسْتَطِيعُ الْجَمَلُ أَنْ يَمْشِيَ أَيَّامًا بِدُونِ مَاءٍ.", "لَهُ سَنَامٌ كَبِيرٌ عَلَى ظَهْرِهِ يَخْزُنُ فِيهِ الدُّهْنَ، وَلَهُ رُمُوشٌ طَوِيلَةٌ تَحْمِي عَيْنَيْهِ مِنَ الرَّمْلِ وَالْغُبَارِ.", "أَقْدَامُهُ عَرِيضَةٌ، لِذَلِكَ لَا يَغُوصُ فِي الرَّمْلِ.", "فِي الْمَاضِي كَانَ النَّاسُ يُسَافِرُونَ عَلَى الْجِمَالِ وَيَحْمِلُونَ عَلَيْهَا أَمْتِعَتَهُمْ.", "لِهَذَا سَمَّاهُ الْعَرَبُ سَفِينَةَ الصَّحْرَاءِ."], ["الطَّائِرَةُ بِلَا طَيَّارٍ جِهَازٌ صَغِيرٌ يَطِيرُ فِي الْهَوَاءِ، وَيَتَحَكَّمُ فِيهِ الْإِنْسَانُ مِنَ الْأَرْضِ.", "لَهَا أَرْبَعُ مَرَاوِحَ تَدُورُ بِسُرْعَةٍ، وَكَامِيرَا تُصَوِّرُ مِنْ فَوْقُ.", "يَسْتَخْدِمُهَا الْمُزَارِعُونَ لِمُرَاقَبَةِ الْحُقُولِ، وَيَسْتَخْدِمُهَا رِجَالُ الْإِنْقَاذِ لِلْبَحْثِ عَنِ النَّاسِ فِي الصَّحْرَاءِ.", "وَفِي بَعْضِ الْمُدُنِ تَحْمِلُ الطَّائِرَةُ الطُّرُودَ الصَّغِيرَةَ إِلَى الْبُيُوتِ.", "لَكِنْ يَجِبُ أَنْ نَطِيرَ بِهَا فِي الْأَمَاكِنِ الْمَسْمُوحَةِ، حَتَّى لَا تُزْعِجَ أَحَدًا."], ["فِي الصَّبَاحِ الْبَاكِرِ يَكُونُ الشَّاطِئُ هَادِئًا وَجَمِيلًا.", "الرَّمْلُ نَاعِمٌ وَدَافِئٌ، وَالْهَوَاءُ مُنْعِشٌ، وَالْمَاءُ أَزْرَقُ صَافٍ تَرَى فِيهِ الْأَسْمَاكَ الصَّغِيرَةَ.", "وَرَائِحَةُ الْبَحْرِ تَمْلَأُ الْمَكَانَ.", "تَقِفُ طُيُورُ النَّوْرَسِ عَلَى الصُّخُورِ، ثُمَّ تَطِيرُ فَوْقَ الْمَوْجِ.", "فِي الْبَعِيدِ تَسِيرُ الْقَوَارِبُ الْخَشَبِيَّةُ بِبُطْءٍ، وَتَعُودُ بِالسَّمَكِ إِلَى الْمِينَاءِ.", "عَلَى الشَّاطِئِ يَجْمَعُ الْأَطْفَالُ الْأَصْدَافَ الْمُلَوَّنَةَ، وَيَرْسُمُونَ عَلَى الرَّمْلِ.", "مَا أَجْمَلَ الْبَحْرَ فِي بِلَادِنَا!"], ["اخْتَارَتِ الْمُعَلِّمَةُ خَالِدًا لِيَسْقِيَ نَبْتَةَ الصَّفِّ كُلَّ يَوْمٍ، وَكَانَ سَعِيدًا بِهَذِهِ الْمُهِمَّةِ.", "فِي الْأُسْبُوعِ الْأَوَّلِ نَسِيَ خَالِدٌ مَرَّتَيْنِ، فَذَبُلَتْ أَوْرَاقُ النَّبْتَةِ.", "حَزِنَ خَالِدٌ كَثِيرًا، فَقَالَ لَهُ صَدِيقُهُ سُلْطَانُ: «اكْتُبْ تَذْكِيرًا عَلَى بَابِ الصَّفِّ.» كَتَبَ خَالِدٌ وَرَقَةً صَغِيرَةً: «لَا تَنْسَ النَّبْتَةَ!» وَبَعْدَ أُسْبُوعٍ عَادَتِ الْأَوْرَاقُ خَضْرَاءَ جَمِيلَةً.", "قَالَتِ الْمُعَلِّمَةُ: «الْمَسْؤُولِيَّةُ تَحْتَاجُ إِلَى نِظَامٍ، وَأَنْتَ تَعَلَّمْتَ ذَلِكَ.» ابْتَسَمَ خَالِدٌ وَشَكَرَ سُلْطَانَ."], ["الْفَضَاءُ مَكَانٌ وَاسِعٌ بَعِيدٌ عَنِ الْأَرْضِ.", "يَذْهَبُ إِلَيْهِ رُوَّادُ الْفَضَاءِ فِي صَوَارِيخَ كَبِيرَةٍ.", "قَبْلَ الرِّحْلَةِ يَتَدَرَّبُ الرَّائِدُ سَنَوَاتٍ طَوِيلَةً، وَيَتَعَلَّمُ كَيْفَ يَعِيشُ فِي حَالَةِ انْعِدَامِ الْوَزْنِ.", "فِي الْفَضَاءِ لَا يَمْشِي الرَّائِدُ، بَلْ يَطْفُو فِي الْهَوَاءِ، وَيَأْكُلُ طَعَامًا خَاصًّا فِي أَكْيَاسٍ مُغْلَقَةٍ.", "وَصَلَ رُوَّادٌ مِنَ الْإِمَارَاتِ إِلَى مَحَطَّةِ الْفَضَاءِ، وَصَوَّرُوا الْأَرْضَ.", "كَانَتِ الْأَرْضُ تَبْدُو كَكُرَةٍ زَرْقَاءَ.", "يَحْلُمُ كَثِيرٌ مِنَ الْأَطْفَالِ أَنْ يُصْبِحُوا رُوَّادَ فَضَاءٍ."], ["فِي وَسَطِ الْمَدِينَةِ تَقِفُ قَلْعَةٌ قَدِيمَةٌ جَمِيلَةٌ بُنِيَتْ مِنَ الطِّينِ وَالْحَجَرِ.", "جُدْرَانُهَا سَمِيكَةٌ وَعَالِيَةٌ، وَلَهَا بُرْجٌ دَائِرِيٌّ فِي كُلِّ زَاوِيَةٍ، وَسَقْفُهَا مِنْ جُذُوعِ النَّخْلِ.", "بَابُهَا الْخَشَبِيُّ كَبِيرٌ وَمُزَيَّنٌ بِالْمَسَامِيرِ النُّحَاسِيَّةِ.", "فِي الدَّاخِلِ سَاحَةٌ وَاسِعَةٌ وَبِئْرٌ قَدِيمَةٌ، وَغُرَفٌ صَغِيرَةٌ بَارِدَةٌ حَتَّى فِي الصَّيْفِ.", "كَانَ الْأَجْدَادُ يَحْمُونَ الْمَدِينَةَ مِنْ فَوْقِ الْبُرْجِ، وَيُرَاقِبُونَ الْبَحْرَ وَالصَّحْرَاءَ مِنْ بَعِيدٍ.", "الْيَوْمَ صَارَتِ الْقَلْعَةُ مَتْحَفًا، يَزُورُهُ الطُّلَّابُ لِيَتَعَرَّفُوا عَلَى تَارِيخِ بِلَادِهِمْ."], ["طَلَبَتِ الْمُعَلِّمَةُ مِنْ كُلِّ طَالِبٍ أَنْ يَصْنَعَ اخْتِرَاعًا بَسِيطًا لِلْمَعْرِضِ.", "فَكَّرَ مَنْصُورٌ، ثُمَّ قَرَّرَ أَنْ يَصْنَعَ مِصْبَاحًا يَعْمَلُ بِالشَّمْسِ.", "أَحْضَرَ لَوْحًا شَمْسِيًّا صَغِيرًا وَبَطَّارِيَّةً وَمِصْبَاحًا.", "سَاعَدَهُ أَبُوهُ فِي التَّوْصِيلِ، لَكِنَّ الْمِصْبَاحَ لَمْ يُضِئْ.", "لَمْ يَيْأَسْ مَنْصُورٌ، بَلْ رَاجَعَ كُلَّ سِلْكٍ، فَوَجَدَ سِلْكًا غَيْرَ مَوْصُولٍ.", "وَصَلَهُ بِحَذَرٍ، فَأَضَاءَ الْمِصْبَاحُ!", "فِي يَوْمِ الْمَعْرِضِ شَرَحَ مَنْصُورٌ لِلزُّوَّارِ كَيْفَ يُحَوِّلُ اللَّوْحُ الشَّمْسِيُّ ضَوْءَ الشَّمْسِ إِلَى كَهْرَبَاءَ.", "فَازَ مَشْرُوعُهُ بِالْمَرْكَزِ الثَّانِي، وَكَانَ أَسْعَدَ طَالِبٍ."], ["سَافَرَتْ عَائِشَةُ لِأَوَّلِ مَرَّةٍ بِالطَّائِرَةِ مَعَ عَائِلَتِهَا.", "فِي الْمَطَارِ وَقَفَتْ فِي الصَّفِّ بِهُدُوءٍ، وَأَعْطَتِ الْمُوَظَّفَ جَوَازَ سَفَرِهَا.", "جَلَسَتْ بِجَانِبِ النَّافِذَةِ، وَرَبَطَتْ حِزَامَ الْأَمَانِ كَمَا قَالَتِ الْمُضِيفَةُ.", "انْطَلَقَتِ الطَّائِرَةُ بِسُرْعَةٍ، ثُمَّ ارْتَفَعَتْ فَوْقَ الْغُيُومِ.", "نَظَرَتْ عَائِشَةُ إِلَى الْأَسْفَلِ، فَرَأَتِ الْبُيُوتَ صَغِيرَةً وَالطُّرُقَ كَالْخُيُوطِ.", "قَالَتْ لِأُمِّهَا: «الدُّنْيَا كَبِيرَةٌ جِدًّا مِنْ هُنَا!» بَعْدَ سَاعَاتٍ هَبَطَتِ الطَّائِرَةُ فِي مَدِينَةٍ جَدِيدَةٍ.", "كَانَ الْجَوُّ بَارِدًا، وَالْجِبَالُ مُغَطَّاةً بِالثَّلْجِ.", "فَتَحَتْ عَائِشَةُ دَفْتَرَهَا وَكَتَبَتْ: «الْيَوْمَ بَدَأَتْ مُغَامَرَتِي الْأُولَى.»"], ["فِي يَوْمِ الْجُمُعَةِ الْمَاضِي وَقَفَ خَالِدٌ فِي مَرْمَى فَرِيقِهِ لِأَوَّلِ مَرَّةٍ.", "كَانَ قَلْبُهُ يَدُقُّ بِسُرْعَةٍ كَبِيرَةٍ، لَكِنَّهُ تَذَكَّرَ كَلَامَ الْمُدَرِّبِ: «رَاقِبِ الْكُرَةَ وَلَا تَنْظُرْ إِلَى الْجُمْهُورِ.» فِي الدَّقِيقَةِ الْأَخِيرَةِ جَاءَتْ كُرَةٌ قَوِيَّةٌ نَحْوَ الزَّاوِيَةِ، فَقَفَزَ خَالِدٌ وَأَمْسَكَهَا بِيَدَيْهِ بِقُوَّةٍ.", "صَاحَ أَصْدِقَاؤُهُ فَرَحًا شَدِيدًا، وَانْتَهَتِ الْمُبَارَاةُ بِفَوْزِ فَرِيقِهِ بِهَدَفٍ وَاحِدٍ.", "حَمَلَهُ اللَّاعِبُونَ عَلَى أَكْتَافِهِمْ وَهُمْ يُرَدِّدُونَ اسْمَهُ بِفَخْرٍ.", "عِنْدَمَا عَادَ إِلَى الْبَيْتِ قَالَ لِأَبِيهِ: «تَعَلَّمْتُ الْيَوْمَ أَنَّ التَّرْكِيزَ أَهَمُّ مِنَ الْخَوْفِ.»"], ["الصَّقْرُ طَائِرٌ قَوِيٌّ يَعِيشُ فِي الصَّحْرَاءِ وَالْجِبَالِ، وَهُوَ رَمْزٌ مُهِمٌّ فِي تُرَاثِ الْإِمَارَاتِ.", "لِلصَّقْرِ جَنَاحَانِ طَوِيلَانِ وَرِيشٌ خَفِيفٌ، لِذَلِكَ يَسْتَطِيعُ أَنْ يَطِيرَ لِسَاعَاتٍ طَوِيلَةٍ.", "عِنْدَمَا يُرِيدُ الصَّقْرُ أَنْ يَصْعَدَ عَالِيًا، يَفْتَحُ جَنَاحَيْهِ وَيَسْتَعْمِلُ الْهَوَاءَ الدَّافِئَ الَّذِي يَرْتَفِعُ مِنَ الْأَرْضِ.", "أَمَّا عِنْدَمَا يُرِيدُ أَنْ يَنْزِلَ، فَإِنَّهُ يَضُمُّ جَنَاحَيْهِ وَيَهْبِطُ بِسُرْعَةٍ.", "عَيْنَا الصَّقْرِ حَادَّتَانِ جِدًّا، فَهُوَ يَرَى الْأَشْيَاءَ الصَّغِيرَةَ مِنْ مَسَافَةٍ بَعِيدَةٍ.", "يُدَرِّبُ الصَّقَّارُونَ فِي بِلَادِنَا هَذِهِ الطُّيُورَ بِصَبْرٍ، وَيَعْتَنُونَ بِهَا كَمَا يَعْتَنِي الْإِنْسَانُ بِصَدِيقِهِ."], ["فِي الصَّبَاحِ الْبَاكِرِ يَمْتَلِئُ سُوقُ السَّمَكِ بِالْحَرَكَةِ وَالْأَصْوَاتِ.", "تَصْطَفُّ الْأَسْمَاكُ اللَّامِعَةُ عَلَى الثَّلْجِ الْأَبْيَضِ، وَيُنَادِي الْبَائِعُونَ بِأَصْوَاتٍ عَالِيَةٍ.", "هُنَاكَ سَمَكُ الْهَامُورِ الْكَبِيرُ، وَسَمَكُ الصَّافِي الصَّغِيرُ، وَالرُّوبْيَانُ الَّذِي يُحِبُّهُ الْجَمِيعُ.", "تَقِفُ جَدَّتِي أَمَامَ كُلِّ طَاوِلَةٍ وَتَنْظُرُ إِلَى عُيُونِ السَّمَكِ لِتَعْرِفَ هَلْ هُوَ طَازَجٌ، ثُمَّ تَخْتَارُ أَفْضَلَهَا بِعِنَايَةٍ.", "رَائِحَةُ الْبَحْرِ تَمْلَأُ الْمَكَانَ، وَالْأَرْضُ مَبْلُولَةٌ بِالْمَاءِ الْبَارِدِ.", "فِي الزَّاوِيَةِ يَجْلِسُ رَجُلٌ عَجُوزٌ طَيِّبٌ يُنَظِّفُ الْأَسْمَاكَ بِمَهَارَةٍ، وَيَبْتَسِمُ لِلْأَطْفَالِ الَّذِينَ يَقِفُونَ لِيُشَاهِدُوهُ.", "أُحِبُّ هَذَا الْمَكَانَ لِأَنَّهُ يَحْكِي قِصَّةَ الْبَحْرِ وَالنَّاسِ."], ["طَلَبَتِ الْمُعَلِّمَةُ مِنَ الطُّلَّابِ أَنْ يَصْنَعُوا مَشْرُوعًا عِلْمِيًّا خِلَالَ أُسْبُوعَيْنِ.", "قَرَّرَتْ نُورَةُ وَزَمِيلُهَا رَاشِدٌ أَنْ يَبْنِيَا رُوبُوتًا صَغِيرًا يُنَظِّفُ الطَّاوِلَةَ.", "فِي الْبِدَايَةِ لَمْ يَتَحَرَّكِ الرُّوبُوتُ، وَشَعَرَا بِالْحُزْنِ.", "لَكِنَّ رَاشِدًا قَالَ: «لِنُجَرِّبْ مَرَّةً أُخْرَى، رُبَّمَا الْمُشْكِلَةُ فِي الْأَسْلَاكِ.» فَحَصَا كُلَّ سِلْكٍ بِهُدُوءٍ حَتَّى وَجَدَا سِلْكًا مَقْطُوعًا.", "بَعْدَ إِصْلَاحِهِ تَحَرَّكَ الرُّوبُوتُ وَمَسَحَ الطَّاوِلَةَ.", "فِي يَوْمِ الْعَرْضِ صَفَّقَ الْجَمِيعُ لَهُمَا، وَقَالَتِ الْمُعَلِّمَةُ: «النَّجَاحُ لَا يَأْتِي مِنْ أَوَّلِ مُحَاوَلَةٍ، بَلْ يَأْتِي لِمَنْ لَا يَسْتَسْلِمُ.» عَادَتْ نُورَةُ إِلَى بَيْتِهَا وَهِيَ تُفَكِّرُ فِي مَشْرُوعٍ جَدِيدٍ."], ["قَبْلَ سَنَوَاتٍ طَوِيلَةٍ كَانَ الْغَوْصُ عَلَى اللُّؤْلُؤِ أَهَمَّ عَمَلٍ فِي الْإِمَارَاتِ.", "فِي فَصْلِ الصَّيْفِ تَخْرُجُ السُّفُنُ الْخَشَبِيَّةُ إِلَى الْبَحْرِ وَتَبْقَى هُنَاكَ عِدَّةَ أَشْهُرٍ.", "كَانَ الْغَوَّاصُ يَضَعُ عَلَى أَنْفِهِ قِطْعَةً صَغِيرَةً، وَيَرْبِطُ حَجَرًا بِقَدَمِهِ لِيَنْزِلَ بِسُرْعَةٍ إِلَى الْقَاعِ.", "هُنَاكَ يَجْمَعُ الْمَحَارَ فِي سَلَّةٍ كَبِيرَةٍ خِلَالَ دَقِيقَةٍ أَوْ دَقِيقَتَيْنِ، ثُمَّ يَشُدُّ الْحَبْلَ لِيَرْفَعَهُ صَدِيقُهُ إِلَى السَّطْحِ.", "فِي الْمَسَاءِ يَفْتَحُ الْبَحَّارَةُ الْمَحَارَ وَيَبْحَثُونَ عَنِ اللُّؤْلُؤِ بِصَبْرٍ وَأَمَلٍ كَبِيرٍ.", "لَمْ يَكُنِ الْعَمَلُ سَهْلًا، لَكِنَّ الْغَوَّاصِينَ كَانُوا يُرَدِّدُونَ الْأَهَازِيجَ مَعًا لِيَنْسَوْا التَّعَبَ.", "الْيَوْمَ نَتَذَكَّرُ هَؤُلَاءِ الرِّجَالَ لِأَنَّهُمْ عَلَّمُونَا مَعْنَى الصَّبْرِ وَالتَّعَاوُنِ."], ["فِي الْعُطْلَةِ سَافَرَتْ عَائِلَةُ مَهَا إِلَى جَبَلِ جَيْسٍ.", "كَانَ الطَّرِيقُ يَصْعَدُ وَيَلْتَفُّ بَيْنَ الصُّخُورِ، وَكُلَّمَا ارْتَفَعَتِ السَّيَّارَةُ صَارَ الْهَوَاءُ أَبْرَدَ.", "عِنْدَمَا وَصَلُوا إِلَى الْقِمَّةِ نَظَرَتْ مَهَا إِلَى الْأَسْفَلِ فَرَأَتِ الْغُيُومَ تَحْتَهَا كَأَنَّهَا بَحْرٌ أَبْيَضُ.", "اقْتَرَحَ أَخُوهَا حَمْدَانُ أَنْ يَمْشُوا فِي الْمَمَرِّ الْجَبَلِيِّ، فَوَافَقَ الْأَبُ بِشَرْطِ أَنْ يَحْمِلُوا الْمَاءَ وَيَبْقَوْا مَعًا.", "فِي مُنْتَصَفِ الطَّرِيقِ تَعِبَ حَمْدَانُ وَأَرَادَ أَنْ يَعُودَ، لَكِنَّ مَهَا شَجَّعَتْهُ قَائِلَةً: «بَقِيَ الْقَلِيلُ، وَالْمَنْظَرُ مِنْ فَوْقُ يَسْتَحِقُّ التَّعَبَ.» وَاصَلَا الْمَشْيَ حَتَّى وَصَلَا إِلَى نُقْطَةٍ عَالِيَةٍ تَرَى مِنْهَا الْوَادِيَ.", "جَلَسَا هُنَاكَ يَشْرَبَانِ الْمَاءَ وَيَشْعُرَانِ بِأَنَّهُمَا حَقَّقَا شَيْئًا كَبِيرًا."], ["بَعْدَ لَيْلَةٍ مِنَ الْمَطَرِ تَتَغَيَّرُ الصَّحْرَاءُ.", "تُصْبِحُ الرِّمَالُ دَاكِنَةً وَمُتَمَاسِكَةً، وَتَبْقَى عَلَيْهَا آثَارُ أَقْدَامِ الطُّيُورِ كَأَنَّهَا كِتَابَةٌ صَغِيرَةٌ.", "بَعْدَ أَيَّامٍ قَلِيلَةٍ تَظْهَرُ نَبَاتَاتٌ خَضْرَاءُ بَيْنَ الْكُثْبَانِ، وَتَتَفَتَّحُ زُهُورٌ صَفْرَاءُ وَبَنَفْسَجِيَّةٌ لَمْ يَكُنْ أَحَدٌ يَتَوَقَّعُهَا.", "يَخْرُجُ الضَّبُّ مِنْ جُحْرِهِ لِيَسْتَمْتِعَ بِالشَّمْسِ الدَّافِئَةِ، وَتَطِيرُ الْفَرَاشَاتُ فَوْقَ الْأَعْشَابِ.", "فِي الصَّبَاحِ تَكُونُ رَائِحَةُ الْأَرْضِ الْمُبَلَّلَةِ أَجْمَلَ مِنْ أَيِّ عِطْرٍ.", "وَفِي الْمَسَاءِ تَمْتَلِئُ بِرْكَةٌ صَغِيرَةٌ بِالْمَاءِ فَتَأْتِي إِلَيْهَا الْجِمَالُ لِتَشْرَبَ بِهُدُوءٍ.", "يَقُولُ جَدِّي إِنَّ الصَّحْرَاءَ لَيْسَتْ مَكَانًا مَيِّتًا، بَلْ هِيَ تَنَامُ وَتَنْتَظِرُ قَطْرَةَ مَاءٍ لِتَسْتَيْقِظَ مِنْ جَدِيدٍ.", "مَنْ يَزُورُهَا فِي هَذَا الْوَقْتِ يَفْهَمُ لِمَاذَا أَحَبَّهَا أَجْدَادُنَا."], ["الطَّائِرَةُ الْمُسَيَّرَةُ جِهَازٌ صَغِيرٌ يَطِيرُ دُونَ طَيَّارٍ بِدَاخِلِهِ، وَيَتَحَكَّمُ فِيهِ إِنْسَانٌ مِنَ الْأَرْضِ بِجِهَازِ تَحَكُّمٍ.", "لَهَا عَادَةً أَرْبَعُ مَرَاوِحَ تَدُورُ بِسُرْعَةٍ، فَتَدْفَعُ الْهَوَاءَ إِلَى الْأَسْفَلِ وَتَرْفَعُ الطَّائِرَةَ إِلَى الْأَعْلَى.", "إِذَا دَارَتِ الْمَرَاوِحُ الْأَمَامِيَّةُ أَبْطَأَ مِنَ الْخَلْفِيَّةِ تَمِيلُ الطَّائِرَةُ وَتَتَقَدَّمُ إِلَى الْأَمَامِ.", "تَحْمِلُ الطَّائِرَةُ كَامِيرَا صَغِيرَةً تُصَوِّرُ مِنْ فَوْقُ، لِذَلِكَ يَسْتَعْمِلُهَا الْمُهَنْدِسُونَ لِفَحْصِ الْمَبَانِي الْعَالِيَةِ، وَيَسْتَعْمِلُهَا الْمُزَارِعُونَ لِمُرَاقَبَةِ النَّخِيلِ.", "وَفِي بِلَادِنَا تُسْتَخْدَمُ لِتَوْصِيلِ الْأَدْوِيَةِ إِلَى الْأَمَاكِنِ الْبَعِيدَةِ.", "لَكِنْ يَجِبُ أَنْ نَتَذَكَّرَ أَنَّ لِلطَّيَرَانِ قَوَانِينَ، فَلَا نُطَيِّرُهَا قُرْبَ الْمَطَارِ أَوْ فَوْقَ النَّاسِ.", "مَنْ يَتَعَلَّمُ هَذِهِ الْقَوَاعِدَ يَصِيرُ طَيَّارًا مَسْؤُولًا حَتَّى لَوْ بَقِيَتْ قَدَمَاهُ عَلَى الْأَرْضِ."], ["عِنْدَمَا سَافَرَ وَالِدُ سَالِمٍ لِمُدَّةِ أُسْبُوعٍ، قَالَ لَهُ قَبْلَ أَنْ يَخْرُجَ: «أَنْتَ الْآنَ مَسْؤُولٌ عَنْ حَدِيقَةِ الْبَيْتِ، فَلَا تَنْسَ النَّخْلَةَ الصَّغِيرَةَ.» فِي الْيَوْمِ الْأَوَّلِ سَقَى سَالِمٌ النَّبَاتَاتِ كُلَّهَا بِحَمَاسٍ.", "لَكِنْ فِي الْيَوْمِ الثَّالِثِ دَعَاهُ أَصْدِقَاؤُهُ إِلَى لَعِبِ كُرَةِ الْقَدَمِ، فَنَسِيَ الْحَدِيقَةَ تَمَامًا.", "فِي الْمَسَاءِ رَأَى أَوْرَاقَ النَّخْلَةِ وَقَدْ بَدَأَتْ تَذْبُلُ، فَشَعَرَ بِالْخَجَلِ.", "أَحْضَرَ الْمَاءَ بِسُرْعَةٍ، وَكَتَبَ عَلَى وَرَقَةٍ عَلَّقَهَا عَلَى بَابِ غُرْفَتِهِ: «السَّقْيُ أَوَّلًا، ثُمَّ اللَّعِبُ.» عِنْدَمَا عَادَ الْأَبُ وَجَدَ الْحَدِيقَةَ خَضْرَاءَ، فَقَالَ مُبْتَسِمًا: «الْمَسْؤُولِيَّةُ لَيْسَتْ كَلِمَةً نَقُولُهَا، بَلْ عَمَلٌ نُكَرِّرُهُ كُلَّ يَوْمٍ.» أَخْبَرَهُ سَالِمٌ بِصِدْقٍ عَنْ يَوْمِ النِّسْيَانِ، فَقَالَ: «الِاعْتِرَافُ بِالْخَطَأِ هُوَ بِدَايَةُ الْمَسْؤُولِيَّةِ.»"], ["اسْتَيْقَظَ عُمَرُ قَبْلَ الْفَجْرِ لِيُرَافِقَ عَمَّهُ إِلَى مِضْمَارِ سِبَاقِ الْهُجُنِ الَّذِي يَقَعُ عَلَى أَطْرَافِ الْمَدِينَةِ.", "كَانَ الْجَوُّ بَارِدًا، وَالْجِمَالُ تَقِفُ فِي صَفٍّ طَوِيلٍ كَأَنَّهَا تَنْتَظِرُ إِشَارَةَ الْبَدْءِ.", "شَرَحَ الْعَمُّ لِعُمَرَ أَنَّ الرَّاكِبَ الصَّغِيرَ الَّذِي يَجْلِسُ عَلَى ظَهْرِ الْجَمَلِ رُوبُوتٌ خَفِيفٌ يُوَجِّهُهُ الْمُدَرِّبُ عَنْ بُعْدٍ.", "عِنْدَمَا انْطَلَقَ السِّبَاقُ ارْتَفَعَ الْغُبَارُ كَسَحَابَةٍ ذَهَبِيَّةٍ، وَرَكَضَتِ السَّيَّارَاتُ بِجَانِبِ الْمِضْمَارِ يُشَجِّعُ أَصْحَابُهَا جِمَالَهُمْ.", "لَمْ يَفُزْ جَمَلُ الْعَمِّ، لَكِنَّهُ أَكْمَلَ السِّبَاقَ دُونَ أَنْ يَتَوَقَّفَ.", "قَالَ الْعَمُّ: «الْجَمَلُ الَّذِي يُكْمِلُ الطَّرِيقَ يَتَعَلَّمُ أَكْثَرَ مِنَ الْجَمَلِ الَّذِي يَفُوزُ مَرَّةً ثُمَّ يَتْعَبُ.» حَفِظَ عُمَرُ هَذِهِ الْجُمْلَةَ لِأَنَّهُ شَعَرَ أَنَّهَا عَنْهُ أَيْضًا."], ["تُعَدُّ النَّخْلَةُ مِنْ أَقْدَمِ الْأَشْجَارِ الَّتِي زَرَعَهَا الْإِنْسَانُ، وَقَدْ أَحَبَّهَا أَهْلُ الْإِمَارَاتِ لِأَنَّهَا تَعِيشُ فِي الْحَرِّ الشَّدِيدِ وَتُعْطِي ثِمَارًا حُلْوَةً.", "تَمْتَدُّ جُذُورُ النَّخْلَةِ عَمِيقًا فِي الْأَرْضِ لِتَبْحَثَ عَنِ الْمَاءِ، بَيْنَمَا تَحْمِي سَعَفَاتُهَا الطَّوِيلَةُ الثِّمَارَ مِنْ أَشِعَّةِ الشَّمْسِ.", "فِي الرَّبِيعِ يَضَعُ الْمُزَارِعُ غُبَارَ اللِّقَاحِ بَيْنَ أَزْهَارِ النَّخْلَةِ، وَفِي الصَّيْفِ تَتَحَوَّلُ الْأَزْهَارُ إِلَى بَلَحٍ أَصْفَرَ ثُمَّ إِلَى تَمْرٍ.", "لَمْ يَكُنْ أَجْدَادُنَا يَأْكُلُونَ التَّمْرَ فَقَطْ، بَلْ كَانُوا يَبْنُونَ بُيُوتَهُمْ مِنَ الْجُذُوعِ وَالسَّعَفِ، وَيَصْنَعُونَ السِّلَالَ وَالْحِبَالَ مِنَ الْخُوصِ.", "لِذَلِكَ يُقَالُ إِنَّ النَّخْلَةَ شَجَرَةٌ كَرِيمَةٌ لَا تُبْقِي شَيْئًا لِنَفْسِهَا.", "إِذَا زَرَعْتَ نَخْلَةً الْيَوْمَ فَإِنَّ أَحْفَادَكَ سَيَأْكُلُونَ مِنْ ثَمَرِهَا بَعْدَ سَنَوَاتٍ."], ["تَقِفُ الْقَلْعَةُ الْقَدِيمَةُ وَسَطَ الْمَدِينَةِ كَحَارِسٍ صَامِتٍ يُرَاقِبُ الزَّمَنَ.", "جُدْرَانُهَا السَّمِيكَةُ مَبْنِيَّةٌ مِنَ الْحَجَرِ الْمَرْجَانِيِّ وَالطِّينِ، وَلَوْنُهَا يُشْبِهُ لَوْنَ الرِّمَالِ.", "فِي كُلِّ زَاوِيَةٍ يَرْتَفِعُ بُرْجٌ مُسْتَدِيرٌ لَهُ نَوَافِذُ ضَيِّقَةٌ كَانَ الْحُرَّاسُ يَنْظُرُونَ مِنْهَا إِلَى الْبَحْرِ وَالصَّحْرَاءِ.", "عِنْدَمَا تَدْخُلُ مِنَ الْبَابِ الْخَشَبِيِّ الضَّخْمِ تَشْعُرُ بِبُرُودَةٍ لَطِيفَةٍ، لِأَنَّ الْجُدْرَانَ تَحْبِسُ الْحَرَّ فِي الْخَارِجِ.", "فِي السَّاحَةِ الدَّاخِلِيَّةِ بِئْرٌ قَدِيمَةٌ وَنَخْلَتَانِ عَالِيَتَانِ يَسْتَرِيحُ الزُّوَّارُ تَحْتَ ظِلِّهِمَا.", "عَلَى الْجُدْرَانِ صُوَرٌ قَدِيمَةٌ لِلصَّيَّادِينَ وَالْغَوَّاصِينَ، وَفِي الْغُرَفِ الصَّغِيرَةِ أَدَوَاتٌ كَانَ النَّاسُ يَسْتَعْمِلُونَهَا قَبْلَ مِئَةِ سَنَةٍ.", "كُلَّمَا زُرْتُ الْقَلْعَةَ شَعَرْتُ أَنَّ الْحِجَارَةَ تَهْمِسُ لِي بِقِصَصٍ عَنْ أُنَاسٍ عَاشُوا هُنَا وَأَحَبُّوا هَذِهِ الْأَرْضَ قَبْلَ أَنْ أُولَدَ بِزَمَنٍ طَوِيلٍ."], ["كَانَتْ لَطِيفَةُ تُلَاحِظُ أَنَّ جَدَّتَهَا تَنْسَى مَوْعِدَ دَوَائِهَا أَحْيَانًا، فَقَرَّرَتْ أَنْ تَصْنَعَ لَهَا صُنْدُوقًا ذَكِيًّا يُذَكِّرُهَا بِالْمَوْعِدِ.", "بَدَأَتْ بِقِرَاءَةِ كُتُبٍ عَنِ الدَّوَائِرِ الْكَهْرَبَائِيَّةِ، ثُمَّ اشْتَرَتْ بِمَصْرُوفِهَا لَوْحَةً صَغِيرَةً وَجَرَسًا وَبَعْضَ الْأَسْلَاكِ.", "فِي الْأُسْبُوعِ الْأَوَّلِ تَعَطَّلَتْ لَوْحَتُهَا لِأَنَّهَا وَصَلَتِ الْأَسْلَاكَ بِشَكْلٍ خَاطِئٍ، فَحَزِنَتْ قَلِيلًا وَعَادَتْ إِلَى الْكِتَابِ.", "سَاعَدَهَا مُعَلِّمُ الْعُلُومِ عَلَى فَهْمِ الْخَطَأِ، وَبَعْدَ ثَلَاثِ مُحَاوَلَاتٍ رَنَّ الْجَرَسُ أَخِيرًا فِي السَّاعَةِ الثَّامِنَةِ تَمَامًا.", "عِنْدَمَا أَهْدَتِ الصُّنْدُوقَ لِجَدَّتِهَا، نَظَرَتِ الْجَدَّةُ إِلَيْهِ طَوِيلًا وَقَالَتْ بِصَوْتٍ مُتَأَثِّرٍ: «لَمْ يَصْنَعْ لِي أَحَدٌ شَيْئًا بِيَدَيْهِ مُنْذُ زَمَنٍ بَعِيدٍ.» فِي ذَلِكَ الْمَسَاءِ كَتَبَتْ لَطِيفَةُ فِي دَفْتَرِهَا: «الِاخْتِرَاعُ لَيْسَ لِلْمَشْهُورِينَ فَقَطْ، بَلْ لِكُلِّ مَنْ يَرَى مُشْكِلَةً وَيُقَرِّرُ أَنْ يَحُلَّهَا.»"], ["تَعِيشُ السَّلَاحِفُ الْبَحْرِيَّةُ فِي مِيَاهِ الْخَلِيجِ، وَهِيَ مِنْ أَقْدَمِ الْكَائِنَاتِ الَّتِي مَا زَالَتْ تَسْبَحُ فِي الْبِحَارِ.", "تَقْضِي السُّلَحْفَاةُ حَيَاتَهَا فِي الْمَاءِ، لَكِنَّهَا تَخْرُجُ إِلَى الشَّاطِئِ فِي لَيَالِي الصَّيْفِ لِتَحْفِرَ حُفْرَةً فِي الرَّمْلِ وَتَضَعَ فِيهَا بَيْضَهَا.", "بَعْدَ نَحْوِ شَهْرَيْنِ تَخْرُجُ الصِّغَارُ مِنَ الْبَيْضِ وَتَزْحَفُ نَحْوَ الْمَاءِ مُسْتَعِينَةً بِضَوْءِ الْقَمَرِ.", "لِذَلِكَ يَطْلُبُ الْعُلَمَاءُ مِنَ النَّاسِ إِطْفَاءَ الْأَضْوَاءِ الْقَوِيَّةِ فِي تِلْكَ اللَّيَالِي، حَتَّى لَا تَضِلَّ الصِّغَارُ طَرِيقَهَا.", "الْأَمْرُ الْمُدْهِشُ أَنَّ السُّلَحْفَاةَ تَعُودُ بَعْدَ سَنَوَاتٍ إِلَى الشَّاطِئِ نَفْسِهِ الَّذِي وُلِدَتْ فِيهِ لِتَضَعَ بَيْضَهَا هُنَاكَ.", "تَعْمَلُ جَمْعِيَّاتٌ فِي الْإِمَارَاتِ عَلَى حِمَايَةِ هَذِهِ الْكَائِنَاتِ، وَتُعَالِجُ السَّلَاحِفَ الْمَرِيضَةَ ثُمَّ تُطْلِقُهَا فِي الْبَحْرِ مِنْ جَدِيدٍ.", "إِذَا رَأَيْتَ سُلَحْفَاةً عَلَى الشَّاطِئِ فَلَا تَقْتَرِبْ مِنْهَا، بَلْ رَاقِبْهَا مِنْ بَعِيدٍ."], ["وَصَلَ فَرِيقُ مَدْرَسَتِنَا إِلَى مُسَابَقَةِ الرُّوبُوتَاتِ وَهُوَ مُتَحَمِّسٌ، لَكِنَّ الْحَمَاسَ تَبَخَّرَ عِنْدَمَا سَقَطَ الرُّوبُوتُ مِنَ الطَّاوِلَةِ قَبْلَ الْجَوْلَةِ الْأُولَى بِدَقَائِقَ، وَتَعَطَّلَتْ إِحْدَى عَجَلَاتِهِ.", "نَظَرَ أَعْضَاءُ الْفَرِيقِ بَعْضُهُمْ إِلَى بَعْضٍ بِوُجُوهٍ شَاحِبَةٍ.", "قَالَ مَاجِدٌ: «لَقَدِ انْتَهَى الْأَمْرُ، لَنْ نَسْتَطِيعَ الْمُشَارَكَةَ.» لَكِنَّ هِنْدَ أَخْرَجَتْ مِنْ حَقِيبَتِهَا عَجَلَةً قَدِيمَةً كَانَتْ قَدِ احْتَفَظَتْ بِهَا مِنْ مَشْرُوعِ الْعَامِ الْمَاضِي، وَقَالَتْ: «لَدَيْنَا عَشْرُ دَقَائِقَ، وَهَذَا يَكْفِي إِذَا عَمِلْنَا مَعًا.» أَمْسَكَ مَاجِدٌ الْمِفَكَّ، وَثَبَّتَ سُلْطَانُ الْعَجَلَةَ، بَيْنَمَا رَاجَعَتْ هِنْدُ الْبَرْنَامَجَ عَلَى الْحَاسُوبِ.", "عِنْدَمَا نَادَى الْحَكَمُ عَلَى اسْمِ الْفَرِيقِ كَانَ الرُّوبُوتُ يَتَحَرَّكُ.", "لَمْ يَحْصُلُوا عَلَى الْمَرْكَزِ الْأَوَّلِ، لَكِنَّ لَجْنَةَ التَّحْكِيمِ مَنَحَتْهُمْ جَائِزَةَ رُوحِ الْفَرِيقِ.", "فِي طَرِيقِ الْعَوْدَةِ قَالَ مَاجِدٌ وَهُوَ يَضْحَكُ: «فِي الْعَامِ الْقَادِمِ سَأُحْضِرُ عَجَلَاتٍ احْتِيَاطِيَّةً تَكْفِي لِعَشَرَةِ رُوبُوتَاتٍ!»"], ["عِنْدَمَا تَغِيبُ الشَّمْسُ خَلْفَ الْكُثْبَانِ تَتَحَوَّلُ الصَّحْرَاءُ إِلَى عَالَمٍ آخَرَ لَا يَعْرِفُهُ إِلَّا مَنْ قَضَى فِيهَا لَيْلَةً كَامِلَةً.", "يَبْرُدُ الرَّمْلُ بِسُرْعَةٍ بَعْدَ أَنْ كَانَ يَحْرِقُ الْأَقْدَامَ فِي النَّهَارِ، وَتَهْدَأُ الرِّيحُ حَتَّى تَسْمَعَ صَوْتَ أَنْفَاسِكَ.", "فِي الْمُخَيَّمِ يَشْتَعِلُ الْحَطَبُ وَتَرْقُصُ أَلْسِنَةُ النَّارِ، فَتَرْسُمُ عَلَى الْوُجُوهِ ظِلَالًا ذَهَبِيَّةً.", "تَجْلِسُ الْعَائِلَةُ فِي دَائِرَةٍ، وَيَسْكُبُ الْجَدُّ الْقَهْوَةَ فِي فَنَاجِينَ صَغِيرَةٍ بَيْنَمَا يَحْكِي عَنْ أَيَّامِ الْقَوَافِلِ.", "فَوْقَ الرُّؤُوسِ تَمْتَدُّ السَّمَاءُ كَبِسَاطٍ أَسْوَدَ مُرَصَّعٍ بِآلَافِ النُّجُومِ الَّتِي لَا نَرَاهَا فِي الْمَدِينَةِ.", "بَيْنَ حِينٍ وَآخَرَ يَمُرُّ شِهَابٌ فَيُشِيرُ الصِّغَارُ إِلَيْهِ بِدَهْشَةٍ وَيَقُولُونَ: سُبْحَانَ اللَّهِ!", "بَعِيدًا عَنِ الضَّوْءِ يَظْهَرُ ثَعْلَبُ الرِّمَالِ بِأُذُنَيْهِ الْكَبِيرَتَيْنِ، يَنْظُرُ لَحْظَةً ثُمَّ يَخْتَفِي كَأَنَّهُ خَيَالٌ.", "وَعِنْدَمَا يَنَامُ الْجَمِيعُ يَبْقَى الْقَمَرُ وَحْدَهُ حَارِسًا عَلَى الْخِيَامِ حَتَّى يُعْلِنَ الْفَجْرُ بِدَايَةَ يَوْمٍ جَدِيدٍ."], ["الْمِرِّيخُ كَوْكَبٌ أَحْمَرُ يَبْعُدُ عَنِ الْأَرْضِ مَلَايِينَ الْكِيلُومِتْرَاتِ.", "قَرَّرَتْ دَوْلَةُ الْإِمَارَاتِ أَنْ تَكُونَ جُزْءًا مِنْ هَذَا الْحُلْمِ، فَعَمِلَ فَرِيقٌ مِنَ الْمُهَنْدِسِينَ الشَّبَابِ سَنَوَاتٍ عَلَى بِنَاءِ مِسْبَارٍ أُطْلِقَ عَلَيْهِ اسْمُ «مِسْبَارِ الْأَمَلِ».", "الْمِسْبَارُ لَيْسَ مَرْكَبَةً تَحْمِلُ بَشَرًا، بَلْ هُوَ جِهَازٌ مُزَوَّدٌ بِكَامِيرَاتٍ وَأَدَوَاتِ قِيَاسٍ يَدُورُ حَوْلَ الْكَوْكَبِ وَيُرْسِلُ الْمَعْلُومَاتِ إِلَى الْأَرْضِ.", "اسْتَغْرَقَتْ رِحْلَتُهُ أَكْثَرَ مِنْ سِتَّةِ أَشْهُرٍ فِي الْفَضَاءِ الْبَارِدِ قَبْلَ أَنْ يَصِلَ إِلَى مَدَارِ الْمِرِّيخِ.", "وَلِأَنَّ الْإِشَارَةَ تَحْتَاجُ إِلَى دَقَائِقَ لِتَقْطَعَ الْمَسَافَةَ، كَانَ عَلَى الْمِسْبَارِ أَنْ يَتَّخِذَ بَعْضَ الْقَرَارَاتِ بِنَفْسِهِ.", "يَدْرُسُ الْمِسْبَارُ الْغِلَافَ الْجَوِّيَّ لِلْمِرِّيخِ وَيُسَاعِدُ الْعُلَمَاءَ عَلَى فَهْمِ سَبَبِ اخْتِفَاءِ الْمَاءِ مِنْ سَطْحِهِ.", "أَهَمُّ مَا فِي الْقِصَّةِ أَنَّ كَثِيرًا مِنْ أَعْضَاءِ الْفَرِيقِ شَبَابٌ تَخَرَّجُوا قَبْلَ سَنَوَاتٍ قَلِيلَةٍ، فَمَنْ يَدْرِي، رُبَّمَا يَكُونُ أَحَدُ قُرَّاءِ هَذَا النَّصِّ مُهَنْدِسَ الرِّحْلَةِ الْقَادِمَةِ."], ["فِي وَرْشَةٍ عَلَى شَاطِئِ الْخَوْرِ كَانَ جَدُّ حَمَدٍ يَبْنِي السُّفُنَ الْخَشَبِيَّةَ مُنْذُ خَمْسِينَ عَامًا.", "فِي الصَّيْفِ الْمَاضِي طَلَبَ مِنْ حَمَدٍ أَنْ يُسَاعِدَهُ فِي بِنَاءِ سَفِينَةٍ جَدِيدَةٍ، فَوَافَقَ وَهُوَ يَظُنُّ أَنَّ الْعَمَلَ سَيَنْتَهِي فِي أَيَّامٍ.", "لَكِنَّ الْجَدَّ بَدَأَ بِتَعْلِيمِهِ كَيْفَ يَخْتَارُ الْخَشَبَ مِنْ لَوْنِهِ وَرَائِحَتِهِ، وَكَيْفَ يَثْنِي الْأَلْوَاحَ بِالْبُخَارِ دُونَ أَنْ تَنْكَسِرَ.", "مَرَّتْ أَسَابِيعُ وَلَمْ يَظْهَرْ مِنَ السَّفِينَةِ سِوَى هَيْكَلٍ يُشْبِهُ أَضْلَاعَ سَمَكَةٍ، فَقَالَ حَمَدٌ بِمَلَلٍ: «لَوِ اشْتَرَيْنَا قَارِبًا جَاهِزًا لَكَانَ أَسْرَعَ.» لَمْ يَغْضَبِ الْجَدُّ، بَلْ أَخَذَهُ إِلَى الشَّاطِئِ وَأَشَارَ إِلَى سَفِينَةٍ قَدِيمَةٍ وَقَالَ: «بَنَيْتُهَا قَبْلَ أَنْ يُولَدَ أَبُوكَ، مَا تَصْنَعُهُ بِصَبْرٍ يَبْقَى مَعَكَ أَطْوَلَ مِمَّا تَشْتَرِيهِ بِسُرْعَةٍ.» عَادَ حَمَدٌ إِلَى الْوَرْشَةِ بِرُوحٍ مُخْتَلِفَةٍ.", "وَعِنْدَمَا نَزَلَتِ السَّفِينَةُ إِلَى الْمَاءِ، وَقَفَ عَلَى ظَهْرِهَا وَشَعَرَ أَنَّ الْخَشَبَ تَحْتَ قَدَمَيْهِ يَحْكِي قِصَّةَ صَبْرِهِ أَيْضًا."], ["فِي يَوْمِ الْجُمُعَةِ وَجَدَ يُوسُفُ هَاتِفًا صَغِيرًا عَلَى مَقْعَدٍ فِي الْحَدِيقَةِ.", "نَظَرَ حَوْلَهُ طَوِيلًا فَلَمْ يَرَ أَحَدًا.", "قَالَ لِنَفْسِهِ: «صَاحِبُ الْهَاتِفِ سَيَكُونُ حَزِينًا.» حَمَلَ يُوسُفُ الْهَاتِفَ وَذَهَبَ إِلَى حَارِسِ الْحَدِيقَةِ.", "بَعْدَ قَلِيلٍ جَاءَ رَجُلٌ يَبْحَثُ عَنْ هَاتِفِهِ بِقَلَقٍ.", "أَعْطَاهُ الْحَارِسُ الْهَاتِفَ، فَشَكَرَ الرَّجُلُ يُوسُفَ وَقَالَ لَهُ: «أَنْتَ وَلَدٌ أَمِينٌ.» عَادَ يُوسُفُ إِلَى بَيْتِهِ سَعِيدًا بِمَا فَعَلَ."], ["السُّلَحْفَاةُ الْبَحْرِيَّةُ حَيَوَانٌ هَادِئٌ يَعِيشُ فِي الْبَحْرِ.", "لَهَا دِرْعٌ صُلْبٌ عَلَى ظَهْرِهَا يَحْمِي جِسْمَهَا.", "تَسْبَحُ السُّلَحْفَاةُ بِزَعَانِفِهَا مَسَافَاتٍ طَوِيلَةً، وَتَأْكُلُ الْأَعْشَابَ الْبَحْرِيَّةَ.", "فِي اللَّيْلِ تَخْرُجُ الْأُمُّ إِلَى الشَّاطِئِ بِهُدُوءٍ، وَتَحْفِرُ حُفْرَةً فِي الرَّمْلِ، ثُمَّ تَضَعُ فِيهَا الْبَيْضَ وَتُغَطِّيهِ.", "بَعْدَ أَسَابِيعَ تَخْرُجُ السَّلَاحِفُ الصَّغِيرَةُ وَتَمْشِي بِسُرْعَةٍ نَحْوَ الْمَاءِ.", "فِي الْإِمَارَاتِ يَحْمِي النَّاسُ شَوَاطِئَ السَّلَاحِفِ حَتَّى تَبْقَى آمِنَةً دَائِمًا."], ["فِي الصَّبَاحِ الْبَاكِرِ يَمْتَلِئُ سُوقُ السَّمَكِ الْقَدِيمِ بِالنَّاسِ وَالْأَصْوَاتِ.", "تَصْطَفُّ الْأَسْمَاكُ اللَّامِعَةُ عَلَى الثَّلْجِ الْأَبْيَضِ، كَبِيرَةٌ وَصَغِيرَةٌ، فِضِّيَّةٌ وَزَرْقَاءُ.", "يُنَادِي الْبَائِعُونَ بِأَصْوَاتٍ عَالِيَةٍ، وَيَخْتَارُ الْآبَاءُ وَالْأُمَّهَاتُ السَّمَكَ الطَّازَجَ.", "رَائِحَةُ الْبَحْرِ الْمَالِحَةُ تَمْلَأُ الْمَكَانَ، وَالْأَرْضُ مُبَلَّلَةٌ بِالْمَاءِ.", "فِي الزَّاوِيَةِ يَجْلِسُ رَجُلٌ عَجُوزٌ طَيِّبٌ يُنَظِّفُ السَّمَكَ بِمَهَارَةٍ وَيَبْتَسِمُ لِلزَّبَائِنِ.", "يُحِبُّ سَالِمٌ زِيَارَةَ السُّوقِ مَعَ جَدِّهِ كُلَّ يَوْمِ جُمُعَةٍ، لِأَنَّهُ يَتَعَلَّمُ هُنَاكَ أَسْمَاءَ الْأَسْمَاكِ."], ["فِي يَوْمِ الْمُبَارَاةِ الْكَبِيرَةِ كَانَ فَرِيقُ الصَّفِّ الْخَامِسِ مُتَحَمِّسًا جِدًّا.", "بَدَأَتِ الْمُبَارَاةُ، وَسَجَّلَ الْفَرِيقُ الْآخَرُ نُقْطَتَيْنِ بِسُرْعَةٍ.", "قَالَ الْقَائِدُ أَحْمَدُ: «لَا تَقْلَقُوا يَا أَصْدِقَائِي، سَنَلْعَبُ مَعًا وَنُمَرِّرُ الْكُرَةَ.» مَرَّرَ أَحْمَدُ الْكُرَةَ إِلَى صَدِيقِهِ مَاجِدٍ، فَقَفَزَ مَاجِدٌ وَرَمَى الْكُرَةَ فِي السَّلَّةِ.", "صَاحَ التَّلَامِيذُ فَرَحًا فِي الْمَلْعَبِ.", "فِي النِّهَايَةِ فَازَ فَرِيقُ الْخَامِسِ، وَصَافَحَ اللَّاعِبُونَ جَمِيعًا الْفَرِيقَ الْآخَرَ بِاحْتِرَامٍ.", "قَالَ الْمُعَلِّمُ: «التَّعَاوُنُ الْجَمِيلُ هُوَ سِرُّ الْفَوْزِ.»"], ["النَّحْلَةُ حَشَرَةٌ صَغِيرَةٌ لَكِنَّهَا نَشِيطَةٌ جِدًّا.", "تَطِيرُ النَّحْلَةُ فِي الصَّبَاحِ مِنْ زَهْرَةٍ إِلَى زَهْرَةٍ وَتَجْمَعُ الرَّحِيقَ الْحُلْوَ.", "ثُمَّ تَعُودُ إِلَى الْخَلِيَّةِ وَتَضَعُ الرَّحِيقَ بِعِنَايَةٍ فِي بُيُوتٍ صَغِيرَةٍ مِنَ الشَّمْعِ.", "بَعْدَ أَيَّامٍ يَتَحَوَّلُ الرَّحِيقُ إِلَى عَسَلٍ لَذِيذٍ.", "يَعِيشُ فِي الْخَلِيَّةِ آلَافُ النَّحْلِ، وَلِكُلِّ نَحْلَةٍ عَمَلٌ خَاصٌّ.", "بَعْضُهَا يَجْمَعُ الرَّحِيقَ، وَبَعْضُهَا يَحْرُسُ بَابَ الْخَلِيَّةِ، وَبَعْضُهَا يُنَظِّفُ الْبُيُوتَ.", "يُرَبِّي الْمُزَارِعُونَ النَّحْلَ فِي جِبَالِ الْإِمَارَاتِ وَيَبِيعُونَ عَسَلَهُ فِي الْأَسْوَاقِ."], ["فِي بِدَايَةِ الْفَصْلِ أَعْطَتِ الْمُعَلِّمَةُ كُلَّ تِلْمِيذٍ بَذْرَةً صَغِيرَةً سَوْدَاءَ وَقَالَتْ: «ازْرَعُوهَا فِي الْبَيْتِ وَاعْتَنُوا بِهَا.» وَضَعَتْ مَرْيَمُ الْبَذْرَةَ فِي إِنَاءٍ مِنَ التُّرَابِ وَسَقَتْهَا بِالْمَاءِ كُلَّ صَبَاحٍ.", "مَرَّتْ أَيَّامٌ وَلَمْ يَظْهَرْ شَيْءٌ.", "حَزِنَتْ مَرْيَمُ قَلِيلًا، لَكِنَّهَا لَمْ تَتْرُكِ الْإِنَاءَ.", "فِي الْأُسْبُوعِ الثَّانِي رَأَتْ وَرَقَةً خَضْرَاءَ صَغِيرَةً تَخْرُجُ مِنَ التُّرَابِ.", "صَاحَتْ مَرْيَمُ: «نَبَتَتْ!", "نَبَتَتْ!» حَمَلَتِ الْإِنَاءَ إِلَى الْمَدْرَسَةِ بِحَذَرٍ شَدِيدٍ، فَقَالَتِ الْمُعَلِّمَةُ: «الصَّبْرُ يَصْنَعُ الْعَجَائِبَ دَائِمًا يَا مَرْيَمُ.»"], ["تَقِفُ الْقَلْعَةُ الْقَدِيمَةُ عَلَى تَلٍّ صَغِيرٍ قُرْبَ الْبَحْرِ.", "جُدْرَانُهَا عَالِيَةٌ وَسَمِيكَةٌ، وَلَوْنُهَا مِثْلُ لَوْنِ الرَّمْلِ.", "فِي كُلِّ زَاوِيَةٍ بُرْجٌ مُسْتَدِيرٌ لَهُ نَوَافِذُ ضَيِّقَةٌ، كَانَ الْحُرَّاسُ يَنْظُرُونَ مِنْهَا إِلَى الْبَحْرِ وَالصَّحْرَاءِ.", "فِي الدَّاخِلِ سَاحَةٌ وَاسِعَةٌ فِيهَا بِئْرٌ قَدِيمَةٌ وَنَخْلَتَانِ طَوِيلَتَانِ.", "الْأَبْوَابُ مَصْنُوعَةٌ مِنْ خَشَبٍ ثَقِيلٍ وَعَلَيْهَا مَسَامِيرُ كَبِيرَةٌ.", "عِنْدَمَا تَدْخُلُ الْقَلْعَةَ تَشْعُرُ بِالْهُدُوءِ، وَتَسْمَعُ صَوْتَ الرِّيحِ بَيْنَ الْجُدْرَانِ.", "يَزُورُ التَّلَامِيذُ الْقَلْعَةَ مَعَ مُعَلِّمِيهِمْ كُلَّ عَامٍ لِيَتَعَلَّمُوا كَيْفَ عَاشَ أَجْدَادُهُمْ قَبْلَ زَمَنٍ طَوِيلٍ."], ["فِي الْعُطْلَةِ كَانَتْ لَطِيفَةُ تُسَافِرُ بِالطَّائِرَةِ لِأَوَّلِ مَرَّةٍ لِتَزُورَ جَدَّتَهَا.", "فِي الْمَطَارِ أَمْسَكَتْ بِيَدِ أُمِّهَا وَنَظَرَتْ إِلَى الطَّائِرَاتِ الْكَبِيرَةِ مِنْ خَلْفِ الزُّجَاجِ.", "عِنْدَمَا صَعِدَتْ إِلَى الطَّائِرَةِ جَلَسَتْ قُرْبَ النَّافِذَةِ وَرَبَطَتِ الْحِزَامَ.", "تَحَرَّكَتِ الطَّائِرَةُ بِبُطْءٍ، ثُمَّ أَسْرَعَتْ وَارْتَفَعَتْ فِي السَّمَاءِ.", "نَظَرَتْ لَطِيفَةُ إِلَى الْأَسْفَلِ فَرَأَتِ الْبُيُوتَ صَغِيرَةً مِثْلَ عُلَبٍ مُلَوَّنَةٍ، وَالْبَحْرَ أَزْرَقَ لَامِعًا.", "قَدَّمَتِ الْمُضِيفَةُ عَصِيرًا وَبِسْكَوِيتًا لَذِيذًا.", "بَعْدَ سَاعَتَيْنِ هَبَطَتِ الطَّائِرَةُ بِهُدُوءٍ.", "قَالَتْ لَطِيفَةُ لِأُمِّهَا: «كَانَتْ رِحْلَةً رَائِعَةً، أُرِيدُ أَنْ أُسَافِرَ مَرَّةً أُخْرَى!»"], ["قَبْلَ زَمَنٍ طَوِيلٍ كَانَ أَهْلُ الْإِمَارَاتِ يَخْرُجُونَ إِلَى الْبَحْرِ فِي سُفُنٍ خَشَبِيَّةٍ لِصَيْدِ اللُّؤْلُؤِ.", "كَانَتِ الرِّحْلَةُ تَسْتَمِرُّ شُهُورًا طَوِيلَةً فِي الصَّيْفِ.", "يَرْبِطُ الْغَوَّاصُ حَجَرًا بِرِجْلِهِ لِيَنْزِلَ بِسُرْعَةٍ إِلَى قَاعِ الْبَحْرِ، وَيَضَعُ عَلَى أَنْفِهِ قِطْعَةً صَغِيرَةً حَتَّى لَا يَدْخُلَ الْمَاءُ.", "يَجْمَعُ الْغَوَّاصُ الْمَحَارَ فِي كِيسٍ، ثُمَّ يَشُدُّ الْحَبْلَ، فَيَرْفَعُهُ صَدِيقُهُ إِلَى السَّفِينَةِ.", "فِي الْمَسَاءِ يَفْتَحُ الرِّجَالُ الْمَحَارَ وَيَبْحَثُونَ عَنِ اللُّؤْلُؤِ وَهُمْ يُرَدِّدُونَ الْأَهَازِيجَ.", "كَانَ الْعَمَلُ صَعْبًا، لَكِنَّ الرِّجَالَ كَانُوا أَقْوِيَاءَ وَصَبُورِينَ.", "الْيَوْمَ نَتَذَكَّرُ هَذِهِ الْأَيَّامَ بِفَخْرٍ."], ["فِي مُبَارَاةِ الْمَدْرَسَةِ وَقَفَ رَاشِدٌ فِي الْمَرْمَى لِأَوَّلِ مَرَّةٍ.", "كَانَ قَلْبُهُ يَدُقُّ بِسُرْعَةٍ، لَكِنَّهُ تَذَكَّرَ كَلَامَ الْمُدَرِّبِ: «رَاقِبِ الْكُرَةَ وَلَا تَنْظُرْ إِلَى الْجُمْهُورِ.» جَاءَتِ الْكُرَةُ الْأُولَى بِسُرْعَةٍ نَحْوَ الزَّاوِيَةِ، فَقَفَزَ رَاشِدٌ وَأَمْسَكَهَا بِيَدَيْهِ.", "صَفَّقَ زُمَلَاؤُهُ، وَصَاحَ الْجُمْهُورُ بِاسْمِهِ.", "ثُمَّ جَاءَتْ كُرَةٌ ثَانِيَةٌ فَأَبْعَدَهَا بِقَدَمِهِ قَبْلَ أَنْ تَدْخُلَ.", "فِي نِهَايَةِ الْمُبَارَاةِ فَازَ فَرِيقُهُ بِهَدَفٍ وَاحِدٍ، وَقَالَ الْمُدَرِّبُ: «لَمْ تَفُزْ بِالْقُوَّةِ فَقَطْ، بَلْ بِالتَّرْكِيزِ وَالْهُدُوءِ.» عَادَ رَاشِدٌ إِلَى الْبَيْتِ وَهُوَ يَشْعُرُ بِالْفَخْرِ، وَقَرَّرَ أَنْ يَتَدَرَّبَ أَكْثَرَ فِي الْأُسْبُوعِ الْقَادِمِ."], ["الطَّائِرَةُ الْمُسَيَّرَةُ جِهَازٌ صَغِيرٌ يَطِيرُ بِلَا طَيَّارٍ فِي دَاخِلِهِ.", "لَهَا أَرْبَعُ مَرَاوِحَ تَدُورُ بِسُرْعَةٍ كَبِيرَةٍ، فَتَدْفَعُ الْهَوَاءَ إِلَى الْأَسْفَلِ وَتَرْفَعُ الْجِهَازَ إِلَى الْأَعْلَى.", "يَتَحَكَّمُ الشَّخْصُ فِيهَا بِجِهَازٍ صَغِيرٍ فِي يَدِهِ، وَيَرَى مَا تُصَوِّرُهُ عَلَى شَاشَةٍ أَمَامَهُ.", "تُسْتَخْدَمُ الطَّائِرَةُ الْمُسَيَّرَةُ فِي تَصْوِيرِ الْمُدُنِ مِنْ فَوْقُ، وَفِي مُرَاقَبَةِ الْمَزَارِعِ، وَفِي الْبَحْثِ عَنِ الْمَفْقُودِينَ فِي الصَّحْرَاءِ.", "لَكِنَّ الطَّيَرَانَ بِهَا يَحْتَاجُ إِلَى حَذَرٍ، لِأَنَّهَا قَدْ تَسْقُطُ إِذَا ضَعُفَتْ بَطَّارِيَّتُهَا.", "لِذَلِكَ يَتَعَلَّمُ الطَّيَّارُ الصَّغِيرُ قَوَاعِدَ السَّلَامَةِ أَوَّلًا، ثُمَّ يُجَرِّبُ الطَّيَرَانَ فِي مَكَانٍ وَاسِعٍ وَآمِنٍ."], ["يَسْتَيْقِظُ السُّوقُ الْقَدِيمُ مَعَ أَوَّلِ ضَوْءٍ لِلشَّمْسِ.", "تُفْتَحُ الْأَبْوَابُ الْخَشَبِيَّةُ وَاحِدًا بَعْدَ الْآخَرِ، وَتَنْتَشِرُ رَائِحَةُ الْقَهْوَةِ وَالْهَيْلِ فِي الْمَمَرَّاتِ الضَّيِّقَةِ.", "عَلَى الْيَمِينِ دُكَّانٌ تَتَدَلَّى فِيهِ الْفَوَانِيسُ النُّحَاسِيَّةُ، وَعَلَى الْيَسَارِ أَكْيَاسُ التَّوَابِلِ بِأَلْوَانِهَا الْحَمْرَاءِ وَالصَّفْرَاءِ.", "يَجْلِسُ بَائِعٌ عَجُوزٌ أَمَامَ سِلَالٍ مِنَ التَّمْرِ، وَيُرَحِّبُ بِكُلِّ مَنْ يَمُرُّ بِابْتِسَامَةٍ وَاسِعَةٍ، وَتَمُرُّ قِطَطٌ كَسُولَةٌ بَيْنَ أَرْجُلِ الزَّبَائِنِ.", "فَوْقَ السُّوقِ سَقْفٌ مِنْ سَعَفِ النَّخِيلِ يَحْجُبُ حَرَارَةَ الشَّمْسِ، فَيَبْقَى الْهَوَاءُ فِي الدَّاخِلِ بَارِدًا مُنْعِشًا.", "وَمِنْ بَعِيدٍ يَأْتِي صَوْتُ الْبَحْرِ، لِأَنَّ السُّوقَ يَقِفُ عَلَى حَافَّةِ الْخَوْرِ مُنْذُ زَمَنٍ طَوِيلٍ."], ["طَلَبَتِ الْمُعَلِّمَةُ مِنْ طُلَّابِ الصَّفِّ الْخَامِسِ أَنْ يَصْنَعُوا رُوبُوتًا صَغِيرًا لِمَعْرِضِ الْعُلُومِ.", "اِخْتَارَتْ مَهَا صَدِيقَتَيْهَا نُورَ وَهِنْدَ، وَبَدَأَتِ الثَّلَاثُ الْعَمَلَ فِي الْمَكْتَبَةِ بَعْدَ الدَّوَامِ.", "قَرَأْنَ عَنِ الْمُحَرِّكَاتِ الصَّغِيرَةِ، وَرَسَمْنَ مُخَطَّطًا عَلَى الْوَرَقِ، ثُمَّ جَمَعْنَ الْقِطَعَ وَاحِدَةً وَاحِدَةً.", "فِي الْيَوْمِ الثَّالِثِ تَوَقَّفَ الرُّوبُوتُ عَنِ الْحَرَكَةِ، فَلَمْ تَيْأَسْ مَهَا، بَلْ فَحَصَتِ الْأَسْلَاكَ حَتَّى وَجَدَتْ سِلْكًا مَفْصُولًا.", "أَعَادَتْ تَوْصِيلَهُ فَتَحَرَّكَ الرُّوبُوتُ مِنْ جَدِيدٍ، وَصَفَّقَتِ الصَّدِيقَاتُ بِفَرَحٍ.", "فِي يَوْمِ الْمَعْرِضِ سَارَ الرُّوبُوتُ أَمَامَ الزُّوَّارِ وَرَفَعَ عَلَمَ الدَّوْلَةِ بِذِرَاعِهِ، فَقَالَتِ الْمُعَلِّمَةُ: «النَّجَاحُ يَأْتِي لِمَنْ لَا يَسْتَسْلِمُ، وَيَعْمَلُ مَعَ فَرِيقِهِ بِصَبْرٍ.»"], ["قَبْلَ سَنَوَاتٍ طَوِيلَةٍ كَانَ أَهْلُ السَّاحِلِ فِي الْإِمَارَاتِ يَعِيشُونَ مِنَ الْغَوْصِ عَلَى اللُّؤْلُؤِ.", "فِي بِدَايَةِ الصَّيْفِ تَخْرُجُ السُّفُنُ الْخَشَبِيَّةُ إِلَى الْبَحْرِ، وَتَبْقَى هُنَاكَ شُهُورًا.", "يَرْبِطُ الْغَوَّاصُ حَجَرًا ثَقِيلًا بِقَدَمِهِ لِيَنْزِلَ بِسُرْعَةٍ إِلَى الْقَاعِ، وَيَضَعُ عَلَى أَنْفِهِ مِشْبَكًا صَغِيرًا يَمْنَعُ دُخُولَ الْمَاءِ.", "يَجْمَعُ الْمَحَارَ فِي سَلَّةٍ مُعَلَّقَةٍ فِي رَقَبَتِهِ، ثُمَّ يَشُدُّ الْحَبْلَ فَيَرْفَعُهُ صَدِيقُهُ إِلَى السَّطْحِ.", "فِي الْمَسَاءِ بَعْدَ يَوْمٍ طَوِيلٍ يَفْتَحُ الْبَحَّارَةُ الْمَحَارَ وَيَبْحَثُونَ عَنِ اللُّؤْلُؤِ بِصَبْرٍ.", "كَانَ الْعَمَلُ شَاقًّا، لَكِنَّهُ عَلَّمَ النَّاسَ التَّعَاوُنَ وَالشَّجَاعَةَ، وَمَا زَالَتِ الْمَتَاحِفُ الْيَوْمَ تَحْفَظُ أَدَوَاتِ الْغَوَّاصِينَ لِيَتَعَرَّفَ الْأَطْفَالُ عَلَى حَيَاةِ أَجْدَادِهِمْ."], ["فِي صَبَاحٍ بَارِدٍ مِنْ أَيَّامِ الشِّتَاءِ ذَهَبَ حَمَدٌ مَعَ وَالِدِهِ إِلَى مِضْمَارِ سِبَاقِ الْهُجُنِ.", "وَقَفَتِ الْجِمَالُ فِي صَفٍّ طَوِيلٍ عِنْدَ خَطِّ الْبِدَايَةِ، وَعَلَى ظَهْرِ كُلِّ جَمَلٍ رَاكِبٌ آلِيٌّ صَغِيرٌ يَتَحَكَّمُ فِيهِ صَاحِبُهُ عَنْ بُعْدٍ.", "عِنْدَمَا انْطَلَقَ السِّبَاقُ ارْتَفَعَ الْغُبَارُ، وَرَكَضَتِ الْجِمَالُ بِخُطُوَاتٍ وَاسِعَةٍ نَحْوَ الْمُنْعَطَفِ الْأَوَّلِ.", "كَانَ جَمَلُ عَمِّ حَمَدٍ فِي الْمُؤَخِّرَةِ، فَقَلِقَ حَمَدٌ أَنْ يَخْسَرَ.", "لَكِنَّ الْجَمَلَ أَسْرَعَ فِي الدَّوْرَةِ الْأَخِيرَةِ حَتَّى تَجَاوَزَ ثَلَاثَةَ جِمَالٍ وَوَصَلَ ثَانِيًا.", "قَالَ الْوَالِدُ: «الْجَمَلُ الصَّبُورُ يَحْفَظُ قُوَّتَهُ لِلنِّهَايَةِ.» فَهِمَ حَمَدٌ الدَّرْسَ، وَفِي الْمَسَاءِ كَتَبَ فِي دَفْتَرِهِ بِخَطٍّ كَبِيرٍ: «لَا تَحْكُمْ عَلَى السِّبَاقِ مِنْ بِدَايَتِهِ، بَلِ انْتَظِرْ حَتَّى النِّهَايَةِ.»"], ["عِنْدَ الْغُرُوبِ يَتَحَوَّلُ لَوْنُ الْبَحْرِ فِي الْمِينَاءِ إِلَى الذَّهَبِيِّ ثُمَّ إِلَى الْبُرْتُقَالِيِّ.", "تَعُودُ قَوَارِبُ الصَّيْدِ وَاحِدًا بَعْدَ الْآخَرِ، وَتَتَمَايَلُ بِهُدُوءٍ عَلَى سَطْحِ الْمَاءِ.", "تَحُطُّ طُيُورُ النَّوْرَسِ عَلَى أَعْمِدَةِ الْخَشَبِ وَتُرَاقِبُ الصَّيَّادِينَ وَهُمْ يُفْرِغُونَ شِبَاكَهُمْ.", "تَلْمَعُ الْأَسْمَاكُ الْفِضِّيَّةُ فِي الصَّنَادِيقِ، وَيَمْتَزِجُ صَوْتُ الْأَمْوَاجِ بِضَحِكَاتِ الْأَطْفَالِ الَّذِينَ يَجْرُونَ عَلَى الرَّصِيفِ.", "تَنْتَشِرُ عَلَى الرَّصِيفِ رَائِحَةُ الْمِلْحِ وَالسَّمَكِ الطَّازَجِ، وَيُنَادِي الْبَاعَةُ عَلَى بِضَاعَتِهِمْ بِأَصْوَاتٍ مَرِحَةٍ عَالِيَةٍ.", "خَلْفَ الْقَوَارِبِ تَقِفُ سَفِينَةٌ خَشَبِيَّةٌ قَدِيمَةٌ أَشْرِعَتُهَا مَطْوِيَّةٌ، كَأَنَّهَا تَسْتَرِيحُ بَعْدَ رِحْلَةٍ طَوِيلَةٍ.", "وَحِينَ تَخْتَفِي الشَّمْسُ خَلْفَ الْمَبَانِي تُضَاءُ الْمَصَابِيحُ الصَّغِيرَةُ عَلَى طُولِ الرَّصِيفِ، فَيَبْدُو الْمِينَاءُ مِثْلَ عِقْدٍ مِنَ النُّورِ يَلْتَفُّ حَوْلَ الْمَاءِ الْهَادِئِ."], ["النَّخْلَةُ شَجَرَةٌ صَبُورَةٌ تَعِيشُ فِي الْحَرِّ الشَّدِيدِ وَتُعْطِي ثَمَرًا حُلْوًا.", "تَبْدَأُ حَيَاتُهَا مِنْ نَوَاةٍ صَغِيرَةٍ أَوْ مِنْ فَسِيلَةٍ تَنْبُتُ بِجَانِبِ الْأُمِّ.", "تَحْتَاجُ النَّخْلَةُ إِلَى مَاءٍ كَثِيرٍ وَإِلَى عِنَايَةٍ طَوَالَ الْعَامِ.", "فِي الرَّبِيعِ يَظْهَرُ عَلَى النَّخْلَةِ عُنْقُودٌ أَبْيَضُ اسْمُهُ الطَّلْعُ، وَيَضَعُ الْمُزَارِعُ فِيهِ غُبَارًا مِنْ نَخْلَةٍ أُخْرَى لِكَيْ يَتَكَوَّنَ الثَّمَرُ.", "بَعْدَ أَسَابِيعَ يَصِيرُ الثَّمَرُ أَخْضَرَ صَغِيرًا، ثُمَّ يَكْبُرُ وَيَتَحَوَّلُ إِلَى الْأَصْفَرِ، وَفِي آخِرِ الصَّيْفِ يَنْضَجُ وَيُصْبِحُ رُطَبًا طَرِيًّا.", "يَقُصُّ الْمُزَارِعُونَ الْعَنَاقِيدَ وَيَضَعُونَهَا فِي سِلَالٍ، ثُمَّ يُجَفِّفُونَ بَعْضَهَا لِيُصْبِحَ تَمْرًا يُحْفَظُ طَوَالَ السَّنَةِ.", "وَلَا يَضِيعُ شَيْءٌ مِنَ النَّخْلَةِ، فَمِنْ سَعَفِهَا تُصْنَعُ السِّلَالُ، وَمِنْ جِذْعِهَا تُبْنَى السُّقُوفُ، لِذَلِكَ سَمَّاهَا أَجْدَادُنَا «الشَّجَرَةَ الْمُبَارَكَةَ»."], ["سَافَرَ الْجَدُّ لِأُسْبُوعٍ، وَقَبْلَ أَنْ يَرْكَبَ السَّيَّارَةَ قَالَ لِخَالِدٍ: «أَتْرُكُ لَكَ صَقْرِي، فَهُوَ أَمَانَةٌ عِنْدَكَ.» شَعَرَ خَالِدٌ بِالْفَخْرِ وَالْقَلَقِ مَعًا، لِأَنَّ الصَّقْرَ لَمْ يَأْكُلْ مِنْ يَدِهِ مِنْ قَبْلُ.", "فِي الْيَوْمِ الْأَوَّلِ وَقَفَ الصَّقْرُ بَعِيدًا وَلَمْ يَقْتَرِبْ مِنَ الطَّعَامِ أَبَدًا.", "لَمْ يَغْضَبْ خَالِدٌ، بَلْ جَلَسَ قُرْبَهُ كُلَّ مَسَاءٍ يُحَدِّثُهُ بِصَوْتٍ هَادِئٍ كَمَا يَفْعَلُ الْجَدُّ.", "فِي الْيَوْمِ الرَّابِعِ مَدَّ الصَّقْرُ رَأْسَهُ وَأَكَلَ قِطْعَةَ اللَّحْمِ مِنَ الْقُفَّازِ.", "كَادَ خَالِدٌ يَصِيحُ مِنَ الْفَرَحِ، لَكِنَّهُ تَذَكَّرَ أَنَّ الصَّوْتَ الْعَالِيَ يُزْعِجُ الطُّيُورَ، فَابْتَسَمَ فِي صَمْتٍ سَعِيدٍ.", "عِنْدَمَا عَادَ الْجَدُّ وَجَدَ الصَّقْرَ قَوِيًّا نَشِيطًا، فَوَضَعَ يَدَهُ عَلَى كَتِفِ خَالِدٍ وَقَالَ: «مَنْ يَحْفَظُ الْأَمَانَةَ الصَّغِيرَةَ يُؤْتَمَنُ عَلَى الْكَبِيرَةِ.»"], ["حِينَ حَصَلَ عُمَرُ عَلَى دَرَّاجَةٍ جَدِيدَةٍ ظَنَّ أَنَّ أَسْعَدَ أَيَّامِهِ قَدْ بَدَأَتْ.", "لَكِنَّ وَالِدَهُ قَالَ لَهُ بِهُدُوءٍ: «الدَّرَّاجَةُ لَيْسَتْ لُعْبَةً فَقَطْ، بَلْ مَسْؤُولِيَّةٌ تَرْكَبُ مَعَكَ أَيْنَمَا ذَهَبْتَ.» لَمْ يَفْهَمْ عُمَرُ الْجُمْلَةَ فِي الْبِدَايَةِ، غَيْرَ أَنَّهُ فَهِمَهَا بَعْدَ أُسْبُوعٍ، عِنْدَمَا نَسِيَ الدَّرَّاجَةَ فِي الْحَدِيقَةِ تَحْتَ الْمَطَرِ.", "فِي الصَّبَاحِ وَجَدَ السِّلْسِلَةَ قَدْ صَدِئَتْ، وَالْمَقْعَدَ مُبَلَّلًا، وَالْعَجَلَتَيْنِ مَلِيئَتَيْنِ بِالطِّينِ، فَشَعَرَ بِالنَّدَمِ.", "لَمْ يَلُمْهُ وَالِدُهُ، بَلْ أَحْضَرَ الزَّيْتَ وَقِطْعَةَ قُمَاشٍ وَقَالَ: «الَّذِي يُصْلِحُ خَطَأَهُ بِيَدِهِ يَتَعَلَّمُ أَكْثَرَ مِمَّنْ لَا يُخْطِئُ.» عَمِلَا مَعًا سَاعَةً كَامِلَةً تَحْتَ الشَّمْسِ حَتَّى عَادَتِ الدَّرَّاجَةُ تَلْمَعُ، وَمُنْذُ ذَلِكَ الْيَوْمِ صَارَ عُمَرُ يُدْخِلُهَا إِلَى الْمَرْأَبِ قَبْلَ أَنْ يُغْلِقَ بَابَ الْبَيْتِ وَيَنَامَ مُطْمَئِنًّا."], ["الْمِرِّيخُ كَوْكَبٌ يَدُورُ حَوْلَ الشَّمْسِ كَمَا تَدُورُ الْأَرْضُ، لَكِنَّهُ أَبْعَدُ مِنْهَا وَأَبْرَدُ.", "يُسَمَّى الْكَوْكَبَ الْأَحْمَرَ لِأَنَّ تُرَابَهُ غَنِيٌّ بِالْحَدِيدِ الَّذِي يُعْطِيهِ لَوْنًا مَائِلًا إِلَى الْحُمْرَةِ.", "أَرْسَلَتْ دَوْلَةُ الْإِمَارَاتِ مِسْبَارًا إِلَى الْمِرِّيخِ سُمِّيَ مِسْبَارَ الْأَمَلِ، لِيَدْرُسَ غِلَافَهُ الْجَوِّيَّ وَيُرْسِلَ صُوَرًا وَمَعْلُومَاتٍ إِلَى الْعُلَمَاءِ.", "يَدُورُ الْمِسْبَارُ حَوْلَ الْكَوْكَبِ وَلَا يَهْبِطُ عَلَيْهِ، وَيُرَاقِبُ الْغُبَارَ وَالسُّحُبَ فِي فُصُولِ السَّنَةِ الْمُخْتَلِفَةِ.", "يَحْلُمُ كَثِيرٌ مِنَ الْعُلَمَاءِ بِأَنْ يَصِلَ الْإِنْسَانُ يَوْمًا إِلَى الْمِرِّيخِ، لَكِنَّ الرِّحْلَةَ طَوِيلَةٌ وَتَحْتَاجُ إِلَى شُهُورٍ فِي الْفَضَاءِ.", "لِذَلِكَ يَبْحَثُ الْمُهَنْدِسُونَ عَنْ طَرِيقَةٍ لِزِرَاعَةِ الطَّعَامِ دَاخِلَ الْمَرْكَبَةِ، وَعَنْ بُيُوتٍ تَحْمِي الرُّوَّادَ مِنَ الْبَرْدِ الشَّدِيدِ.", "وَرُبَّمَا يَكُونُ أَحَدُ هَؤُلَاءِ الرُّوَّادِ طَالِبًا يَجْلِسُ الْيَوْمَ فِي صَفٍّ مِثْلِ صَفِّكَ تَمَامًا."], ["عَلَى قِمَّةِ جَبَلٍ صَخْرِيٍّ تَقِفُ قَلْعَةٌ قَدِيمَةٌ بَنَاهَا الْأَجْدَادُ مِنَ الْحَجَرِ وَالطِّينِ لِتَحْرُسَ الْوَادِيَ الْأَخْضَرَ تَحْتَهَا.", "جُدْرَانُهَا سَمِيكَةٌ بِلَوْنِ الرَّمْلِ الدَّافِئِ، وَبَابُهَا الْخَشَبِيُّ الْكَبِيرُ مُزَيَّنٌ بِمَسَامِيرَ مِنَ الْحَدِيدِ، وَفِي أَعْلَاهَا بُرْجٌ دَائِرِيٌّ لَهُ نَوَافِذُ ضَيِّقَةٌ كَانَ الْحُرَّاسُ يَنْظُرُونَ مِنْهَا إِلَى الْبَعِيدِ.", "حِينَ تَصْعَدُ الدَّرَجَ الْحَجَرِيَّ تَشْعُرُ بِبُرُودَةِ الظِّلِّ حَتَّى فِي عِزِّ الظُّهْرِ، وَتَسْمَعُ صَدَى خُطُوَاتِكَ يَتَرَدَّدُ بَيْنَ الْجُدْرَانِ.", "مِنْ فَوْقِ الْبُرْجِ تَبْدُو بُيُوتُ الْقَرْيَةِ صَغِيرَةً كَأَنَّهَا أَلْعَابٌ، وَتَمْتَدُّ بَسَاتِينُ النَّخِيلِ مِثْلَ بِسَاطٍ أَخْضَرَ يُحِيطُ بِهِ الْجَبَلُ مِنْ كُلِّ جِهَةٍ.", "فِي الْمَسَاءِ يُلَوِّنُ الْغُرُوبُ الْحِجَارَةَ بِالذَّهَبِ، وَيَهُبُّ نَسِيمٌ بَارِدٌ يَحْمِلُ رَائِحَةَ التُّرَابِ وَالنَّعْنَاعِ.", "تَقِفُ الْقَلْعَةُ صَامِتَةً، لَكِنَّ حِجَارَتَهَا تَحْكِي لِمَنْ يُصْغِي قِصَّةَ أُنَاسٍ أَقْوِيَاءَ أَحَبُّوا أَرْضَهُمْ وَحَافَظُوا عَلَيْهَا."], ["اِسْتَعَدَّ فَرِيقُ الْمَدْرَسَةِ لِسِبَاقِ الرُّوبُوتَاتِ طَوَالَ شَهْرٍ كَامِلٍ.", "كَانَ عَلَى الرُّوبُوتِ أَنْ يَسِيرَ فِي مَمَرٍّ مُتَعَرِّجٍ، وَأَنْ يَلْتَقِطَ كُرَةً صَغِيرَةً، ثُمَّ يَضَعَهَا فِي صُنْدُوقٍ دُونَ أَنْ يَلْمَسَ الْجُدْرَانَ.", "تَوَلَّى يُوسُفُ الْبَرْمَجَةَ، وَتَوَلَّتْ لَطِيفَةُ تَرْكِيبَ الْحَسَّاسَاتِ الَّتِي تَكْشِفُ الْعَوَائِقَ.", "فِي اللَّيْلَةِ الَّتِي سَبَقَتِ السِّبَاقَ اكْتَشَفَ يُوسُفُ خَطَأً صَغِيرًا فِي الْبَرْنَامَجِ يَجْعَلُ الرُّوبُوتَ يَنْحَرِفُ إِلَى الْيَسَارِ، فَبَقِيَ يُرَاجِعُ السُّطُورَ وَاحِدًا وَاحِدًا حَتَّى وَجَدَ رَقَمًا مَكْتُوبًا فِي غَيْرِ مَكَانِهِ.", "فِي يَوْمِ السِّبَاقِ انْطَلَقَ الرُّوبُوتُ بِثَبَاتٍ، وَالْتَقَطَ الْكُرَةَ مِنَ الْمَرَّةِ الْأُولَى، بَيْنَمَا كَانَتْ لَطِيفَةُ تَحْبِسُ أَنْفَاسَهَا.", "لَمْ يَفُزِ الْفَرِيقُ بِالْمَرْكَزِ الْأَوَّلِ، لَكِنَّهُ حَصَلَ عَلَى جَائِزَةِ أَفْضَلِ تَصْمِيمٍ.", "قَالَ يُوسُفُ وَهُوَ يَحْمِلُ الْكَأْسَ: «لَوْ لَمْ نُرَاجِعِ الْبَرْنَامَجَ لَمَا وَصَلَ الرُّوبُوتُ إِلَى الصُّنْدُوقِ، فَالتَّدْقِيقُ نِصْفُ النَّجَاحِ.»"], ["يَعِيشُ الْمَحَارُ فِي قَاعِ الْخَلِيجِ دَاخِلَ صَدَفَةٍ صُلْبَةٍ تَحْمِيهِ مِنَ الْأَسْمَاكِ الْكَبِيرَةِ وَمِنَ التَّيَّارَاتِ الْقَوِيَّةِ.", "أَحْيَانًا يَدْخُلُ جِسْمٌ صَغِيرٌ غَرِيبٌ بَيْنَ الصَّدَفَةِ وَجِسْمِ الْمَحَارِ الطَّرِيِّ، فَيُسَبِّبُ لَهُ إِزْعَاجًا كَمَا تُزْعِجُكَ حَصَاةٌ فِي حِذَائِكَ.", "وَلِأَنَّ الْمَحَارَ لَا يَسْتَطِيعُ إِخْرَاجَهُ، يَبْدَأُ بِتَغْطِيَتِهِ بِطَبَقَاتٍ رَقِيقَةٍ مِنْ مَادَّةٍ لَامِعَةٍ هِيَ نَفْسُهَا الَّتِي تُبَطِّنُ صَدَفَتَهُ مِنَ الدَّاخِلِ.", "تَتَرَاكَمُ الطَّبَقَاتُ سَنَةً بَعْدَ سَنَةٍ، حَتَّى يَتَحَوَّلَ هَذَا الْجِسْمُ الْمُزْعِجُ إِلَى لُؤْلُؤَةٍ مُسْتَدِيرَةٍ تَلْمَعُ كَقَطْرَةِ ضَوْءٍ سَقَطَتْ فِي قَاعِ الْبَحْرِ.", "وَكُلَّمَا طَالَ الْوَقْتُ كَبُرَتِ اللُّؤْلُؤَةُ وَازْدَادَ جَمَالُهَا.", "قَدِيمًا كَانَ الْغَوَّاصُونَ فِي الْإِمَارَاتِ يَفْتَحُونَ آلَافَ الْمَحَارَاتِ لِيَجِدُوا لُؤْلُؤَةً وَاحِدَةً ثَمِينَةً، وَلِذَلِكَ كَانَتْ غَالِيَةً جِدًّا.", "أَمَّا الْيَوْمَ فَيَتَعَلَّمُ الطُّلَّابُ مِنْ هَذِهِ الْقِصَّةِ دَرْسًا جَمِيلًا: إِنَّ الصَّبْرَ عَلَى الْأَشْيَاءِ الْمُزْعِجَةِ قَدْ يُحَوِّلُهَا إِلَى شَيْءٍ نَفِيسٍ."], ["فِي رِحْلَةٍ مَدْرَسِيَّةٍ إِلَى جَزِيرَةٍ صَغِيرَةٍ قَالَ الْمُرْشِدُ لِلطُّلَّابِ: «عَلَى هَذَا الشَّاطِئِ تَضَعُ السَّلَاحِفُ الْبَحْرِيَّةُ بَيْضَهَا فِي اللَّيْلِ، لِذَلِكَ لَنْ نَلْمَسَ شَيْئًا وَلَنْ نَتْرُكَ وَرَاءَنَا شَيْئًا.» سَارَتْ مَيْثَاءُ مَعَ زَمِيلَاتِهَا عَلَى الرَّمْلِ النَّاعِمِ الرَّطْبِ، فَرَأَتْ آثَارًا تُشْبِهُ خُطُوطَ عَجَلَاتٍ صَغِيرَةٍ تَمْتَدُّ مِنَ الْبَحْرِ إِلَى كَثِيبٍ مُرْتَفِعٍ.", "قَالَ الْمُرْشِدُ: «هَذِهِ آثَارُ سُلَحْفَاةٍ خَرَجَتْ لَيْلَةَ أَمْسِ.» وَأَشَارَ إِلَى حُفْرَةٍ مُغَطَّاةٍ بِالرَّمْلِ حَيْثُ دَفَنَتْ بَيْضَهَا لِتَحْمِيَهُ مِنَ الشَّمْسِ وَالطُّيُورِ.", "بَيْنَمَا كَانَ الطُّلَّابُ يُصَوِّرُونَ الْآثَارَ، لَمَحَتْ مَيْثَاءُ كِيسًا بِلَاسْتِيكِيًّا قَذَفَهُ الْمَوْجُ قُرْبَ الْمَاءِ.", "تَذَكَّرَتْ أَنَّ السَّلَاحِفَ قَدْ تَظُنُّ الْأَكْيَاسَ قَنَادِيلَ بَحْرٍ وَتَبْتَلِعُهَا، فَالْتَقَطَتْهُ بِسُرْعَةٍ وَوَضَعَتْهُ فِي حَقِيبَتِهَا.", "لَمْ يَرَهَا أَحَدٌ، وَلَمْ تَطْلُبْ شُكْرًا، لَكِنَّهَا شَعَرَتْ أَنَّهَا حَمَتْ سُلَحْفَاةً لَمْ تُولَدْ بَعْدُ.", "وَفِي الْحَافِلَةِ قَالَتْ لِصَدِيقَتِهَا: «الطَّبِيعَةُ لَا تَطْلُبُ مِنَّا الْكَثِيرَ، تَطْلُبُ فَقَطْ أَلَّا نُؤْذِيَهَا.»"], ["بَعْدَ لَيْلَةٍ مِنَ الْمَطَرِ تَسْتَيْقِظُ الصَّحْرَاءُ كَأَنَّهَا تَغَيَّرَتْ فِي سَاعَاتٍ قَلِيلَةٍ.", "الرَّمْلُ الَّذِي كَانَ أَشْقَرَ خَفِيفًا صَارَ دَاكِنًا مُتَمَاسِكًا، تَلْمَعُ فِيهِ بِرَكٌ صَغِيرَةٌ تَعْكِسُ زُرْقَةَ السَّمَاءِ الصَّافِيَةِ.", "تَنْتَشِرُ فِي الْهَوَاءِ رَائِحَةُ التُّرَابِ الْمُبَلَّلِ، وَهِيَ رَائِحَةٌ يَعْرِفُهَا كُلُّ مَنْ عَاشَ هُنَا وَيَنْتَظِرُهَا سَنَةً كَامِلَةً.", "بَيْنَ الْكُثْبَانِ تَظْهَرُ نَبْتَاتٌ خَضْرَاءُ دَقِيقَةٌ كَانَتْ بُذُورُهَا نَائِمَةً تَحْتَ الرَّمْلِ تَنْتَظِرُ قَطْرَةَ مَاءٍ لِتَنْهَضَ.", "تَخْرُجُ الْخَنَافِسُ مِنْ جُحُورِهَا، وَيَقِفُ غَزَالٌ رَشِيقٌ عَلَى الْكَثِيبِ الْبَعِيدِ يَشْرَبُ مِنْ بِرْكَةٍ بِحَذَرٍ، ثُمَّ يَرْفَعُ رَأْسَهُ وَيُرَاقِبُ الْأُفُقَ.", "شَجَرَةُ الْغَافِ الْوَحِيدَةُ تَبْدُو أَكْثَرَ خُضْرَةً، وَأَغْصَانُهَا تَقْطُرُ مَاءً كَأَنَّهَا تَبْتَسِمُ.", "حَتَّى الصَّمْتُ يَبْدُو مُخْتَلِفًا؛ فَبَدَلَ صَفِيرِ الرِّيحِ الْجَافَّةِ تَسْمَعُ تَغْرِيدَ طُيُورٍ صَغِيرَةٍ جَاءَتْ مِنْ بَعِيدٍ لِتَحْتَفِلَ بِالْمَاءِ.", "بَعْدَ أَيَّامٍ قَلِيلَةٍ سَتَعُودُ الشَّمْسُ لِتُجَفِّفَ كُلَّ شَيْءٍ، لَكِنَّ الصَّحْرَاءَ تَحْفَظُ سِرَّ الْمَطَرِ فِي بُذُورِهَا حَتَّى الْمَوْسِمِ الْقَادِمِ."], ["أَعْلَنَتِ الْمَدْرَسَةُ عَنْ مُسَابَقَةٍ لِلِاخْتِرَاعَاتِ تَحْتَ عُنْوَانِ: «فِكْرَةٌ تُسَاعِدُ النَّاسَ».", "فَكَّرَ سَالِمٌ طَوِيلًا، ثُمَّ تَذَكَّرَ جَدَّتَهُ الَّتِي تَنْسَى أَحْيَانًا مَوْعِدَ دَوَائِهَا، فَقَرَّرَ أَنْ يَصْنَعَ عُلْبَةً ذَكِيَّةً تُضِيءُ وَتُصْدِرُ صَوْتًا لَطِيفًا عِنْدَ مَوْعِدِ كُلِّ حَبَّةٍ.", "اشْتَرَى الْقِطَعَ مِنْ مَصْرُوفِهِ، وَبَقِيَ أُسْبُوعَيْنِ يُحَاوِلُ وَيُخْطِئُ وَيُعِيدُ، حَتَّى احْتَرَقَ أَحَدُ الْأَسْلَاكِ الصَّغِيرَةِ فِي الْيَوْمِ الَّذِي سَبَقَ الْمُسَابَقَةَ.", "جَلَسَ سَالِمٌ أَمَامَ الْعُلْبَةِ الصَّامِتَةِ وَكَادَ يَبْكِي، لَكِنَّ أُخْتَهُ الْكُبْرَى قَالَتْ لَهُ: «الْمُخْتَرِعُ الْحَقِيقِيُّ لَا يُقَاسُ بِعَدَدِ نَجَاحَاتِهِ، بَلْ بِعَدَدِ الْمَرَّاتِ الَّتِي نَهَضَ فِيهَا.» سَهِرَ سَالِمٌ حَتَّى مُنْتَصَفِ اللَّيْلِ وَاسْتَبْدَلَ السِّلْكَ، فَعَادَتِ الْعُلْبَةُ تُضِيءُ.", "فِي الْمُسَابَقَةِ لَمْ يَشْرَحْ سَالِمٌ الْأَسْلَاكَ وَالْبَطَّارِيَّاتِ، بَلْ حَكَى عَنْ جَدَّتِهِ، فَصَمَتَ الْجُمْهُورُ ثُمَّ صَفَّقَ طَوِيلًا.", "حِينَ أُعْلِنَ فَوْزُهُ بِالْمَرْكَزِ الْأَوَّلِ لَمْ يَنْظُرْ إِلَى الْكَأْسِ، بَلْ نَظَرَ إِلَى جَدَّتِهِ الَّتِي كَانَتْ تَجْلِسُ فِي الصَّفِّ الْأَوَّلِ وَتَمْسَحُ دَمْعَةَ فَرَحٍ بِطَرَفِ شَيْلَتِهَا."], ["فِي عُطْلَةِ الشِّتَاءِ رَافَقَ نَاصِرٌ عَمَّهُ الْبَحَّارَ فِي رِحْلَةِ صَيْدٍ قَصِيرَةٍ عَلَى مَتْنِ قَارِبٍ خَشَبِيٍّ قَدِيمٍ.", "عِنْدَمَا غَابَتِ الشَّمْسُ أَطْفَأَ الْعَمُّ جِهَازَ الْمِلَاحَةِ، فَدَهِشَ نَاصِرٌ وَسَأَلَ: «كَيْفَ سَنَعْرِفُ طَرِيقَ الْعَوْدَةِ فِي هَذَا الظَّلَامِ؟» أَشَارَ الْعَمُّ إِلَى السَّمَاءِ وَقَالَ: «قَبْلَ أَنْ تُخْتَرَعَ الْأَجْهِزَةُ كَانَ أَجْدَادُنَا يَقْرَؤُونَ النُّجُومَ كَمَا تَقْرَأُ أَنْتَ كِتَابَكَ.» ثُمَّ عَلَّمَهُ كَيْفَ يَجِدُ النَّجْمَ الْقُطْبِيَّ الَّذِي يَبْقَى ثَابِتًا فِي الشَّمَالِ بَيْنَمَا تَدُورُ النُّجُومُ الْأُخْرَى حَوْلَهُ.", "أَمْسَكَ نَاصِرٌ الدَّفَّةَ بِيَدَيْنِ مُرْتَجِفَتَيْنِ، وَوَجَّهَ الْقَارِبَ نَحْوَ النَّجْمِ كَمَا قَالَ عَمُّهُ، وَبَعْدَ سَاعَةٍ هَادِئَةٍ ظَهَرَتْ أَضْوَاءُ الْمِينَاءِ الصَّغِيرَةُ عَلَى الْأُفُقِ.", "فِي الطَّرِيقِ إِلَى الْبَيْتِ قَالَ الْعَمُّ: «الْأَجْهِزَةُ الْحَدِيثَةُ مُفِيدَةٌ، لَكِنَّ الَّذِي يَفْهَمُ الْبَحْرَ وَالسَّمَاءَ لَا يَضِيعُ أَبَدًا، حَتَّى لَوْ تَوَقَّفَتْ كُلُّ الْأَجْهِزَةِ.» وَفِي تِلْكَ اللَّيْلَةِ وَقَفَ نَاصِرٌ عِنْدَ نَافِذَتِهِ، وَبَحَثَ عَنِ النَّجْمِ الْقُطْبِيِّ حَتَّى وَجَدَهُ، وَشَعَرَ أَنَّ السَّمَاءَ كُلَّهَا صَارَتْ خَرِيطَةً يَعْرِفُ قِرَاءَتَهَا."]], "D": ["صَقْرِي", "يَسْمَعُ", "حَاسُوبَهُ", "كَوْكَبَهُ", "طَبِيبَةٌ", "مُسْتَشْفًى", "صَيَّادٌ", "سَفِينَتَهُ", "بِمِنْظَارِهِ", "الْقَمَرَ", "الْمُدَرِّبُ", "الْجُمْهُورُ", "سَفِينَةَ", "مَرَاوِحَ", "الْمُزَارِعُونَ", "النَّوْرَسِ", "الْمَسْؤُولِيَّةُ", "جَاذِبِيَّةٍ", "الْمُسْتَقْبَلِ", "النُّحَاسِيَّةِ", "بَطَّارِيَّةً", "الْمُضِيفَةُ", "مُغَامَرَتِي", "الْمُسَيَّرَةُ", "اللُّؤْلُؤُ", "الْغَوَّاصُ", "التَّرْكِيزُ", "الْكَوَاكِبُ", "الْمَرَاوِحُ", "الْكُثْبَانُ", "طَازَجٌ", "الْمُهَنْدِسُونَ", "الِاعْتِرَافُ", "الصَّقَّارُونَ", "الْمِضْمَارُ", "اللِّق    $.querySelectorAll('.tile').forEach(function(b){b.onclick=function(){var j=b.dataset.j,o=order[j];if(o.w===ws[pos]){done[j]=1;pos++;if(pos===ws.length){good(tries?5:10);S.n++;k++;draw();fb(document.getElementById('fb'),true,'جملة صحيحة! 🎉');later(q,1100)}else draw()}else{tries++;S.miss++;b.classList.add('bad');setTimeout(function(){b.classList.remove('bad')},400)}}})}
  draw()}
 q()};
/* ---------- story order ---------- */
R.story=function(){S.tot=4;var stories=pick(D.P,4),k=0;
 function q(){if(k>=stories.length){finish();return}var all=stories[k],st=Math.floor(Math.random()*Math.max(1,all.length-3)),ss=all.slice(st,st+4),order=sh(ss.map(function(s,i){return {s:s,i:i}})),pos=0,tries=0,picked={};
  function draw(){$.innerHTML=hud()+'<div class="ask"><div class="t">اضغط الجمل بترتيب حدوثها في النص</div></div><div class="story">'+order.map(function(o,j){return '<button class="sline'+(picked[j]?' pick':'')+'" data-j="'+j+'">'+(picked[j]?'<span class="n">'+picked[j]+'</span>':'')+esc(o.s)+'</button>'}).join('')+'</div><div class="fb" id="fb"></div>';bindBack();
   $.querySelectorAll('.sline').forEach(function(b){b.onclick=function(){var j=b.dataset.j;if(picked[j])return;if(order[j].i===pos){pos++;picked[j]=pos;if(pos===ss.length){good(tries?5:15);S.n++;k++;draw();fb(document.getElementById('fb'),true,'ترتيب صحيح! 🎉');later(q,1300)}else draw()}else{tries++;S.miss++;b.classList.add('bad');fb(document.getElementById('fb'),false,'ليست هذه الجملة التالية');setTimeout(function(){b.classList.remove('bad')},400)}}})}
  draw()}
 q()};
/* ---------- dictation with keyboard ---------- */
var KB='ض ص ث ق ف غ ع ه خ ح ج د ش س ي ب ل ا ت ن م ك ط ئ ء ؤ ر ى ة و ز ظ ذ أ إ آ'.split(' ');
R.dict=function(){S.tot=8;var pool=pick(D.D,8),k=0;
 function q(){if(k>=pool.length){finish();return}var w=pool[k],target=strip(w).replace(/[^ء-ي]/g,''),typed='',tries=0;
  $.innerHTML=hud()+'<div class="ask"><div class="t">انظر إلى الكلمة جيدًا… ستختفي بعد 4 ثوانٍ</div><div class="big" id="show">'+esc(w)+'</div><div class="note" id="cnt">4</div></div>';bindBack();
  var c=4,iv=setInterval(function(){c--;var e=document.getElementById('cnt');if(e)e.textContent=c;if(c<=0){clearInterval(iv);typeUI()}},1000);timers.push(iv);
  function typeUI(){$.innerHTML=hud()+'<div class="ask"><div class="t">اكتب الكلمة من ذاكرتك</div><div class="typed" id="ty"></div><div class="fb" id="fb"></div></div><div class="kbd">'+KB.map(function(l){return '<button class="key" data-l="'+l+'">'+l+'</button>'}).join('')+'<button class="key f" data-f="del">⌫ امسح</button><button class="key f" data-f="peek">👀 انظر</button><button class="key f" data-f="ok" style="background:var(--grass);color:#fff">✓ تحقّق</button></div>';bindBack();
   var ty=document.getElementById('ty');
   $.querySelectorAll('.key').forEach(function(b){b.onclick=function(){var f=b.dataset.f;if(!f){typed+=b.dataset.l;ty.textContent=typed;return}
    if(f==='del'){typed=typed.slice(0,-1);ty.textContent=typed;return}
    if(f==='peek'){tries++;ty.textContent=w;setTimeout(function(){ty.textContent=typed},1200);return}
    if(typed===target){good(tries?5:10);S.n++;k++;fb(document.getElementById('fb'),true,'كتابة صحيحة! '+w);later(q,1100)}
    else{tries++;S.miss++;fb(document.getElementById('fb'),false,tries>=3?'الصحيح: '+w:'غير صحيحة، راجع الحروف');if(tries>=3){k++;S.n++;later(q,1800)}}}})}
 }
 q()};
/* ---------- quiz ---------- */
R.quiz=function(){var P=pick(D.Q,1)[0];if(!P){home();return}var qs=sh(P.q).slice(0,5);S.tot=qs.length;var k=0;
 $.innerHTML=hud()+'<div class="ask"><div class="t">اقرأ النص جيدًا، ثم اضغط «ابدأ الأسئلة»</div></div><div class="passage">'+esc(P.t)+'</div><div style="text-align:center;margin-top:14px"><button class="btn" id="go">ابدأ الأسئلة ⚡</button></div>';bindBack();
 document.getElementById('go').onclick=q;
 function q(){if(k>=qs.length){finish();return}var x=qs[k],ans=x[1],opts=sh(x.slice(1)),t=20,tries=0;
  $.innerHTML=hud()+'<div class="ask"><div class="big" style="font-size:1.5rem">'+esc(x[0])+'</div><div class="note">⏱️ <span id="qt">'+t+'</span></div></div><div class="opts">'+opts.map(function(o){return '<button class="opt" data-v="'+esc(o)+'">'+esc(o)+'</button>'}).join('')+'</div><details style="margin-top:12px"><summary>📖 عرض النص</summary><div class="passage" style="margin-top:8px">'+esc(P.t)+'</div></details><div class="fb" id="fb"></div>';bindBack();
  var iv=setInterval(function(){t--;var e=document.getElementById('qt');if(e)e.textContent=Math.max(0,t);if(t<=0)clearInterval(iv)},1000);timers.push(iv);
  $.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){if(b.dataset.v===ans){clearInterval(iv);b.classList.add('ok');good(tries?5:(t>10?15:10));S.n++;k++;fb(document.getElementById('fb'),true);later(q,900)}else{tries++;S.miss++;b.classList.add('bad');b.disabled=true}}})}
};
home();
})();
</script></body></html>
