<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>طلاقة · Talaqa</title>
<meta name="description" content="طلاقة: مكان واحد لأدوات القراءة والتحدث في قسم اللغة العربية: الطالب يجد أدواته وخطته، والمعلم يعيّن المستويات ويقرأ النتائج.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap');
:root{--bg:#EAF6FF;--card:#FFFFFF;--ink:#1D2B4F;--muted:#5B6B8C;--line:#D3E4F5;--soft:#FFF4D1;--sky:#2F9BF0;--navy:#1E6FD9;--grass:#22B866;--sun:#FFC83D;--coral:#FF6B6B;--grape:#8E5CF7;--tang:#FF9417;--ok-soft:#DDF7E8;--bad-soft:#FFE3E3;
 --ui:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;--read:"Noto Naskh Arabic","Traditional Arabic",serif;color-scheme:light}
:root[data-theme="dark"]{color-scheme:light}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--ui);font-size:17px;line-height:1.55;direction:rtl;padding-inline:16px;padding-block:0 80px;
 background-image:radial-gradient(circle at 8% 12%,#FFE48A55 0 90px,transparent 91px),radial-gradient(circle at 92% 30%,#FFB3D255 0 120px,transparent 121px),radial-gradient(circle at 15% 85%,#B8F0CC66 0 110px,transparent 111px),radial-gradient(circle at 85% 90%,#CFC0FF55 0 100px,transparent 101px);background-attachment:fixed}
*{box-sizing:border-box}#app{max-width:820px;margin-inline:auto}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit}
:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
.hero{text-align:center;padding-top:18px}.logos{display:flex;justify-content:center;gap:18px;align-items:center}.logos img{height:88px;width:auto;border-radius:50%;background:#fff;box-shadow:0 4px 0 var(--line)}
.school{color:var(--muted);font-weight:700;margin:6px 0 0}
h1{font-size:1.9rem;margin:6px 0 2px;font-weight:800;text-wrap:balance}h2{font-size:1.3rem;margin:0 0 8px;font-weight:800}h3{margin:0 0 8px;font-size:1.1rem}
.lead{color:var(--muted);margin:0 0 16px;font-size:1.05rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:14px;flex-wrap:wrap}
.chip{border:0;background:var(--card);border-radius:999px;padding:8px 16px;font-weight:800;box-shadow:0 3px 0 var(--line)}.chip.on{background:var(--sky);color:#fff;box-shadow:0 3px 0 var(--navy)}.chip.dark{background:var(--ink);color:#fff;box-shadow:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 6px 0 var(--line);margin-bottom:16px}
.stack{display:flex;flex-direction:column;gap:12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700}
.in,select.in,textarea.in{background:#F6FAFF;border:2px solid var(--line);border-radius:14px;padding:11px 14px;font-size:1.05rem;width:100%}
.in.code{text-align:center;letter-spacing:.2em;font-weight:800;font-size:1.3rem;direction:ltr}
textarea.in{line-height:1.8;resize:vertical}.mono{font-family:ui-monospace,Menlo,monospace;font-size:.85rem;direction:ltr;text-align:left;word-break:break-all}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:18px;padding:12px 22px;font-weight:800;font-size:1.1rem;background:var(--grass);color:#fff;min-height:52px;box-shadow:0 5px 0 #168A4B;text-decoration:none}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line)}.btn.small{padding:6px 14px;min-height:40px;font-size:.95rem;border-radius:12px;box-shadow:0 3px 0 #168A4B}.btn.small.ghost{box-shadow:0 3px 0 var(--line)}.btn.danger{background:var(--coral);box-shadow:0 3px 0 #C94545}.btn.w{width:100%}.btn[disabled]{opacity:.45;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.gcard{border:0;border-radius:26px;padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;background:var(--c);box-shadow:0 6px 0 var(--d);min-height:150px}.gcard .ic{font-size:3rem;line-height:1}.gcard strong{font-size:1.25rem;text-align:center}.gcard small{opacity:.9;font-weight:700}
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
.kid{background:var(--card);border:0;border-radius:22px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:1.05rem;box-shadow:0 5px 0 var(--line)}.kid .av{font-size:2.6rem;line-height:1}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.tool{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card);border-radius:28px;padding:20px 14px;text-decoration:none;box-shadow:0 7px 0 var(--line);border:4px solid transparent;text-align:center;min-height:190px;justify-content:center;position:relative}
.tool .ic{font-size:3.6rem;line-height:1}.tool strong{font-family:var(--read);font-size:1.4rem;line-height:1.4}.tool small{color:var(--muted);font-weight:700}
.tool.read{border-color:#2F9BF0}.tool.speak{border-color:#FF9417}.tool.plan{border-color:var(--grass);background:#F2FBF5}
.tag{background:var(--soft);color:#5A3A00;border-radius:999px;padding:2px 12px;font-size:.85rem;font-weight:800}.tag.g{background:var(--ok-soft);color:#13804A}
.foot{text-align:center;margin-top:30px;color:var(--muted);font-size:.95rem}.foot button{background:none;border:0;color:var(--navy);font-weight:800;text-decoration:underline;text-underline-offset:3px}
table{border-collapse:collapse;width:100%;font-size:.95rem;font-variant-numeric:tabular-nums}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}th{background:var(--soft);font-weight:800;white-space:nowrap}
td.c{font-family:ui-monospace,Menlo,monospace;direction:ltr;text-align:left;font-weight:800;letter-spacing:.12em}
.tw{overflow-x:auto;border-radius:14px;background:var(--card)}
.note{color:var(--muted);font-size:.92rem}
.tabs{display:flex;gap:6px;margin-block:10px 16px;overflow-x:auto}.tab{background:var(--card);border:0;padding:8px 16px;font-weight:800;color:var(--muted);border-radius:999px;white-space:nowrap;box-shadow:0 3px 0 var(--line)}.tab.on{color:#fff;background:var(--sky);box-shadow:0 3px 0 var(--navy)}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;z-index:9;max-width:calc(100% - 32px)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:800;background:var(--ok-soft);color:#13804A}.pill.n{background:var(--bad-soft);color:#B83838}
.sec{display:flex;align-items:center;gap:8px;background:#F6FAFF;border-radius:12px;padding:6px 10px;font-weight:700}
.chk{display:flex;align-items:center;gap:8px;background:#F6FAFF;border-radius:12px;padding:6px 10px;font-weight:700;cursor:pointer}.chk input{width:18px;height:18px}
.savebar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:#fff;padding:12px 16px;display:flex;justify-content:center;z-index:5}.savebar .in2{max-width:820px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.savebar[hidden]{display:none!important}
.plancard{background:#F2FBF5;border:3px solid var(--grass);border-radius:20px;padding:14px 16px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
details{background:var(--card);border-radius:16px;padding:10px 14px;box-shadow:0 4px 0 var(--line)}summary{font-weight:800;cursor:pointer}
tr.flag td{background:#FFF6DC}
.brand-t{font-size:2.6rem;letter-spacing:.02em;margin-bottom:0}.brand-t span{font-size:1.1rem;color:var(--navy);font-weight:800;letter-spacing:.12em;vertical-align:middle}.slogan{margin:0 0 14px;color:var(--grape);font-weight:800;font-size:1.15rem}
</style></head><body>

<script>
(function(){
var DATA=JSON.parse(document.getElementById('seed').textContent),$app=document.getElementById('app');
var store={get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fnv(s){var h=0x811c9dc5;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h.toString(16)}
function toast(m){var t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2800)}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function b64e(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)))}
function norm(t){return String(t||'').trim().replace(/\s+/g,' ')}
function nkey(s){return norm(s).replace(/[ً-ْٰـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').toUpperCase()}
/* ---- crypto-lite (same scheme as the tools) ---- */
function rcNorm(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'')}
function rcStream(code,sec,n){var o=[];for(var i=0;o.length<n;i++){var h=parseInt(fnv(code+'|'+sec+'|'+i),16);o.push(h&255,(h>>>8)&255,(h>>>16)&255,(h>>>24)&255)}return o}
function rcX(code,sec,s){var k=rcStream(code,sec,s.length),r='';for(var i=0;i<s.length;i++)r+=String.fromCharCode(s.charCodeAt(i)^k[i]);return r}
function rcEnc(code,sec,txt){return btoa(rcX(code,sec,unescape(encodeURIComponent(txt))))}
function rcDec(code,sec,x){return decodeURIComponent(escape(rcX(code,sec,atob(x))))}
function rcHash(sec,code){return fnv('rc|'+sec+'|'+code)}
function names(txt){return String(txt||'').split(/[،,\n]/).map(norm).filter(Boolean)}
function secPins(sec,code){code=rcNorm(code);var L=DATA.secs[sec];if(!L||!L.p||L.h!==rcHash(sec,code))return null;try{return JSON.parse(rcDec(code,sec,L.p))}catch(e){return null}}
function pinTable(sec,code){var P=secPins(sec,code);if(!P)return '<p class="note">لا توجد رموز شخصية محفوظة لهذه الشعبة بعد.</p>';return '<div class="tw"><table><thead><tr><th>#</th><th>الطالب</th><th>الرمز الشخصي</th></tr></thead><tbody>'+Object.keys(P).map(function(n,i){return '<tr><td>'+(i+1)+'</td><td>'+esc(n)+'</td><td class="c">'+esc(P[n])+'</td></tr>'}).join('')+'</tbody></table></div>'}
function pinTsv(){var out=['الشعبة\tالطالب\tرمز الشعبة\tالرمز الشخصي'];var secs=T?tSecs():Object.keys(KN||{}).sort();secs.forEach(function(s){var c=T?T.codes[s]:KN[s];var P=c&&secPins(s,c);if(!P)return;Object.keys(P).forEach(function(n){out.push(s+'\t'+n+'\t'+c+'\t'+P[n])})});return out.join('\n')}
function secOpen(sec,code){code=rcNorm(code);var L=DATA.secs[sec];if(!L||L.h!==rcHash(sec,code))return null;try{return names(rcDec(code,sec,L.x))}catch(e){return null}}
function secOf(secId){return secId.indexOf('KG')===0?'KG':secId.split('-')[0]}
function gradeOf(id){for(var i=0;i<DATA.grades.length;i++)if(DATA.grades[i].id===id)return DATA.grades[i];return null}
function toolsFor(g){return DATA.tools.filter(function(t){return t.grades.indexOf(g)>=0})}
function tool(id){for(var i=0;i<DATA.tools.length;i++)if(DATA.tools[i].id===id)return DATA.tools[i];return null}
/* ---- state ---- */
var canEdit=false,isOwn=false,dirty=false,UNL={},T=null /* teacher session {t, codes} */,view={n:'home'},tab='view',otab='teachers';
var ME=store.get('pt_me',null); /* {sec,name} */
if(ME&&ME.pv){ME=null;store.set('pt_me',null)}
(function(){try{var m=(location.hash||'').match(/me=([A-Za-z0-9_-]+)/);if(!m)return;var o=JSON.parse(b64d(m[1])),c=rcNorm(o.c),pc=String(o.p||'');Object.keys(DATA.secs).forEach(function(s){if(DATA.secs[s].h!==rcHash(s,c))return;var P=secPins(s,c);var nm=P&&Object.keys(P).filter(function(n){return String(P[n])===pc})[0];if(nm){ME={sec:s,name:nm,c:c,p:pc};store.set('pt_me',ME);window.__qr=1}});try{history.replaceState(null,'',location.pathname)}catch(e){}}catch(e){}})();
var PVK=null;
var PLAN=store.get('pt_plan',null);
function planFromHash(){try{var m=(location.hash||'').match(/pl=([A-Za-z0-9_.-]+)/);if(m){var p=decodePlan(m[1]);if(p){PLAN=p;store.set('pt_plan',p)}}}catch(e){}}
function decodePlan(code){try{code=String(code||'').trim();if(code.indexOf('PL.')!==0)return null;var o=JSON.parse(b64d(code.slice(3)));if(!o.t)return null;o.code=code;return o}catch(e){return null}}
function planFor(me){if(!PLAN||!me)return null;if(PLAN.c&&nkey(PLAN.c)!==nkey(me.sec))return null;if(PLAN.n&&!PLAN.n.some(function(x){return nkey(x)===nkey(me.name)}))return null;return PLAN}
planFromHash();
/* ---- views: student ---- */
function hero(){var L=DATA.logos||{};return '<div class="hero"><div class="logos">'+(L.school?'<img src="'+L.school+'" alt="شعار المدرسة">':'')+(L.dept?'<img src="'+L.dept+'" alt="شعار قسم اللغة العربية">':'')+'</div><p class="school">'+esc(DATA.school)+'</p><h1 class="brand-t">طَلَاقَة <span>Talaqa</span></h1><p class="slogan">اقرأ بثقة… تحدّث بفصاحة</p></div>'}
function vHome(){
 var h=hero();
 if(ME)return h+'<p class="lead" style="text-align:center">مرحبًا '+esc(ME.name)+' · '+esc(ME.sec)+'</p><div class="row" style="justify-content:center"><button class="btn" data-a="me">🚀 أدواتي</button><button class="btn ghost" data-a="notme">لستُ '+esc(ME.name)+'</button></div>'+foot();

}
var AV=['🦁','🐼','🦊','🐸','🐨','🦄','🐯','🐵','🐧','🐢','🦋','🐬','🦒','🐝','🦉','🐙','🦖','🐣','🐳','🦔'];
function foot(){return '<p class="foot"><button data-a="tin">👩‍🏫 للمعلم</button> · <button data-a="pvin">👀 معاينة</button>'+(canEdit?' · <button data-a="own">🛠️ لوحة المنسق</button>':'')+'</p>'}
function vMe(){
 var g=secOf(ME.sec),G=gradeOf(g),ts=toolsFor(g),p=planFor(ME);
 var h='<header class="top"><button class="chip" data-a="home">🏠 البداية</button><span class="chip">'+esc(ME.name)+' · '+esc(ME.sec)+'</span></header>';
 h+='<h1>'+(G?G.icon+' ':'')+'أدواتي</h1>';
 if(p){h+='<div class="plancard"><strong>📌 خطتك من '+esc(p.by||'معلمك')+' ('+esc(p.d||'')+')</strong>'+(p.m?'<p style="margin:6px 0 0">'+esc(p.m)+'</p>':'')+'</div>'}

  var r=row(o.n,o.c),t=tool(o.t),cur=r.tools[o.t];if(o.g)r.devs[o.g]=1;
