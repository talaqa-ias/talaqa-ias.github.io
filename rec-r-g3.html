<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>طلاقة · تسجيل روتين التحدّث · الصف الثالث</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;700&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--ink:#1D2B4F;--blue:#3B6D95;--teal:#29BFCF;--gold:#E0A82E;--cream:#FFF7DD;--bg:#EEF6FB;--ok:#22B866;--bad:#E5484D;--card:#fff;--mut:#5B6B85}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:10px;justify-content:center;margin:6px 0 14px}header img{width:52px;height:52px;border-radius:50%;background:#fff}
h1{font-size:1.5rem;margin:.2em 0;text-align:center}.lead{color:var(--mut);text-align:center;margin:0 0 14px}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:0 4px 0 rgba(29,43,79,.08);margin-bottom:14px}
.who{display:grid;gap:12px}.who button{display:flex;justify-content:space-between;align-items:center;font:inherit;font-size:1.25rem;font-weight:800;border:0;border-radius:18px;padding:18px;background:#fff;color:var(--ink);box-shadow:0 4px 0 rgba(29,43,79,.12);cursor:pointer;text-align:right}
.who small{font-weight:500;color:var(--mut);font-size:.95rem}
.tips li{margin:6px 0}.bar{height:10px;background:#dde8f1;border-radius:9px;overflow:hidden}.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--ok))}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.95rem;margin:8px 0}
.txt{font-family:"Noto Naskh Arabic",serif;font-size:clamp(1.9rem,6vw,2.8rem);line-height:2.1;text-align:center;padding:12px 4px;font-weight:700}
.note{background:var(--cream);border-radius:12px;padding:10px 12px;color:#5A3A00;font-size:1rem}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.btn{font:inherit;font-weight:800;font-size:1.1rem;border:0;border-radius:16px;padding:14px 18px;min-height:56px;cursor:pointer;background:var(--blue);color:#fff;box-shadow:0 4px 0 #24496a}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 rgba(29,43,79,.15)}
.btn.rec{background:var(--bad);box-shadow:0 4px 0 #a52a2e;min-width:180px;font-size:1.25rem}.btn.rec.on{animation:pulse 1s infinite}
.btn:disabled{opacity:.45;cursor:default}
@keyframes pulse{50%{transform:scale(1.04)}}
.meter{height:14px;border-radius:8px;background:#e9eef4;overflow:hidden;margin-top:12px}.meter b{display:block;height:100%;width:0;background:var(--ok);transition:width .08s}
.st{text-align:center;margin-top:10px;font-weight:700;min-height:1.4em}.st.ok{color:var(--ok)}.st.bad{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;margin-top:10px}.grid button{font:inherit;border:0;border-radius:10px;padding:8px 0;background:#e9eef4;cursor:pointer;font-weight:700}.grid button.done{background:#c9f0d8}.grid button.cur{outline:3px solid var(--blue)}
footer{color:var(--mut);font-size:.85rem;text-align:center;margin:18px 0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1726;--card:#18233a;--ink:#EAF1FA;--mut:#a9b6c9;--cream:#3a3220}.who button,.btn.ghost{background:#22304d;color:var(--ink)}.grid button{background:#22304d;color:var(--ink)}.note{color:#ffe7b0}}
</style></head><body><div class="wrap">

<script>
(function(){

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function grp(c){return (c.use||'').split(' · ')[0].replace(/^محطة: .*|^إجابة .*|^بداية .*|^نهاية .*|^العد$/,'عام')}

/* IndexedDB */

function tx(mode){return dbp.then(function(db){return db.transaction('clips',mode).objectStore('clips')})}
function put(k,v){return tx('readwrite').then(function(s){return new Promise(function(r,j){var q=s.put(v,k);q.onsuccess=r;q.onerror=function(){j(q.error)}})})}

 var nh=D.clips.filter(function(c){return have[K(c)]}).length;app.innerHTML+='<div class="card" style="text-align:center"><button class="btn" id="exp0"'+(nh?'':' disabled')+'>📦 تصدير كل التسجيلات ('+nh+')</button><div class="st" id="st"></div><div class="note">يُجهَّز التصدير في ملفات صغيرة (40 مقطعًا لكل ملف) تُنزَّل أو تُشارَك واحدًا واحدًا عبر واتساب/تيمز.</div></div>';var e0=$('exp0');if(e0)e0.onclick=exportZip;

function $(id){return document.getElementById(id)}

}
